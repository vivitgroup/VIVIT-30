name: Apply VIVIT QA checkpoint
on:
  push:
    branches: [fix/full-system-qa-v36]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[qa-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-system-qa-v36
          fetch-depth: 0
      - name: Apply verified QA patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/vivit-qa.patch
          git apply --index /tmp/vivit-qa.patch
          git config user.name "VIVIT QA"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Apply full system QA and mobile hardening"
          git push origin HEAD:fix/full-system-qa-v36
