name: Build Diagnostic

on:
  push:
    branches:
      - audit/finance-deep-2026-09-01

permissions:
  contents: read

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        id: dependency-audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: TypeScript
        run: npm run type-check
      - name: Next production compile
        run: npx next build
