name: Build Diagnostic

on:
  push:
    branches:
      - main
      - audit/finance-deep-2026-09-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-only placeholder. Next.js imports API route modules while collecting
      # route metadata, and lib/db.ts validates that DATABASE_URL exists at import
      # time. No database connection is made by this diagnostic build.
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/vivit_build
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        id: dependency-audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: TypeScript
        run: npm run type-check
      - name: Next production compile
        run: npx next build
