name: Client and File Audit

on:
  push:
    branches:
      - audit/finance-deep-2026-09-01

permissions:
  contents: read

jobs:
  client-file-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: File and storage contract
        run: node scripts/qa-file-storage.mjs
      - name: Client onboarding and finance handoff contract
        run: node scripts/qa-client-onboarding.mjs
      - name: Existing client lifecycle regression
        run: node scripts/qa-clients.mjs
      - name: ESLint zero warnings
        run: npm run lint -- --max-warnings=0
      - name: TypeScript
        run: npm run type-check
