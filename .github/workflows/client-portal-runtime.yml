name: Client Portal Runtime Certification

on:
  push:
    branches:
      - audit/finance-deep-2026-09-01

permissions:
  contents: read

jobs:
  client-portal-runtime:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/vivit_build
      NEXTAUTH_SECRET: exact-head-ci-runtime-secret-not-for-production
      AUTH_SECRET: exact-head-ci-runtime-secret-not-for-production
      NEXTAUTH_URL: http://127.0.0.1:3000
      AUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run type-check
      - name: Build exact-head artifact
        run: npx next build
      - name: Start built server
        run: |
          npm start > /tmp/vivit-client-runtime.log 2>&1 &
          echo $! > /tmp/vivit-client-runtime.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vivit-client-runtime.log
          exit 1
      - name: Client Portal built runtime smoke
        run: node scripts/qa-client-portal-runtime-smoke.mjs
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/vivit-client-runtime.log || true
