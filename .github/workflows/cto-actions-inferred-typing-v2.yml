name: CTO Actions Inferred Typing V2

on:
  push:
    branches: [feat/vivito-internal-100]
    paths:
      - .github/workflows/cto-actions-inferred-typing-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply schema-inferred action contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/actions/index.ts')
          s=p.read_text()
          s=s.replace('import { auth } from "@/lib/auth";','import { auth } from "@/lib/auth";\nimport type { Session } from "next-auth";')
          s=s.replace('  creativeTasks, users, webhooks, fileDocuments } from "@/lib/db";','  creativeTasks, users, fileDocuments } from "@/lib/db";')
          s=s.replace('import { eq, and, inArray, notInArray, desc } from "drizzle-orm";','import { eq, and } from "drizzle-orm";')
          old='''function validateEmail(email: string): boolean {\n  return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email) && email.length <= 254;\n}\n'''
          if old not in s: raise SystemExit('validateEmail block not found')
          s=s.replace(old,'')
          old='''function requireFields(data: Record<string, any>, fields: string[]): string | null {\n  for (const f of fields) {\n    if (!data[f] || String(data[f]).trim() === "") return `${f} is required`;\n  }\n  return null;\n}\nfunction roleOf(session:any):string { return String(session?.user?.role||""); }\nfunction requireRole(session:any, allowed:string[]) {\n  if (!session?.user) throw new Error("Unauthorized");\n  if (!allowed.includes(roleOf(session))) throw new Error("Forbidden");\n}\nasync function requireClientAccess(session:any, clientId:string, write=false) {'''
          new='''type AuthSession=Session|null;\ntype AuthenticatedSession=Session&{user:NonNullable<Session["user"]>};\ntype CreativeTaskInsert=typeof creativeTasks.$inferInsert;\ntype TaskType=CreativeTaskInsert["type"];\ntype TaskPriority=CreativeTaskInsert["priority"];\ntype TaskStatus=CreativeTaskInsert["status"];\nconst TASK_TYPES:readonly TaskType[]=["REEL","GRAPHIC","CAROUSEL","MOTION_GRAPHIC","VIDEO_EDIT","PHOTO_SESSION","STORY","UGC"];\nconst TASK_PRIORITIES:readonly TaskPriority[]=["URGENT","HIGH","MEDIUM","LOW"];\nconst TASK_STATUSES:readonly TaskStatus[]=["PENDING","IN_PROGRESS","REVIEW","APPROVED","REJECTED","REVISION","COMPLETED"];\nfunction isTaskType(value:string):value is TaskType{return (TASK_TYPES as readonly string[]).includes(value);}\nfunction isTaskPriority(value:string):value is TaskPriority{return (TASK_PRIORITIES as readonly string[]).includes(value);}\nfunction isTaskStatus(value:string):value is TaskStatus{return (TASK_STATUSES as readonly string[]).includes(value);}\nfunction roleOf(session:AuthSession):string { return String(session?.user?.role||""); }\nfunction requireRole(session:AuthSession, allowed:string[]):asserts session is AuthenticatedSession {\n  if (!session?.user) throw new Error("Unauthorized");\n  if (!allowed.includes(roleOf(session))) throw new Error("Forbidden");\n}\nasync function requireClientAccess(session:AuthSession, clientId:string, write=false) {'''
          if old not in s: raise SystemExit('session helper block not found')
          s=s.replace(old,new)
          old='''  const allowedTypes=["REEL","GRAPHIC","CAROUSEL","MOTION_GRAPHIC","VIDEO_EDIT","PHOTO_SESSION","STORY","UGC"],allowedPriorities=["URGENT","HIGH","MEDIUM","LOW"];\n  const deadlineDate=new Date(deadline);\n  if(!title||!clientId||!brief||!allowedTypes.includes(type)||!allowedPriorities.includes(priority)||!deadline||Number.isNaN(deadlineDate.getTime()))throw new Error("Invalid task data");'''
          new='''  const deadlineDate=new Date(deadline);\n  if(!title||!clientId||!brief||!isTaskType(type)||!isTaskPriority(priority)||!deadline||Number.isNaN(deadlineDate.getTime()))throw new Error("Invalid task data");'''
          if old not in s: raise SystemExit('task guard block not found')
          s=s.replace(old,new)
          s=s.replace('title, clientId, type: type as any, brief, tov: tov || null,\n    priority: priority as any, status: "PENDING",','title, clientId, type, brief, tov: tov || null,\n    priority, status: "PENDING",')
          marker='  const taskBefore=await taskForAccess(taskId);\n  const role=roleOf(session),uid=session.user.id!;'
          if marker not in s: raise SystemExit('status marker not found')
          s=s.replace(marker,'  if(!isTaskStatus(status))throw new Error("Invalid task status");\n'+marker,1)
          s=s.replace('status: status as any,','status,')
          s=s.replace(' } as any)', ' })')
          s=s.replace('  } as any).returning();', '  }).returning();')
          s=s.replace('    } as any)\n    .where', '    })\n    .where')
          p.write_text(s)
          PY
      - name: Verify zero-any target and TypeScript
        run: |
          if grep -nE 'as any|: *any\b|<[^>]*\bany\b' lib/actions/index.ts; then echo 'explicit any remains'; exit 1; fi
          npx eslint lib/actions/index.ts --max-warnings=0
          npm run type-check
      - name: Commit source-only action typing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cto-actions-inferred-typing-v2.yml
          git add lib/actions/index.ts
          git commit -m "fix(types): infer server action contracts"
          git push origin HEAD:feat/vivito-internal-100
      - name: Remove transient workflow after failed gate
        if: failure()
        run: |
          git reset --hard HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cto-actions-inferred-typing-v2.yml
          git commit -m "chore(cto): remove failed action typing v2 workflow"
          git push origin HEAD:feat/vivito-internal-100
