name: CTO Client Portal Closeout
on:
  push:
    branches: [feat/vivito-internal-100]
permissions:
  contents: write
jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Harden portal lifecycle writes and QA contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/portal/page.tsx')
          s=p.read_text()
          s=s.replace('workspace_id=${workspaceId} and archived_at is null`);','workspace_id=${workspaceId} and archived_at is null and deleted_at is null`);')
          p.write_text(s)

          q=Path('scripts/qa-client-portal-v2.mjs')
          s=q.read_text()
          s=s.replace('[\\s\\S]*archived_at is null order by updated_at','[\\s\\S]*archived_at is null[\\s\\S]*deleted_at is null[\\s\\S]*order by updated_at')
          s=s.replace('[\\s\\S]*archived_at is null limit 1','[\\s\\S]*archived_at is null[\\s\\S]*deleted_at is null[\\s\\S]*limit 1')
          s=s.replace('[\\s\\S]*archived_at is null/.test(p)&&/update creative_tasks set approved_by_client=false','[\\s\\S]*archived_at is null[\\s\\S]*deleted_at is null/.test(p)&&/update creative_tasks set approved_by_client=false')
          s=s.replace('[\\s\\S]*archived_at is null/.test(p));','[\\s\\S]*archived_at is null[\\s\\S]*deleted_at is null/.test(p));')
          q.write_text(s)
          PY
      - run: node scripts/qa-client-portal-v2.mjs
      - run: npm run type-check
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/portal/page.tsx scripts/qa-client-portal-v2.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(portal): harden lifecycle approval contract"
          git push origin HEAD:feat/vivito-internal-100
