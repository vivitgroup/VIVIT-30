name: CTO Client Workspace Lint Closeout
on:
  push:
    branches: [feat/vivito-internal-100]
permissions:
  contents: write
jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove dead KPI helpers and honor effective accountant role
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/clients/[id]/page.tsx')
          s=p.read_text()
          s=s.replace('const asRecord=(value:unknown):Record<string,unknown>=>value!==null&&typeof value==="object"&&!Array.isArray(value)?value as Record<string,unknown>:{};\n','')
          s=s.replace('const numeric=(value:unknown)=>typeof value==="number"?value:typeof value==="string"?Number(value)||0:0;\n','')
          s=s.replace('const metric=(x:CampaignRow,_start:string,_end:string):CampaignMetric=>', 'const metric=(x:CampaignRow):CampaignMetric=>')
          s=s.replace('const roles=effectiveRoles(s.user),role=String(s.user.role||""),uid=', 'const roles=effectiveRoles(s.user),uid=', 1)
          s=s.replace('const roles=effectiveRoles(s.user),role=String(s.user.role||""),uid=', 'const roles=effectiveRoles(s.user),uid=', 1)
          marker='const canOperate=roles.some(r=>["SUPER_ADMIN","ACCOUNT_MANAGER","MEDIA_BUYER"].includes(String(r))),canFinance=roles.some(r=>["SUPER_ADMIN","ACCOUNTANT"].includes(String(r)));'
          repl=marker+'const accountantOnly=roles.includes("ACCOUNTANT")&&!canOperate;'
          s=s.replace(marker,repl)
          s=s.replace('role==="ACCOUNTANT"?', 'accountantOnly?')
          s=s.replace('metric(x,from,to)', 'metric(x)')
          s=s.replace('{role!=="ACCOUNTANT"&&<>', '{!accountantOnly&&<>')
          p.write_text(s)
          PY
      - run: npx eslint 'app/dashboard/clients/[id]/page.tsx' --max-warnings=0
      - run: npm run type-check
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/dashboard/clients/[id]/page.tsx'
          git diff --cached --quiet && exit 0
          git commit -m "fix(clients): clean workspace role and KPI dead code"
          git push origin HEAD:feat/vivito-internal-100
