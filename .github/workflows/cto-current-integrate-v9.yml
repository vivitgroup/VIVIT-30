name: CTO Current Integrate V9

on:
  push:
    branches: [feat/vivito-static-current-integrate-v9]
    paths: ['.github/workflows/cto-current-integrate-v9.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-static-current-integrate-v9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
      - name: Integrate verified source batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'
          git fetch origin feat/vivito-media-types-v8 feat/vivito-portal-types-v8
          for sha in a2047b3fe275975e514923b9563bec143565ffc1 8921722; do
            git cherry-pick "$sha"
            npm run type-check
            node scripts/qa-cto-static-audit.mjs
            git diff --check HEAD^ HEAD
          done
      - name: Final lint acceptance
        shell: bash
        run: |
          npx eslint . -f json > /tmp/e.json || true
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');const rows=JSON.parse(fs.readFileSync('/tmp/e.json','utf8'));const m=rows.flatMap(r=>r.messages||[]),a=m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any'),n=m.filter(x=>x.ruleId!=='@typescript-eslint/no-explicit-any');
          console.log(`remaining_total=${m.length}`);console.log(`remaining_any=${a.length}`);console.log(`remaining_non_any=${n.length}`);console.log(`remaining_warnings=${m.filter(x=>x.severity===1).length}`);
          const out=[];for(const r of rows){const ms=(r.messages||[]).filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any');if(ms.length)out.push([path.relative(process.cwd(),r.filePath).replaceAll('\\','/'),ms.length])}out.sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0]));console.log('hotspots='+JSON.stringify(out.slice(0,30)));
          if(n.length||m.filter(x=>x.severity===1).length)process.exit(1)
          NODE
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
      - name: Push accepted candidate
        run: git push origin HEAD:feat/vivito-static-current-integrate-v9