name: CTO Deps Cleanup V6
on:
  push:
    branches: [feat/vivito-static-deps-v6]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-static-deps-v6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
      - name: Stabilize remaining hook dependencies
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          function one(file,from,to,count=1){let s=fs.readFileSync(file,'utf8');const n=s.split(from).length-1;if(n!==count)throw new Error(`${file}: expected ${count}, found ${n}: ${from.slice(0,100)}`);fs.writeFileSync(file,s.split(from).join(to))}

          const media=[
            ['components/media/MediaControlV2.tsx','import {useEffect,useMemo,useState} from "react";','import {useCallback,useEffect,useMemo,useState} from "react";','async function load(start=from,end=to){','const load=useCallback(async(start:string,end:string)=>{'],
            ['components/media/MediaIntelligenceWorkspace.tsx','import {useEffect,useState} from "react";','import {useCallback,useEffect,useState} from "react";','async function load(a=from,b=to){','const load=useCallback(async(a:string,b:string)=>{'],
            ['components/media/MediaIntelligenceWorkspaceV2.tsx','import {useEffect,useState} from "react";','import {useCallback,useEffect,useState} from "react";','async function load(a=from,b=to){','const load=useCallback(async(a:string,b:string)=>{']
          ];
          for(const [file,impOld,impNew,startOld,startNew] of media){
            let s=fs.readFileSync(file,'utf8');
            if((s.split(impOld).length-1)!==1)throw new Error(`${file}: import mismatch`);
            s=s.replace(impOld,impNew);
            if((s.split(startOld).length-1)!==1)throw new Error(`${file}: load start mismatch`);
            s=s.replace(startOld,startNew);
            const effectNeedle='useEffect(()=>{const timer=setTimeout(()=>void load(defaultFrom,today),0);return()=>clearTimeout(timer)},[]);';
            const i=s.indexOf(effectNeedle);if(i<0)throw new Error(`${file}: initial effect mismatch`);
            let j=i-1;while(j>=0&&/\s/.test(s[j]))j--;if(s[j]!=='}')throw new Error(`${file}: load close missing`);
            s=s.slice(0,j)+'},[]);'+s.slice(j+1);
            s=s.replace(effectNeedle,'useEffect(()=>{const timer=setTimeout(()=>void load(defaultFrom,today),0);return()=>clearTimeout(timer)},[defaultFrom,today,load]);');
            const interval='useEffect(()=>{const t=setInterval(()=>load(from,to),30000);return()=>clearInterval(t)},[from,to]);';
            if((s.split(interval).length-1)!==1)throw new Error(`${file}: interval effect mismatch`);
            s=s.replace(interval,'useEffect(()=>{const t=setInterval(()=>void load(from,to),30000);return()=>clearInterval(t)},[from,to,load]);');
            s=s.split('load()').join('load(from,to)');
            fs.writeFileSync(file,s);
            console.log(`media_stabilized=${file}`);
          }

          const meta='components/media/MetaAccountConnectPanel.tsx';
          let s=fs.readFileSync(meta,'utf8');
          const oldImport='import {useEffect,useRef,useState} from "react";';
          if((s.split(oldImport).length-1)!==1)throw new Error('Meta import mismatch');
          s=s.replace(oldImport,'import {useCallback,useEffect,useRef,useState} from "react";');
          const from=` const autoRan=useRef(false);\n async function load(){const to=iso(new Date()),r=await fetch(\`/api/media-control-v2?from=\${CUTOFF}&to=\${to}\`,{cache:"no-store"}),d=await read(r);if(r.ok)setData(d)}\n useEffect(()=>{const timer=setTimeout(()=>{void load();const q=new URLSearchParams(location.search),oauth=q.get("oauth"),connectionId=q.get("connectionId");if(oauth==="success"&&connectionId){setTone("info");setMsg("Meta connected. Updating campaign data…");void syncAll(connectionId,true)}else if(oauth==="error"){setTone("warn");setMsg(q.get("message")||"Meta connection failed")};history.replaceState({},"",location.pathname)},0);return()=>clearTimeout(timer)},[]);\n useEffect(()=>{const timer=setTimeout(()=>{if(autoRan.current)return;const accounts=(data.accountGroups||[]).filter((a:any)=>a.platform==="META"&&a.status!=="DISABLED"&&(a.status==="CONNECTED"||a.status==="ERROR"));if(!accounts.length)return;autoRan.current=true;const stale=accounts.filter((a:any)=>!a.lastSyncAt||Date.now()-new Date(a.lastSyncAt).getTime()>STALE_MS);if(!stale.length){setTone("ok");setMsg("");return}void (async()=>{setTone("info");setMsg("Updating Meta data…");for(let i=0;i<stale.length;i++){const result=await syncAll(stale[i].id,true,false);if(result?.rateLimited){setTone("warn");setMsg("Meta is temporarily rate-limiting requests. Showing the latest successful data; automatic sync will retry later.");break}if(i<stale.length-1)await sleep(1200)}await load();if(!isRateLimit(msg)){setTone("ok");setMsg("")}})()},0);return()=>clearTimeout(timer)},[data.accountGroups]);\n function connect(a:any){const p=new URLSearchParams({clientId:a.clientId,adAccountId:String(a.adAccountId||"").replace(/^act_/i,""),accountName:a.accountName||"Meta Ad Account"});router.push(\`/api/ad-oauth/meta/start?\${p}\`)}\n async function syncAll(id:string,auto=false,reload=true){setBusy(id);if(!auto){setTone("info");setMsg("")}const r=await fetch("/api/media-discover",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({connectionId:id})}),d=await read(r),rateLimited=isRateLimit(d.error)||isRateLimit(d.failures?.map((x:any)=>x.error).join(" "));if(r.ok&&!rateLimited){if(!auto){setTone("ok");setMsg(\`Updated \${d.synced||0} campaigns from Meta.\`)}}else if(rateLimited){setTone("warn");setMsg("Meta is temporarily rate-limiting requests. Latest successful data is still available and sync will retry automatically.")}else{setTone("warn");setMsg(d.error||"Meta refresh failed")}setBusy("");if(reload)await load();return{ok:r.ok,rateLimited}}\n`;
          const to=` const autoRan=useRef(false);\n const load=useCallback(async()=>{const to=iso(new Date()),r=await fetch(\`/api/media-control-v2?from=\${CUTOFF}&to=\${to}\`,{cache:"no-store"}),d=await read(r);if(r.ok)setData(d)},[]);\n const syncAll=useCallback(async(id:string,auto=false,reload=true)=>{setBusy(id);if(!auto){setTone("info");setMsg("")}const r=await fetch("/api/media-discover",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({connectionId:id})}),d=await read(r),rateLimited=isRateLimit(d.error)||isRateLimit(d.failures?.map((x:any)=>x.error).join(" "));if(r.ok&&!rateLimited){if(!auto){setTone("ok");setMsg(\`Updated \${d.synced||0} campaigns from Meta.\`)}}else if(rateLimited){setTone("warn");setMsg("Meta is temporarily rate-limiting requests. Latest successful data is still available and sync will retry automatically.")}else{setTone("warn");setMsg(d.error||"Meta refresh failed")}setBusy("");if(reload)await load();return{ok:r.ok,rateLimited}},[load]);\n useEffect(()=>{const id=window.setTimeout(()=>{void (async()=>{await load();const q=new URLSearchParams(location.search),oauth=q.get("oauth"),connectionId=q.get("connectionId");if(oauth==="success"&&connectionId){setTone("info");setMsg("Meta connected. Updating campaign data…");await syncAll(connectionId,true)}else if(oauth==="error"){setTone("warn");setMsg(q.get("message")||"Meta connection failed")};history.replaceState({},"",location.pathname)})()},0);return()=>window.clearTimeout(id)},[load,syncAll]);\n useEffect(()=>{const id=window.setTimeout(()=>{if(autoRan.current)return;const accounts=(data.accountGroups||[]).filter((a:any)=>a.platform==="META"&&a.status!=="DISABLED"&&(a.status==="CONNECTED"||a.status==="ERROR"));if(!accounts.length)return;autoRan.current=true;const stale=accounts.filter((a:any)=>!a.lastSyncAt||Date.now()-new Date(a.lastSyncAt).getTime()>STALE_MS);if(!stale.length){setTone("ok");setMsg("");return}void (async()=>{setTone("info");setMsg("Updating Meta data…");let rateLimited=false;for(let i=0;i<stale.length;i++){const result=await syncAll(stale[i].id,true,false);if(result?.rateLimited){rateLimited=true;setTone("warn");setMsg("Meta is temporarily rate-limiting requests. Showing the latest successful data; automatic sync will retry later.");break}if(i<stale.length-1)await sleep(1200)}await load();if(!rateLimited){setTone("ok");setMsg("")}})()},0);return()=>window.clearTimeout(id)},[data.accountGroups,load,syncAll]);\n function connect(a:any){const p=new URLSearchParams({clientId:a.clientId,adAccountId:String(a.adAccountId||"").replace(/^act_/i,""),accountName:a.accountName||"Meta Ad Account"});router.push(\`/api/ad-oauth/meta/start?\${p}\`)}\n`;
          if((s.split(from).length-1)!==1)throw new Error('Meta block mismatch');
          s=s.replace(from,to);fs.writeFileSync(meta,s);

          one('components/realtime-notifications.tsx','  }, [showToast, router]);','  }, [showToast]);');
          NODE
          git diff --check
      - name: Whole-project acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
          git diff --check
      - name: Assert all non-any lint debt is closed
        shell: bash
        run: |
          set -euo pipefail
          npx eslint . -f json > /tmp/eslint.json || true
          node <<'NODE'
          const fs=require('node:fs');const rows=JSON.parse(fs.readFileSync('/tmp/eslint.json','utf8'));const m=rows.flatMap(r=>r.messages||[]),c={};for(const x of m)c[x.ruleId||'(parser)']=(c[x.ruleId||'(parser)']||0)+1;
          const any=m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any');
          const nonAny=m.filter(x=>x.ruleId!=='@typescript-eslint/no-explicit-any');
          console.log(`remaining_total=${m.length}`);console.log(`remaining_errors=${m.filter(x=>x.severity===2).length}`);console.log(`remaining_warnings=${m.filter(x=>x.severity===1).length}`);console.log(`remaining_any=${any.length}`);console.log(`remaining_non_any=${nonAny.length}`);console.log('top_rules='+JSON.stringify(Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,12)));if(nonAny.length) { console.log(JSON.stringify(nonAny.map(x=>[x.ruleId,x.line,x.message]).slice(0,30))); process.exit(1); }
          NODE
      - name: Commit verified dependency cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'
          git add components
          if ! git diff --cached --quiet; then
            git commit -m 'fix(react): stabilize final hook dependencies [skip ci]'
            git push origin HEAD:feat/vivito-static-deps-v6
          fi
