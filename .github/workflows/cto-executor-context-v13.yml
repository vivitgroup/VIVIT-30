name: CTO Executor Context V13
on:
  push:
    branches: [feat/vivito-executor-context-v13]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-executor-context-v13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate and print contexts
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
          npx eslint lib/vivito/executor.ts lib/vivito/executor-operator.ts lib/vivito/executor-extended.ts app/api/assistant/actions/route.ts -f json > /tmp/e.json || true
          node <<'NODE'
          const fs=require('node:fs');const rows=require('/tmp/e.json');
          for(const r of rows){const file=String(r.filePath||'').replace(process.cwd()+'/','');const src=fs.readFileSync(r.filePath,'utf8');const msgs=(r.messages||[]).filter(m=>m.ruleId==='@typescript-eslint/no-explicit-any');console.log(`\nFILE ${file} count=${msgs.length}`);for(const [i,m] of msgs.entries()){const lines=src.split('\n'),a=Math.max(0,m.line-2),b=Math.min(lines.length,m.line+1);console.log(`\n#${i+1} ${m.line}:${m.column}\n${lines.slice(a,b).map((x,j)=>`${a+j+1}: ${x}`).join('\n')}`)}}
          NODE
