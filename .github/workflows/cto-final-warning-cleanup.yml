name: CTO Final Warning Cleanup

on:
  push:
    branches:
      - tmp/cto-final-warning-cleanup
    paths:
      - .github/workflows/cto-final-warning-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: tmp/cto-final-warning-cleanup
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact source cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f"expected pattern not found in {path}: {old!r}")
              if count is not None and found != count:
                  raise SystemExit(f"expected {count} occurrences in {path}, found {found}: {old!r}")
              p.write_text(text.replace(old, new))

          replace_exact(
              "db/schema.ts",
              'import { pgTable, text, boolean, timestamp, integer, real, numeric, pgEnum, unique, jsonb, index } from "drizzle-orm/pg-core";',
              'import { pgTable, text, boolean, timestamp, integer, real, numeric, pgEnum, unique, index } from "drizzle-orm/pg-core";',
              1,
          )

          p = Path("lib/vivito/direct-runtime.ts")
          lines = p.read_text().splitlines()
          matched = [line for line in lines if line.startswith("type CompetitorDetail=")]
          if len(matched) != 1:
              raise SystemExit(f"expected one CompetitorDetail declaration, found {len(matched)}")
          p.write_text("\n".join(line for line in lines if not line.startswith("type CompetitorDetail=")) + "\n")

          p = Path("scripts/seed.ts")
          lines = p.read_text().splitlines()
          prefixes = [
              '  const MONTHS = ["","January"',
              '  const statuses   = ["PENDING"',
              '      const days     = { REEL:7, GRAPHIC:3, CAROUSEL:3, STORY:1, UGC:5 };',
          ]
          for prefix in prefixes:
              hits = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(hits) != 1:
                  raise SystemExit(f"expected one line for {prefix!r}, found {len(hits)}")
              del lines[hits[0]]
          old = '      ok ? passed++ : failed++;'
          hits = [i for i, line in enumerate(lines) if line == old]
          if len(hits) != 1:
              raise SystemExit(f"expected one ternary counter expression, found {len(hits)}")
          lines[hits[0]] = '      if (ok) passed++; else failed++;'
          p.write_text("\n".join(lines) + "\n")

          p = Path("app/dashboard/portal/page.tsx")
          text = p.read_text()
          import_anchor = 'import Link from "next/link";\n'
          if 'import Image from "next/image";' not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit("portal Link import anchor mismatch")
              text = text.replace(import_anchor, import_anchor + 'import Image from "next/image";\n', 1)
          replacements = [
              (
                  '<img src={client.logo} alt={client.company_name}/>',
                  '<Image src={client.logo} alt={client.company_name} width={72} height={72} unoptimized/>',
              ),
              (
                  '<img src={c.file_url} alt={c.title}/>',
                  '<Image src={c.file_url} alt={c.title} width={1200} height={1200} unoptimized style={{width:"100%",height:"100%",objectFit:"cover"}}/>',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"portal image pattern mismatch: {old!r}")
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: ESLint zero-warning acceptance
        run: npx eslint . --max-warnings=0

      - name: TypeScript acceptance
        run: npm run type-check

      - name: CTO static acceptance
        run: node scripts/qa-cto-static-audit.mjs

      - name: Commit source-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vivitgroup"
          git config user.email "groupvivit@gmail.com"
          git add app/dashboard/portal/page.tsx db/schema.ts lib/vivito/direct-runtime.ts scripts/seed.ts
          git diff --cached --quiet && { echo "No source changes"; exit 1; }
          git commit -m "chore(cto): close final eslint warnings"
          git push origin HEAD:tmp/cto-final-warning-cleanup
