name: CTO Image Cleanup V5

on:
  push:
    branches: [feat/vivito-static-images-v5]
    paths: ['.github/workflows/cto-image-cleanup-v5.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/vivito-static-images-v5, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Baseline acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
      - name: Replace remaining img tags
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');function one(f,a,b,n=1){let s=fs.readFileSync(f,'utf8'),c=s.split(a).length-1;if(c!==n)throw new Error(`${f}: expected ${n}, found ${c}`);fs.writeFileSync(f,s.split(a).join(b))}
          one('app/dashboard/clients/[id]/page.tsx','import {redirect} from "next/navigation";','import {redirect} from "next/navigation";\nimport Image from "next/image";');one('app/dashboard/clients/[id]/page.tsx','<img src={client.logo} alt={`${client.company_name} logo`}/>','<Image src={client.logo} alt={`${client.company_name} logo`} width={88} height={88} unoptimized/>');one('app/dashboard/clients/[id]/page.tsx','<img src={x.file_url} alt=""/>','<Image src={x.file_url} alt="" width={48} height={48} unoptimized/>');
          one('app/dashboard/creative/page.tsx','import {redirect} from "next/navigation";','import {redirect} from "next/navigation";\nimport Image from "next/image";');one('app/dashboard/creative/page.tsx','<img src={t.fileUrl} alt={t.title} style={{width:"100%",height:"100%",objectFit:"cover"}}/>','<Image src={t.fileUrl} alt={t.title} width={800} height={600} unoptimized style={{width:"100%",height:"100%",objectFit:"cover"}}/>');
          one('app/dashboard/portal/page.tsx','import Link from "next/link";','import Link from "next/link";\nimport Image from "next/image";');one('app/dashboard/portal/page.tsx','<img src={client.logo} alt={client.company_name}/>','<Image src={client.logo} alt={client.company_name} width={88} height={88} unoptimized/>');one('app/dashboard/portal/page.tsx','<img src={c.file_url} alt={c.title}/>','<Image src={c.file_url} alt={c.title} width={800} height={600} unoptimized/>');
          one('app/dashboard/universe/page.tsx','import {redirect} from "next/navigation";','import {redirect} from "next/navigation";\nimport Image from "next/image";');one('app/dashboard/universe/page.tsx','<img src={c.logo} alt={`${c.company_name} logo`} style={{width:"100%",height:"100%",objectFit:"contain",padding:8}}/>','<Image src={c.logo} alt={`${c.company_name} logo`} width={82} height={82} unoptimized style={{width:"100%",height:"100%",objectFit:"contain",padding:8}}/>');
          one('components/clients/ClientLogoManager.tsx','import {usePathname} from "next/navigation";','import {usePathname} from "next/navigation";\nimport NextImage from "next/image";');one('components/clients/ClientLogoManager.tsx','<img src={p.logo} alt="Preview" style={{width:92,height:92,objectFit:"contain",borderRadius:20,border:"1px solid var(--card-border)",marginTop:8,background:"#fff"}}/>','<NextImage src={p.logo} alt="Preview" width={92} height={92} unoptimized style={{width:92,height:92,objectFit:"contain",borderRadius:20,border:"1px solid var(--card-border)",marginTop:8,background:"#fff"}}/>');one('components/clients/ClientLogoManager.tsx','<img src={p.logo} alt="Client logo" style={{width:"100%",height:"100%",objectFit:"contain",padding:5}}/>','<NextImage src={p.logo} alt="Client logo" width={64} height={64} unoptimized style={{width:"100%",height:"100%",objectFit:"contain",padding:5}}/>');
          NODE
          git diff --check
      - name: Acceptance and assertion
        shell: bash
        run: |
          set -euo pipefail
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
          git diff --check
          npx eslint 'app/dashboard/clients/[id]/page.tsx' app/dashboard/creative/page.tsx app/dashboard/portal/page.tsx app/dashboard/universe/page.tsx components/clients/ClientLogoManager.tsx -f json > /tmp/e.json || true
          node -e "const r=require('/tmp/e.json'),m=r.flatMap(x=>x.messages||[]).filter(x=>x.ruleId==='@next/next/no-img-element');console.log('img_remaining='+m.length);if(m.length)process.exit(1)"
      - name: Full lint and commit
        shell: bash
        run: |
          npx eslint . -f json > /tmp/full.json || true
          node -e "const r=require('/tmp/full.json'),m=r.flatMap(x=>x.messages||[]);console.log('remaining_total='+m.length);console.log('remaining_any='+m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any').length)"
          git config user.name 'VIVIT CTO Gate Bot'; git config user.email 'groupvivit@gmail.com'; git add app components
          git commit -m 'fix(next): replace remaining img tags safely [skip ci]' && git push origin HEAD:feat/vivito-static-images-v5
