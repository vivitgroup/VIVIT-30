name: CTO Integrate Executor Audit V13
on:
  push:
    branches: [feat/vivito-static-integrate-executor-audit-v13]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-static-integrate-executor-audit-v13
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
          npx eslint . -f json > /tmp/base.json || true
          node <<'NODE'
          const r=require('/tmp/base.json'),m=r.flatMap(x=>x.messages||[]),a=m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any'),n=m.filter(x=>x.ruleId!=='@typescript-eslint/no-explicit-any'),w=m.filter(x=>x.severity===1);console.log(`baseline_any=${a.length}`);if(a.length!==227||n.length||w.length)process.exit(1)
          NODE
      - name: Integrate verified executor audit source
        run: |
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'
          git fetch origin a07fa11fd7cc3633ac7dab14e70be8e41da14e26
          git cherry-pick a07fa11fd7cc3633ac7dab14e70be8e41da14e26
      - name: Final acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
          npx eslint . -f json > /tmp/all.json || true
          node <<'NODE'
          const r=require('/tmp/all.json'),m=r.flatMap(x=>x.messages||[]),a=m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any'),n=m.filter(x=>x.ruleId!=='@typescript-eslint/no-explicit-any'),w=m.filter(x=>x.severity===1);console.log(`remaining_any=${a.length}`);console.log(`remaining_non_any=${n.length}`);console.log(`remaining_warnings=${w.length}`);if(a.length!==224||n.length||w.length)process.exit(1)
          NODE
      - name: Push accepted candidate
        run: git push origin HEAD:feat/vivito-static-integrate-executor-audit-v13
