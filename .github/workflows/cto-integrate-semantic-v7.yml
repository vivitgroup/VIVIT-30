name: CTO Integrate Semantic V7
on:
  push:
    branches: [feat/vivito-static-semantic-v7]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-static-semantic-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
      - name: Integrate verified semantic source commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'
          for c in \
            bc14a50db2fd5bd5fdd147f8a828de94e728d055 \
            bee96c506b91d1b826c7233bbd2db572df2df39f \
            48278fcc2d43e366bcd344b66f8a3efa876bf0c7
          do
            echo "candidate=$c"
            git cherry-pick "$c"
            npm run type-check
            node scripts/qa-cto-static-audit.mjs
            git diff --check HEAD^ HEAD
          done
          git push origin HEAD:feat/vivito-static-semantic-v7
      - name: Full lint acceptance
        shell: bash
        run: |
          set -euo pipefail
          npx eslint . -f json > /tmp/e.json || true
          node <<'NODE'
          const fs=require('node:fs');const rows=JSON.parse(fs.readFileSync('/tmp/e.json','utf8'));const m=rows.flatMap(r=>r.messages||[]),nonAny=m.filter(x=>x.ruleId!=='@typescript-eslint/no-explicit-any');console.log(`remaining_total=${m.length}`);console.log(`remaining_errors=${m.filter(x=>x.severity===2).length}`);console.log(`remaining_warnings=${m.filter(x=>x.severity===1).length}`);console.log(`remaining_any=${m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any').length}`);console.log(`remaining_non_any=${nonAny.length}`);if(nonAny.length||m.filter(x=>x.severity===1).length||m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any').length>460)process.exit(1);
          NODE
