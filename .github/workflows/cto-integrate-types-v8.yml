name: CTO Integrate Types V8

on:
  push:
    branches: [feat/vivito-static-aggregate-v8]
    paths: ['.github/workflows/cto-integrate-types-v8.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-static-aggregate-v8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
      - name: Integrate verified source commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'
          git fetch origin feat/vivito-media-types-v8 feat/vivito-executor-args-v8
          for sha in a2047b3fe275975e514923b9563bec143565ffc1 48278fcc2d43e366bcd344b66f8a3efa876bf0c7; do
            git cherry-pick "$sha"
            npm run type-check
            node scripts/qa-cto-static-audit.mjs
            git diff --check HEAD^ HEAD
          done
      - name: Final lint acceptance
        shell: bash
        run: |
          npx eslint . -f json > /tmp/e.json || true
          node <<'NODE'
          const r=require('/tmp/e.json'),m=r.flatMap(x=>x.messages||[]),a=m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any'),n=m.filter(x=>x.ruleId!=='@typescript-eslint/no-explicit-any');
          console.log(`remaining_total=${m.length}`);console.log(`remaining_any=${a.length}`);console.log(`remaining_non_any=${n.length}`);console.log(`remaining_warnings=${m.filter(x=>x.severity===1).length}`);
          if(n.length||m.filter(x=>x.severity===1).length||a.length>=494)process.exit(1)
          NODE
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
      - name: Push accepted candidate
        run: git push origin HEAD:feat/vivito-static-aggregate-v8