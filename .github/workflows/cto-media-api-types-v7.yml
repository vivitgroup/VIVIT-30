name: CTO Media API Types V7
on:
  push:
    branches: [feat/vivito-media-api-types-v7]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-media-api-types-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
      - name: Accept media API contracts one by one
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const {spawnSync}=require('node:child_process');
          const file='app/api/media-control-v2/route.ts';
          const beforeAll=fs.readFileSync(file,'utf8');
          const marker='const ROLES=["SUPER_ADMIN","MEDIA_BUYER","ACCOUNT_MANAGER"],n=(v:unknown)=>Number(v||0),iso=(d:Date)=>d.toISOString().slice(0,10),DATE=/^\\d{4}-\\d{2}-\\d{2}$/;';
          const types='type MetricRow=Record<string,unknown>;\ntype MetaAction={action_type?:string;value?:unknown};\ntype MetaInsight=MetricRow&{actions?:MetaAction[];action_values?:MetaAction[];date_start?:string;adset_id?:string;ad_id?:string};\ntype CampaignRef={id:string;externalId:string;platform?:string|null};\n';
          if(!beforeAll.includes(marker))throw new Error('type insertion marker missing');
          fs.writeFileSync(file,beforeAll.replace(marker,marker+'\n'+types));
          const tsc=()=>spawnSync('npx',['tsc','--noEmit','--pretty','false'],{encoding:'utf8',maxBuffer:32*1024*1024});
          let baseline=tsc();if(baseline.status!==0){fs.writeFileSync(file,beforeAll);throw new Error('type aliases alone failed')}
          const candidates=[
            ['session-role','String((s.user as any).role)','String(s.user.role)'],
            ['session-id','String((s.user as any).id)','String(s.user.id)'],
            ['session-workspace','String((s.user as any).workspaceId||"")','String(s.user.workspaceId||"")'],
            ['metrics-array','function metrics(rows:any[])','function metrics(rows:MetricRow[])'],
            ['persist-campaign','async function persistDays(campaign:any,days:any[])','async function persistDays(campaign:{id:string},days:MetricRow[])'],
            ['action-row','function action(row:any,type:string){return n(row?.actions?.find((a:any)=>a.action_type===type)?.value)}','function action(row:MetaInsight,type:string){return n(row.actions?.find(a=>a.action_type===type)?.value)}'],
            ['value-row','function value(row:any,type:string){return n(row?.action_values?.find((a:any)=>a.action_type===type)?.value)}','function value(row:MetaInsight,type:string){return n(row.action_values?.find(a=>a.action_type===type)?.value)}'],
            ['hierarchy-row','function hierarchyMetric(row:any,resultType?:string)','function hierarchyMetric(row:MetaInsight,resultType?:string)'],
            ['sync-campaign','async function syncMetaHierarchy(campaign:any,token:string','async function syncMetaHierarchy(campaign:CampaignRef,token:string'],
            ['reported-map','reportedRows.map((x:any)=>[x.id,x])','reportedRows.map(x=>[String((x as Record<string,unknown>).id),x])'],
            ['perf-filter','perf.filter((p:any)=>','perf.filter(p=>'],
            ['set-filter','setRows.filter((s:any)=>','setRows.filter(s=>'],
            ['set-map','.map((s:any)=>({...s,metrics:metrics(','.map(s=>({...s,metrics:metrics('],
            ['ad-filter','adRows.filter((a:any)=>','adRows.filter(a=>'],
            ['ad-map','.map((a:any)=>({...a,metrics:metrics(','.map(a=>({...a,metrics:metrics(']
          ];
          let accepted=0,rejected=0;
          for(const [name,from,to] of candidates){const before=fs.readFileSync(file,'utf8');const count=before.split(from).length-1;if(!count){console.log(`skip_missing=${name}`);continue}fs.writeFileSync(file,before.split(from).join(to));const r=tsc();if(r.status===0){accepted+=count;console.log(`accepted=${name} count=${count}`)}else{fs.writeFileSync(file,before);rejected+=count;console.log(`rejected=${name} count=${count}`)}}
          const final=tsc();if(final.status!==0){console.error(final.stdout);process.exit(1)}console.log(`accepted_occurrences=${accepted}`);console.log(`rejected_occurrences=${rejected}`);
          NODE
          git diff --check
      - name: Whole-project acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
          git diff --check
      - name: Measure media API and full lint
        shell: bash
        run: |
          set -euo pipefail
          npx eslint app/api/media-control-v2/route.ts -f json > /tmp/target.json || true
          npx eslint . -f json > /tmp/full.json || true
          node <<'NODE'
          const fs=require('node:fs');const target=JSON.parse(fs.readFileSync('/tmp/target.json','utf8')).flatMap(r=>r.messages||[]),full=JSON.parse(fs.readFileSync('/tmp/full.json','utf8')).flatMap(r=>r.messages||[]);const nonAny=full.filter(x=>x.ruleId!=='@typescript-eslint/no-explicit-any');console.log(`media_api_any_remaining=${target.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any').length}`);console.log(`full_any_remaining=${full.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any').length}`);console.log(`full_warnings=${full.filter(x=>x.severity===1).length}`);console.log(`full_non_any=${nonAny.length}`);if(nonAny.length)process.exit(1);
          NODE
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'
          git add app/api/media-control-v2/route.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(types): add compiler-safe media API contracts [skip ci]'
            git push origin HEAD:feat/vivito-media-api-types-v7
          fi
