name: CTO Media Control API Types V12
on:
  push:
    branches: [feat/vivito-media-control-api-types-v12]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-media-control-api-types-v12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
      - name: Apply media API contracts
        run: |
          node <<'NODE'
          const fs=require('node:fs');const file='app/api/media-control-v2/route.ts';let s=fs.readFileSync(file,'utf8');
          function one(from,to,count=1){const n=s.split(from).length-1;if(n!==count)throw new Error(`expected ${count}, found ${n}: ${from.slice(0,140)}`);s=s.split(from).join(to)}
          one('import {connectionAccessToken} from "@/lib/ad-oauth";','import {connectionAccessToken} from "@/lib/ad-oauth";\nimport type {MediaMetrics,MediaMetricTotals} from "@/types/media-control";');
          one('type CampaignRef={id:string;externalId:string;platform?:string|null};','type CampaignRef={id:string;externalId:string;platform?:string|null};\ntype DbIdRow={id?:unknown;external_id?:unknown};\ntype ReportedRow={id:unknown;reported_metrics?:unknown;reported_period_start?:unknown;reported_period_end?:unknown;reported_result_type?:unknown;reported_result_label?:unknown};\ntype DependencyRow={adsets?:unknown;ads?:unknown};\nconst TOTAL_KEYS=["spend","impressions","reach","clicks","results","purchases","addToCart","revenue"] as const;\nfunction dbRows<T>(value:unknown):T[]{return Array.from(value as Iterable<T>)}');
          one('function metrics(rows:any[])','function metrics(rows:MediaMetrics[])');
          one('const x=rows.reduce((a,p)=>({spend:a.spend+n(p.spend),impressions:a.impressions+n(p.impressions),reach:a.reach+n(p.reach),clicks:a.clicks+n(p.clicks),results:a.results+n(p.results),purchases:a.purchases+n(p.purchases),addToCart:a.addToCart+n(p.addToCart),revenue:a.revenue+n(p.revenue)}),{spend:0,impressions:0,reach:0,clicks:0,results:0,purchases:0,addToCart:0,revenue:0})','const x=rows.reduce<MediaMetricTotals>((a,p)=>({spend:a.spend+n(p.spend),impressions:a.impressions+n(p.impressions),reach:a.reach+n(p.reach),clicks:a.clicks+n(p.clicks),results:a.results+n(p.results),purchases:a.purchases+n(p.purchases),addToCart:a.addToCart+n(p.addToCart),revenue:a.revenue+n(p.revenue)}),{spend:0,impressions:0,reach:0,clicks:0,results:0,purchases:0,addToCart:0,revenue:0})');
          one('Array.from(await db.execute(sql`insert into ad_sets(id,campaign_id,external_id,name,status,budget,optimization_goal,created_at,updated_at) values(gen_random_uuid()::text,${campaign.id},${String(s.id)},${String(s.name||"Ad Set")},${String(s.status||"UNKNOWN")},0,${s.optimization_goal?String(s.optimization_goal):null},now(),now()) on conflict (campaign_id,external_id) do update set name=excluded.name,status=excluded.status,optimization_goal=excluded.optimization_goal,updated_at=now() returning id,external_id`)) as any[]','dbRows<DbIdRow>(await db.execute(sql`insert into ad_sets(id,campaign_id,external_id,name,status,budget,optimization_goal,created_at,updated_at) values(gen_random_uuid()::text,${campaign.id},${String(s.id)},${String(s.name||"Ad Set")},${String(s.status||"UNKNOWN")},0,${s.optimization_goal?String(s.optimization_goal):null},now(),now()) on conflict (campaign_id,external_id) do update set name=excluded.name,status=excluded.status,optimization_goal=excluded.optimization_goal,updated_at=now() returning id,external_id`))');
          one('Array.from(await db.execute(sql`insert into ads(id,campaign_id,ad_set_id,external_id,name,status,created_at,updated_at) values(gen_random_uuid()::text,${campaign.id},${setMap[String(a.adset_id)]||null},${String(a.id)},${String(a.name||"Ad")},${String(a.status||"UNKNOWN")},now(),now()) on conflict (campaign_id,external_id) do update set ad_set_id=excluded.ad_set_id,name=excluded.name,status=excluded.status,updated_at=now() returning id,external_id`)) as any[]','dbRows<DbIdRow>(await db.execute(sql`insert into ads(id,campaign_id,ad_set_id,external_id,name,status,created_at,updated_at) values(gen_random_uuid()::text,${campaign.id},${setMap[String(a.adset_id)]||null},${String(a.id)},${String(a.name||"Ad")},${String(a.status||"UNKNOWN")},now(),now()) on conflict (campaign_id,external_id) do update set ad_set_id=excluded.ad_set_id,name=excluded.name,status=excluded.status,updated_at=now() returning id,external_id`))');
          one('reportedRows=ids.length?Array.from(await db.execute(sql`select id,reported_metrics,reported_period_start,reported_period_end,reported_result_type,reported_result_label from ad_campaigns where id in (${sql.join(ids.map(id=>sql`${id}`),sql`, `)})`)):[],rm=Object.fromEntries(reportedRows.map(x=>[String((x as Record<string,unknown>).id),x]))','reportedRows:ReportedRow[]=ids.length?dbRows<ReportedRow>(await db.execute(sql`select id,reported_metrics,reported_period_start,reported_period_end,reported_result_type,reported_result_label from ad_campaigns where id in (${sql.join(ids.map(id=>sql`${id}`),sql`, `)})`)):[],rm=Object.fromEntries(reportedRows.map(x=>[String(x.id),x]))');
          one('const rr:any=rm[x.id],same=String(rr?.reported_period_start||"").slice(0,10)===r.start&&String(rr?.reported_period_end||"").slice(0,10)===r.end;let reported:any=null;try{reported=typeof rr?.reported_metrics==="string"?JSON.parse(rr.reported_metrics):rr?.reported_metrics}catch{}','const rr:ReportedRow|undefined=rm[x.id],same=String(rr?.reported_period_start||"").slice(0,10)===r.start&&String(rr?.reported_period_end||"").slice(0,10)===r.end;let reported:MediaMetrics|null=null;try{const raw:unknown=typeof rr?.reported_metrics==="string"?JSON.parse(rr.reported_metrics):rr?.reported_metrics;if(raw&&typeof raw==="object"&&!Array.isArray(raw))reported=raw as MediaMetrics}catch{}');
          one('m=cs.reduce((z:any,x:any)=>{for(const k of["spend","impressions","reach","clicks","results","purchases","addToCart","revenue"])z[k]+=n(x.metrics?.[k]);return z},{spend:0,impressions:0,reach:0,clicks:0,results:0,purchases:0,addToCart:0,revenue:0})','m=cs.reduce<MediaMetricTotals>((z,x)=>{for(const k of TOTAL_KEYS)z[k]+=n(x.metrics?.[k]);return z},{spend:0,impressions:0,reach:0,clicks:0,results:0,purchases:0,addToCart:0,revenue:0})');
          one('Array.from(await db.execute(sql`select (select count(*)::int from ad_sets where campaign_id=${id}) as adsets,(select count(*)::int from ads where campaign_id=${id}) as ads`)) as any[]','dbRows<DependencyRow>(await db.execute(sql`select (select count(*)::int from ad_sets where campaign_id=${id}) as adsets,(select count(*)::int from ads where campaign_id=${id}) as ads`))');
          one('newValues:JSON.stringify({state:op.replace("_campaign","")}) as any','newValues:JSON.stringify({state:op.replace("_campaign","")})');
          one('newValues:JSON.stringify({from:r.start,to:r.end,days:result.days?.length||0,source:result.summary?.source||campaign.platform,...hierarchy}) as any','newValues:JSON.stringify({from:r.start,to:r.end,days:result.days?.length||0,source:result.summary?.source||campaign.platform,...hierarchy})');
          fs.writeFileSync(file,s)
          NODE
          git diff --check
      - name: Acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
          npx eslint app/api/media-control-v2/route.ts -f json > /tmp/e.json || true
          node <<'NODE'
          const r=require('/tmp/e.json'),m=r.flatMap(x=>x.messages||[]);console.log(`target_total=${m.length}`);console.log(`target_any=${m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any').length}`);console.log(JSON.stringify(m.map(x=>[x.ruleId,x.line,x.message]).slice(0,40)));if(m.length)process.exit(1)
          NODE
          npx eslint . -f json > /tmp/all.json || true
          node <<'NODE'
          const r=require('/tmp/all.json'),m=r.flatMap(x=>x.messages||[]),a=m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any'),n=m.filter(x=>x.ruleId!=='@typescript-eslint/no-explicit-any'),w=m.filter(x=>x.severity===1);console.log(`remaining_any=${a.length}`);console.log(`remaining_non_any=${n.length}`);console.log(`remaining_warnings=${w.length}`);if(n.length||w.length||a.length!==255)process.exit(1)
          NODE
      - name: Commit source
        run: |
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'
          git add app/api/media-control-v2/route.ts
          git commit -m 'fix(types): type media control API contracts [skip ci]'
          git push origin HEAD:feat/vivito-media-control-api-types-v12
