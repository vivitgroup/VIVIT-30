name: CTO Media V2 Typing
on:
  push:
    branches: [feat/vivito-internal-100]
    paths: ['.github/workflows/cto-media-v2-typing.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vivit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vivit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vivit_test
      AUTH_SECRET: cto-ci-secret-2026
      NEXTAUTH_SECRET: cto-ci-secret-2026
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Certify current media workspace full build
        run: npm run build
      - name: Apply typed V2 media candidate
        run: |
          git fetch origin feat/vivito-media-types-v8
          git show origin/feat/vivito-media-types-v8:components/media/MediaIntelligenceWorkspaceV2.tsx > components/media/MediaIntelligenceWorkspaceV2.tsx
      - name: Verify V2 target contracts
        run: |
          if grep -nE 'as any|: *any\b|<[^>]*\bany\b' components/media/MediaIntelligenceWorkspaceV2.tsx; then echo 'explicit any remains'; exit 1; fi
          npx eslint components/media/MediaIntelligenceWorkspaceV2.tsx --max-warnings=0
          npm run type-check
          npm run build
      - name: Commit source-only V2 typing
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/media/MediaIntelligenceWorkspaceV2.tsx
          git commit -m "refactor(media): type intelligence workspace v2 contracts"
          git push origin HEAD:feat/vivito-internal-100
      - name: Remove transient workflow
        if: always()
        run: |
          git fetch origin feat/vivito-internal-100
          git reset --hard origin/feat/vivito-internal-100
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/cto-media-v2-typing.yml ]; then
            git rm .github/workflows/cto-media-v2-typing.yml
            git commit -m "chore(cto): retain media v2 typing as source-only"
            git push origin HEAD:feat/vivito-internal-100
          fi
