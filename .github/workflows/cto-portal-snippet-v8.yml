name: CTO Portal Snippet V8
on:
  push:
    branches: [feat/vivito-portal-types-v8]
    paths: ['.github/workflows/cto-portal-snippet-v8.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-portal-types-v8
      - name: Print deliverable tuple context
        run: |
          node <<'NODE'
          const fs=require('node:fs');const s=fs.readFileSync('app/dashboard/portal/page.tsx','utf8');
          for(const needle of ['reels','statics','carousels']){const i=s.indexOf(needle);console.log(`\n### ${needle} @ ${i}\n`+s.slice(Math.max(0,i-700),Math.min(s.length,i+1400)))}
          NODE