name: CTO Portal Types V8

on:
  push:
    branches: [feat/vivito-portal-types-v8]
    paths: ['.github/workflows/cto-portal-types-v8.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-portal-types-v8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
      - name: Type portal query contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),file='app/dashboard/portal/page.tsx';let s=fs.readFileSync(file,'utf8');
          function one(from,to){const n=s.split(from).length-1;if(n!==1)throw new Error(`expected one: ${from.slice(0,120)} found=${n}`);s=s.replace(from,to)}
          one('import PortalAutoRefresh from "@/components/portal/PortalAutoRefresh";','import PortalAutoRefresh from "@/components/portal/PortalAutoRefresh";\n\ntype CampaignRow={id:string;name:string;status:string;reported_result_label:string|null;reported_result_type:string|null;last_sync_at:string|Date|null;spend:unknown;results:unknown;add_to_cart:unknown;purchases:unknown;revenue:unknown;impressions:unknown;clicks:unknown;reach:unknown};\ntype TaskRow={id:string;title:string;type:string;status:string;file_url:string|null;caption:string|null;deadline:string|Date|null;platform:string|null;approved_by_client:boolean;revision_notes:string|null;revision_count:number|null;updated_at:string|Date|null};\ntype DocRow={id:string;name:string;category:string|null;created_at:string|Date|null};\ntype FinanceRow={id:string;month:number;year:number;total_revenue:unknown;paid:unknown;outstanding:unknown;invoice_number:string|null;invoice_status:string|null;due_date:string|Date|null;paid_date:string|Date|null};\ntype EventRow={id:string;title:string;date:string|Date;platform:string|null;status:string|null;task_id:string|null};\ntype NoteRow={id:string;type:string;title:string;message:string;link:string|null;is_read:boolean;priority:string|null;created_at:string|Date|null};\ntype DeliverableStat={total:number;done:number;review:number;working:number};\nfunction dbRows<T>(value:unknown){return Array.from(value as Iterable<T>)}');
          one('const fmtDate=(v:any)=>','const fmtDate=(v:unknown)=>');
          one('const labelKind=(label:string)=>','const labelKind=(label:unknown)=>');
          one('const [campaignRows,taskRows,docRows,financeRows,eventRows,notificationRows]:any=await Promise.all([','const [campaignRaw,taskRaw,docRaw,financeRaw,eventRaw,notificationRaw]=await Promise.all([');
          one(' ]);\n const campaigns=[...campaignRows].map((x:any)=>',' ]);\n const campaignRows=dbRows<CampaignRow>(campaignRaw),taskRows=dbRows<TaskRow>(taskRaw),docRows=dbRows<DocRow>(docRaw),financeRows=dbRows<FinanceRow>(financeRaw),eventRows=dbRows<EventRow>(eventRaw),notificationRows=dbRows<NoteRow>(notificationRaw);\n const campaigns=campaignRows.map((x)=>');
          one('const spend=campaigns.reduce((s:unknown,x:any)=>s+x.spend,0),messages=campaigns.filter((x:any)=>x.kind==="MESSAGES").reduce((s:unknown,x:any)=>s+x.primary,0),leads=campaigns.filter((x:any)=>x.kind==="LEADS").reduce((s:unknown,x:any)=>s+x.primary,0),atc=campaigns.reduce((s:unknown,x:any)=>s+x.atc,0),purchases=campaigns.reduce((s:unknown,x:any)=>s+x.purchases,0),revenue=campaigns.reduce((s:unknown,x:any)=>s+x.revenue,0),roas=spend?revenue/spend:0;','const spend=campaigns.reduce((sum,x)=>sum+x.spend,0),messages=campaigns.filter((x)=>x.kind==="MESSAGES").reduce((sum,x)=>sum+x.primary,0),leads=campaigns.filter((x)=>x.kind==="LEADS").reduce((sum,x)=>sum+x.primary,0),atc=campaigns.reduce((sum,x)=>sum+x.atc,0),purchases=campaigns.reduce((sum,x)=>sum+x.purchases,0),revenue=campaigns.reduce((sum,x)=>sum+x.revenue,0),roas=spend?revenue/spend:0;');
          one('const countType=(types:string[])=>{const x=tasks.filter((t:any)=>types.includes(t.type));return{total:x.length,done:x.filter((t:any)=>["APPROVED","COMPLETED"].includes(t.status)&&t.approved_by_client).length,review:x.filter((t:any)=>["APPROVED","COMPLETED"].includes(t.status)&&!t.approved_by_client&&t.file_url).length,working:x.filter((t:any)=>["PENDING","IN_PROGRESS","REVIEW","REVISION"].includes(t.status)).length}}','const countType=(types:string[]):DeliverableStat=>{const x=tasks.filter((t)=>types.includes(t.type));return{total:x.length,done:x.filter((t)=>["APPROVED","COMPLETED"].includes(t.status)&&t.approved_by_client).length,review:x.filter((t)=>["APPROVED","COMPLETED"].includes(t.status)&&!t.approved_by_client&&Boolean(t.file_url)).length,working:x.filter((t)=>["PENDING","IN_PROGRESS","REVIEW","REVISION"].includes(t.status)).length}}');
          one('const reviewQueue=tasks.filter((t:any)=>t.file_url&&["APPROVED","COMPLETED"].includes(t.status)&&!t.approved_by_client),recentApproved=tasks.filter((t:any)=>t.approved_by_client).slice(0,6),upcoming=tasks.filter((t:any)=>t.deadline&&!["COMPLETED","REJECTED"].includes(t.status)).sort((a:any,b:any)=>new Date(a.deadline).getTime()-new Date(b.deadline).getTime()).slice(0,8),plans=docs.filter((d:any)=>/CONTENT|PLAN/i.test(d.category||"")),strategies=docs.filter((d:any)=>/STRATEG/i.test(d.category||""));','const reviewQueue=tasks.filter((t)=>t.file_url&&["APPROVED","COMPLETED"].includes(t.status)&&!t.approved_by_client),recentApproved=tasks.filter((t)=>t.approved_by_client).slice(0,6),upcoming=tasks.filter((t)=>t.deadline&&!["COMPLETED","REJECTED"].includes(t.status)).sort((a,b)=>new Date(String(a.deadline)).getTime()-new Date(String(b.deadline)).getTime()).slice(0,8),plans=docs.filter((d)=>/CONTENT|PLAN/i.test(d.category||"")),strategies=docs.filter((d)=>/STRATEG/i.test(d.category||""));');
          one('const outstanding=finance.reduce((s:any,x:any)=>s+n(x.outstanding),0),paid=finance.reduce((s:any,x:any)=>s+n(x.paid),0),latestInvoice=finance[0],unread=notes.filter((x:any)=>!x.is_read).length,socials=[["f",client.facebook_url,"Facebook"],["◎",client.instagram_url,"Instagram"],["↗",client.website,"Website"]].filter((x:unknown)=>x[1]);','const outstanding=finance.reduce((sum,x)=>sum+n(x.outstanding),0),paid=finance.reduce((sum,x)=>sum+n(x.paid),0),latestInvoice=finance[0],unread=notes.filter((x)=>!x.is_read).length,socials=([["f",client.facebook_url,"Facebook"],["◎",client.instagram_url,"Instagram"],["↗",client.website,"Website"]] as [string,string|null|undefined,string][]).filter((x):x is [string,string,string]=>Boolean(x[1]));');
          one('const lastSync=campaigns.map((c:any)=>c.last_sync_at).filter(Boolean).sort().at(-1);','const lastSync=campaigns.map((c)=>c.last_sync_at).filter(Boolean).sort().at(-1);');
          s=s.replaceAll('(c:any)=>','(c)=>').replaceAll('(x:any)=>','(x)=>').replaceAll('([i,h,l]:any)=>','([i,h,l])=>').replaceAll('([l,x,icon]:any)=>','([l,x,icon])=>');
          fs.writeFileSync(file,s);
          NODE
          git diff --check
      - name: Acceptance
        shell: bash
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
          npx eslint app/dashboard/portal/page.tsx -f json > /tmp/e.json || true
          node <<'NODE'
          const r=require('/tmp/e.json'),m=r.flatMap(x=>x.messages||[]);console.log(`portal_total=${m.length}`);console.log(`portal_any=${m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any').length}`);console.log(JSON.stringify(m.map(x=>[x.ruleId,x.line,x.message]).slice(0,50)));if(m.length)process.exit(1)
          NODE
          npx eslint . -f json > /tmp/all.json || true
          node <<'NODE'
          const r=require('/tmp/all.json'),m=r.flatMap(x=>x.messages||[]),a=m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any'),n=m.filter(x=>x.ruleId!=='@typescript-eslint/no-explicit-any');console.log(`remaining_any=${a.length}`);console.log(`remaining_non_any=${n.length}`);console.log(`remaining_warnings=${m.filter(x=>x.severity===1).length}`);if(n.length)process.exit(1)
          NODE
      - name: Commit source
        shell: bash
        run: |
          git config user.name 'VIVIT CTO Gate Bot';git config user.email 'groupvivit@gmail.com'
          git add app/dashboard/portal/page.tsx
          git commit -m 'fix(types): type client portal query contracts [skip ci]'
          git push origin HEAD:feat/vivito-portal-types-v8