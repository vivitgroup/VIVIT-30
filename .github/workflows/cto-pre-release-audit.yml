name: CTO Pre-Release Audit

on:
  push:
    branches:
      - main
      - feat/vivito-internal-100
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cto-static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CTO runtime static audit
        run: node scripts/qa-cto-release-audit.mjs
      - name: VIVITO free model and fallback audit
        run: node scripts/qa-vivito-free-fallback.mjs
      - name: Mobile UX static audit
        run: node scripts/qa-mobile-ux.mjs
