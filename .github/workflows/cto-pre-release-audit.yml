name: CTO Pre-Release Audit

on:
  push:
    branches:
      - feat/vivito-internal-100
      - release/reconcile-2026-09-02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cto-static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CTO runtime static audit
        run: node scripts/qa-cto-release-audit.mjs
