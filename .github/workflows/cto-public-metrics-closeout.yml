name: CTO Public Metrics Closeout
on:
  push:
    branches: [feat/vivito-internal-100]
permissions:
  contents: write
jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Harden public metrics client lifecycle and canonical RBAC contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/api/v1/metrics/route.ts')
          s=p.read_text()
          s=s.replace('c.workspace_id=${key.workspaceId} and c.is_active=true and a.archived_at is null', 'c.workspace_id=${key.workspaceId} and c.is_active=true and c.archived_at is null and c.deleted_at is null and a.archived_at is null')
          p.write_text(s)

          q=Path('scripts/qa-rbac-security.mjs')
          s=q.read_text()
          old='check("Public v1 metrics API scopes tenant to active client IDs",v1m.includes("eq(clients.workspaceId,key.workspaceId)")&&v1m.includes("eq(clients.isActive,true)")&&v1m.includes("inArray(mediaMetrics.clientId,ids)"));'
          new='check("Public v1 metrics API scopes tenant to active lifecycle-safe clients",v1m.includes("join clients c on c.id=a.client_id")&&v1m.includes("a.workspace_id=${key.workspaceId}")&&v1m.includes("c.workspace_id=${key.workspaceId}")&&v1m.includes("c.is_active=true")&&v1m.includes("c.archived_at is null")&&v1m.includes("c.deleted_at is null")&&v1m.includes("a.archived_at is null")&&v1m.includes("a.deleted_at is null")&&v1m.includes("ad_performance_daily"));'
          if old not in s:
              raise SystemExit('RBAC assertion pattern not found')
          q.write_text(s.replace(old,new))
          PY
      - run: node scripts/qa-rbac-security.mjs
      - run: node scripts/qa-campaign-data-consistency.mjs
      - run: npm run type-check
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/v1/metrics/route.ts scripts/qa-rbac-security.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(api): harden public metrics tenant lifecycle scope"
          git push origin HEAD:feat/vivito-internal-100
