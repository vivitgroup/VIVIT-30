name: CTO Sales Types V13
on:
  push:
    branches: [feat/vivito-sales-types-v13]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-sales-types-v13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
      - name: Apply sales contracts
        run: |
          node <<'NODE'
          const fs=require('node:fs');const file='app/dashboard/sales/page.tsx';let s=fs.readFileSync(file,'utf8');
          function one(from,to,count=1){const n=s.split(from).length-1;if(n!==count)throw new Error(`expected ${count}, found ${n}: ${from.slice(0,140)}`);s=s.split(from).join(to)}
          one('import {Role} from "@/lib/types";','import {Role} from "@/lib/types";\nimport type {Session} from "next-auth";');
          one('const workspaceOf=(session:any)=>','const workspaceOf=(session:Session)=>');
          one('async function allowedLead(id:string,session:any)','async function allowedLead(id:string,session:Session)');
          one('stage:stage as any','stage:cfg.key');
          one('newValues:JSON.stringify({from:lead.stage,to:stage,clientId})} as any','newValues:JSON.stringify({from:lead.stage,to:stage,clientId})}');
          one('newValues:JSON.stringify({phone,notes})} as any','newValues:JSON.stringify({phone,notes})}');
          one('source:(clean(fd.get("source"),40)||"WEBSITE") as any','source:clean(fd.get("source"),40)||"WEBSITE"');
          one('newValues:JSON.stringify({companyName,estimatedValue})} as any','newValues:JSON.stringify({companyName,estimatedValue})}');
          one('newValues:JSON.stringify({companyName:lead.companyName})} as any','newValues:JSON.stringify({companyName:lead.companyName})}');
          fs.writeFileSync(file,s)
          NODE
          git diff --check
      - name: Acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
          npx eslint app/dashboard/sales/page.tsx -f json > /tmp/target.json || true
          node <<'NODE'
          const m=require('/tmp/target.json').flatMap(x=>x.messages||[]);console.log(`target_total=${m.length}`);console.log(JSON.stringify(m.map(x=>[x.ruleId,x.line,x.message]).slice(0,30)));if(m.length)process.exit(1)
          NODE
          npx eslint . -f json > /tmp/all.json || true
          node <<'NODE'
          const r=require('/tmp/all.json'),m=r.flatMap(x=>x.messages||[]),a=m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any'),n=m.filter(x=>x.ruleId!=='@typescript-eslint/no-explicit-any'),w=m.filter(x=>x.severity===1);console.log(`remaining_any=${a.length}`);console.log(`remaining_non_any=${n.length}`);console.log(`remaining_warnings=${w.length}`);if(a.length!==230||n.length||w.length)process.exit(1)
          NODE
      - name: Commit source
        run: |
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'
          git add app/dashboard/sales/page.tsx
          git commit -m 'fix(types): type sales page contracts [skip ci]'
          git push origin HEAD:feat/vivito-sales-types-v13
