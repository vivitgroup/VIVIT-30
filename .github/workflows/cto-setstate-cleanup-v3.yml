name: CTO SetState Cleanup V3
on:
  push:
    branches: [feat/vivito-static-setstate-v3]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-static-setstate-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
      - name: Schedule effect hydration and initial loads
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          function one(file,from,to,count=1){let s=fs.readFileSync(file,'utf8');const n=s.split(from).length-1;if(n!==count)throw new Error(`${file}: expected ${count}, found ${n}: ${from.slice(0,120)}`);fs.writeFileSync(file,s.split(from).join(to))}

          one('app/dashboard/media/sync/page.tsx',
            'useEffect(()=>{const saved=localStorage.getItem("vivit-meta-connect");if(saved)try{const s=JSON.parse(saved);setClientId(s.clientId||"");setAdAccountId(s.adAccountId||"");setCampaignId(s.campaignId||"");setAccountName(s.accountName||"")}catch{}const q=new URLSearchParams(window.location.search),status=q.get("oauth"),requested=(q.get("platform")||"").toUpperCase();if(platforms.includes(requested))setSelectedPlatform(requested);load();if(status==="success"){setMessage(`${q.get("platform")} connected securely. Now click Connect & Load Campaign.`);localStorage.removeItem("vivit-meta-connect")}if(status==="missing")setMessage(`${q.get("platform")} developer app keys are not configured in Vercel yet.`);if(status==="error")setMessage(q.get("message")||"Connection failed.");window.history.replaceState({},"",window.location.pathname)},[]);',
            'useEffect(()=>{const timer=setTimeout(()=>{const saved=localStorage.getItem("vivit-meta-connect");if(saved)try{const s=JSON.parse(saved);setClientId(s.clientId||"");setAdAccountId(s.adAccountId||"");setCampaignId(s.campaignId||"");setAccountName(s.accountName||"")}catch{}const q=new URLSearchParams(window.location.search),status=q.get("oauth"),requested=(q.get("platform")||"").toUpperCase();if(platforms.includes(requested))setSelectedPlatform(requested);void load();if(status==="success"){setMessage(`${q.get("platform")} connected securely. Now click Connect & Load Campaign.`);localStorage.removeItem("vivit-meta-connect")}if(status==="missing")setMessage(`${q.get("platform")} developer app keys are not configured in Vercel yet.`);if(status==="error")setMessage(q.get("message")||"Connection failed.");window.history.replaceState({},"",window.location.pathname)},0);return()=>clearTimeout(timer)},[]);');

          one('components/layout/Header.tsx',
            'useEffect(()=>{try{setHistory(JSON.parse(localStorage.getItem("vivit-search-history")??"[]"));const saved=(localStorage.getItem("vivit-lang") as "en"|"ar")||"en";setLang(saved);document.documentElement.lang=saved;document.documentElement.dir=saved==="ar"?"rtl":"ltr"}catch{}},[]);',
            'useEffect(()=>{const timer=setTimeout(()=>{try{setHistory(JSON.parse(localStorage.getItem("vivit-search-history")??"[]"));const saved=(localStorage.getItem("vivit-lang") as "en"|"ar")||"en";setLang(saved);document.documentElement.lang=saved;document.documentElement.dir=saved==="ar"?"rtl":"ltr"}catch{}},0);return()=>clearTimeout(timer)},[]);');

          one('components/layout/Sidebar.tsx',
            'useEffect(()=>{const c=localStorage.getItem("vivit-sidebar-collapsed")==="true",t=(localStorage.getItem("vivit-theme") as any)||"light",l=(localStorage.getItem("vivit-lang") as any)||"en";setCollapsed(c);setTheme(t);setLang(l);document.documentElement.classList.toggle("dark",t==="dark");const h=(e:Event)=>setLang((e as CustomEvent).detail);window.addEventListener("vivit-language",h);return()=>window.removeEventListener("vivit-language",h)},[]);',
            'useEffect(()=>{const h=(e:Event)=>setLang((e as CustomEvent).detail);window.addEventListener("vivit-language",h);const timer=setTimeout(()=>{const c=localStorage.getItem("vivit-sidebar-collapsed")==="true",t=(localStorage.getItem("vivit-theme") as any)||"light",l=(localStorage.getItem("vivit-lang") as any)||"en";setCollapsed(c);setTheme(t);setLang(l);document.documentElement.classList.toggle("dark",t==="dark")},0);return()=>{clearTimeout(timer);window.removeEventListener("vivit-language",h)}},[]);');

          for(const file of ['components/media/MediaControlV2.tsx','components/media/MediaIntelligenceWorkspace.tsx','components/media/MediaIntelligenceWorkspaceV2.tsx']){
            one(file,'useEffect(()=>{load(defaultFrom,today)},[]);','useEffect(()=>{const timer=setTimeout(()=>void load(defaultFrom,today),0);return()=>clearTimeout(timer)},[]);');
          }

          one('components/media/MetaAccountConnectPanel.tsx',
            'useEffect(()=>{load();const q=new URLSearchParams(location.search),oauth=q.get("oauth"),connectionId=q.get("connectionId");if(oauth==="success"&&connectionId){setTone("info");setMsg("Meta connected. Updating campaign data…");syncAll(connectionId,true)}else if(oauth==="error"){setTone("warn");setMsg(q.get("message")||"Meta connection failed")};history.replaceState({},"",location.pathname)},[]);',
            'useEffect(()=>{const timer=setTimeout(()=>{void load();const q=new URLSearchParams(location.search),oauth=q.get("oauth"),connectionId=q.get("connectionId");if(oauth==="success"&&connectionId){setTone("info");setMsg("Meta connected. Updating campaign data…");void syncAll(connectionId,true)}else if(oauth==="error"){setTone("warn");setMsg(q.get("message")||"Meta connection failed")};history.replaceState({},"",location.pathname)},0);return()=>clearTimeout(timer)},[]);');

          one('components/media/MetaAccountConnectPanel.tsx',
            'useEffect(()=>{if(autoRan.current)return;const accounts=(data.accountGroups||[]).filter((a:any)=>a.platform==="META"&&a.status!=="DISABLED"&&(a.status==="CONNECTED"||a.status==="ERROR"));if(!accounts.length)return;autoRan.current=true;const stale=accounts.filter((a:any)=>!a.lastSyncAt||Date.now()-new Date(a.lastSyncAt).getTime()>STALE_MS);if(!stale.length){setTone("ok");setMsg("");return}(async()=>{setTone("info");setMsg("Updating Meta data…");for(let i=0;i<stale.length;i++){const result=await syncAll(stale[i].id,true,false);if(result?.rateLimited){setTone("warn");setMsg("Meta is temporarily rate-limiting requests. Showing the latest successful data; automatic sync will retry later.");break}if(i<stale.length-1)await sleep(1200)}await load();if(!isRateLimit(msg)){setTone("ok");setMsg("")}})()},[data.accountGroups]);',
            'useEffect(()=>{const timer=setTimeout(()=>{if(autoRan.current)return;const accounts=(data.accountGroups||[]).filter((a:any)=>a.platform==="META"&&a.status!=="DISABLED"&&(a.status==="CONNECTED"||a.status==="ERROR"));if(!accounts.length)return;autoRan.current=true;const stale=accounts.filter((a:any)=>!a.lastSyncAt||Date.now()-new Date(a.lastSyncAt).getTime()>STALE_MS);if(!stale.length){setTone("ok");setMsg("");return}void (async()=>{setTone("info");setMsg("Updating Meta data…");for(let i=0;i<stale.length;i++){const result=await syncAll(stale[i].id,true,false);if(result?.rateLimited){setTone("warn");setMsg("Meta is temporarily rate-limiting requests. Showing the latest successful data; automatic sync will retry later.");break}if(i<stale.length-1)await sleep(1200)}await load();if(!isRateLimit(msg)){setTone("ok");setMsg("")}})()},0);return()=>clearTimeout(timer)},[data.accountGroups]);');

          one('components/vivito/DirectOperatorPanel.tsx',
            'useEffect(()=>{void load();const i=setInterval(()=>void load(),30000);return()=>clearInterval(i)},[load]);',
            'useEffect(()=>{const initial=setTimeout(()=>void load(),0),i=setInterval(()=>void load(),30000);return()=>{clearTimeout(initial);clearInterval(i)}},[load]);');
          one('components/whatsapp/WhatsAppWorkspace.tsx',
            'useEffect(()=>{load()},[]);',
            'useEffect(()=>{const timer=setTimeout(()=>void load(),0);return()=>clearTimeout(timer)},[]);');
          NODE
          git diff --check
      - name: Whole-project acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
          git diff --check
      - name: Assert set-state lint closed and measure full lint
        shell: bash
        run: |
          set -euo pipefail
          npx eslint . -f json > /tmp/eslint.json || true
          node <<'NODE'
          const fs=require('node:fs');const rows=JSON.parse(fs.readFileSync('/tmp/eslint.json','utf8'));const m=rows.flatMap(r=>r.messages||[]),c={};for(const x of m)c[x.ruleId||'(parser)']=(c[x.ruleId||'(parser)']||0)+1;const hits=m.filter(x=>x.ruleId==='react-hooks/set-state-in-effect');console.log(`set_state_remaining=${hits.length}`);console.log(`remaining_total=${m.length}`);console.log(`remaining_any=${m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any').length}`);console.log('top_rules='+JSON.stringify(Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,12)));if(hits.length)process.exit(1);
          NODE
      - name: Commit verified source set-state cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'
          git add app components
          if ! git diff --cached --quiet; then
            git commit -m 'fix(react): schedule effect hydration and initial loads [skip ci]'
            git push origin HEAD:feat/vivito-static-setstate-v3
          fi
