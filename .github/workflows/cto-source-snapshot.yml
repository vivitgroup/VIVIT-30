name: CTO Source Snapshot

on:
  push:
    branches:
      - feat/vivito-internal-100
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply TypeScript source remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('app/api/cron/media-sync/route.ts'); s=p.read_text()
          old='await db.insert(adPerformanceDaily).values({campaignId:c.id,date,breakdownType:"TOTAL",breakdownValue:"ALL",spend,impressions,reach,clicks,results,purchases,addToCart,revenue,frequency,ctr,cpc,cpm,cpl:cpr,costPerResult:cpr,cpa:purchases?spend/purchases:0,roas:spend?revenue/spend:0});'
          new='await db.execute(sql`insert into ad_performance_daily(id,campaign_id,date,breakdown_type,breakdown_value,spend,impressions,reach,clicks,results,qualified_leads,purchases,add_to_cart,revenue,frequency,ctr,cpc,cpm,cpl,cost_per_result,cpa,roas) values(gen_random_uuid()::text,${c.id},${date}::timestamp,\'TOTAL\',\'ALL\',${spend},${impressions},${reach},${clicks},${results},0,${purchases},${addToCart},${revenue},${frequency},${ctr},${cpc},${cpm},${cpr},${cpr},${purchases?spend/purchases:0},${spend?revenue/spend:0})`);'
          if old in s: p.write_text(s.replace(old,new))

          p=Path('app/api/media-discover/route.ts'); s=p.read_text()
          old='existing=(await db.select().from(adCampaigns).where(and(eq(adCampaigns.platform,"META"),eq(adCampaigns.externalId,externalId))).limit(1))[0],'
          new='existing=(await db.select({id:adCampaigns.id,archivedAt:sql<Date|null>`archived_at`}).from(adCampaigns).where(and(eq(adCampaigns.platform,"META"),eq(adCampaigns.externalId,externalId))).limit(1))[0],'
          if old in s: p.write_text(s.replace(old,new))

          p=Path('app/api/recurring/route.ts'); s=p.read_text()
          s=s.replace('workspaceId:workspaceId,userId:admin.id,type:"GENERAL"','userId:admin.id,type:"GENERAL"')
          p.write_text(s)

          p=Path('app/dashboard/finance/page.tsx'); s=p.read_text()
          s=s.replace('async function markPaid(fd:FormData){"use server";const session=await requireFinanceUser(),id=','async function markPaid(fd:FormData){"use server";const {session,workspaceId}=await requireFinanceUser(),id=')
          s=s.replace('const totals=Array.from(ledgerTotals as any),ledgerRevenue=Number(totals.find((x:any)=>x.direction==="IN")?.total||0),ledgerExpenses=Number(totals.find((x:any)=>x.direction==="OUT")?.total||0)','const totals=Array.from(ledgerTotals) as Array<{direction:string;total:string|number}>,ledgerRevenue=Number(totals.find(x=>x.direction==="IN")?.total||0),ledgerExpenses=Number(totals.find(x=>x.direction==="OUT")?.total||0)')
          s=s.replace('months=Array.from(monthlyLedger as any),monthMap:any={};for(const r of months){const m=Number(r.month);monthMap[m]??={IN:0,OUT:0};monthMap[m][r.direction]=Number(r.total||0)}','months=Array.from(monthlyLedger) as Array<{month:number|string;direction:string;total:string|number}>,monthMap:Record<number,Record<string,number>>={};for(const r of months){const m=Number(r.month);monthMap[m]??={IN:0,OUT:0};monthMap[m][r.direction]=Number(r.total||0)}')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript gate before commit
        run: npm run type-check

      - name: Verify static architecture gate before commit
        run: node scripts/qa-cto-static-audit.mjs

      - name: Commit TypeScript remediation
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "VIVIT CTO Gate Bot"
            git config user.email "groupvivit@gmail.com"
            git add app
            git commit -m "fix(cto): close TypeScript runtime blockers"
            git push origin HEAD:feat/vivito-internal-100
          fi

      - name: Capture lint before fixes
        shell: bash
        run: npx eslint . -f json > eslint-before.json || true

      - name: Apply safe ESLint autofixes
        shell: bash
        run: |
          npx eslint . --fix || true
          git diff -- . > eslint-autofix.patch

      - name: Capture lint after fixes
        shell: bash
        run: npx eslint . -f json > eslint-after.json || true

      - name: Capture TypeScript gate
        shell: bash
        run: npm run type-check > typecheck.txt 2>&1 || true

      - name: Capture static architecture gate
        shell: bash
        run: node scripts/qa-cto-static-audit.mjs > cto-static.txt 2>&1 || true

      - name: Upload diagnostics and autofixed source
        uses: actions/upload-artifact@v4
        with:
          name: cto-gate-diagnostics
          path: |
            eslint-before.json
            eslint-after.json
            eslint-autofix.patch
            typecheck.txt
            cto-static.txt
            app/**
            components/**
            lib/**
            db/**
            scripts/**
            types/**
            auth.config.ts
            proxy.ts
            eslint.config.mjs
            tsconfig.json
            package.json
            package-lock.json
          include-hidden-files: true
          retention-days: 1
