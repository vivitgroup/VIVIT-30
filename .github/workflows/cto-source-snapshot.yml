name: CTO Source Snapshot

on:
  push:
    branches:
      - feat/vivito-internal-100
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cto-source-snapshot
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
          include-hidden-files: true
          retention-days: 1
