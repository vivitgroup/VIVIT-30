name: CTO Static Aggregate Validate

on:
  push:
    branches: [feat/vivito-static-aggregate]
    paths:
      - '.github/workflows/cto-static-aggregate-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-static-aggregate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript acceptance
        run: npm run type-check
      - name: CTO static invariants
        run: node scripts/qa-cto-static-audit.mjs
      - name: Full ESLint measurement
        shell: bash
        run: |
          npx eslint . -f json > /tmp/eslint.json || true
          node <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/eslint.json','utf8'));
          const m=rows.flatMap(r=>r.messages||[]), counts={};
          for(const x of m)counts[x.ruleId||'(parser)']=(counts[x.ruleId||'(parser)']||0)+1;
          console.log(`remaining_total=${m.length}`);
          console.log(`remaining_errors=${m.filter(x=>x.severity===2).length}`);
          console.log(`remaining_warnings=${m.filter(x=>x.severity===1).length}`);
          console.log(`remaining_explicit_any=${m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any').length}`);
          console.log(`remaining_unused=${m.filter(x=>x.ruleId==='@typescript-eslint/no-unused-vars').length}`);
          console.log('top_rules='+JSON.stringify(Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,25)));
          NODE
