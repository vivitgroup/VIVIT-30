name: CTO Static Architecture Audit

on:
  push:
    branches:
      - feat/vivito-internal-100
      - release/vivito-rc1-2026-08-27
      - diag/eslint-report-10ec4431
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cto-static-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Assert exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "candidate=$CANDIDATE_SHA"
          echo "checkout=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$CANDIDATE_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate ESLint diagnostic report
        shell: bash
        run: |
          npx eslint . --format json --output-file eslint-report.json || true
          test -f eslint-report.json

      - name: Upload ESLint diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: error
          retention-days: 1

      - name: ESLint zero-warning acceptance
        run: npx eslint . --max-warnings=0

      - name: Repository-wide CTO static acceptance
        run: node scripts/qa-cto-static-audit.mjs

      - name: Release-focused static acceptance
        run: node scripts/qa-cto-release-audit.mjs

      - name: TypeScript acceptance
        run: npm run type-check
