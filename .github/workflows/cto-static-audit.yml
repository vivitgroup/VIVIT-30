name: CTO Static Architecture Audit
on:
  push:
    branches: [feat/vivito-internal-100]
    paths:
      - '.github/workflows/cto-static-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
      - name: Fixed workspace/runtime scope scan
        run: |
          echo '=== fixed default workspace references in app/components/lib ==='
          grep -RInE 'const (W|WORKSPACE)="default"|workspace(Id|_id)[^\n]*"default"|workspace(Id|_id)[^\n]*\x27default\x27' app components lib --include='*.ts' --include='*.tsx' || true
      - name: Shared DB helper callers
        run: |
          echo '=== DB helper definitions/callers ==='
          grep -RInE 'getCachedClients|getCachedTeam|getClientsWithAMs|getTasksWithClients' app components lib --include='*.ts' --include='*.tsx' || true
      - name: Incomplete UI markers
        run: |
          echo '=== TODO / not implemented / placeholder links ==='
          grep -RInE 'TODO|FIXME|Not implemented|not implemented|Coming soon|coming soon|href=["'"']#["'"']|alert\([^)]*(not available|not implemented|coming soon)' app components lib --include='*.ts' --include='*.tsx' || true
      - name: Suspicious disabled controls
        run: |
          echo '=== hard-disabled buttons/inputs ==='
          grep -RInE '<(button|input|select|textarea)[^>]*disabled([ >]|=\{true\})' app components --include='*.tsx' || true
      - name: Raw default tenant literals
        run: |
          echo '=== all runtime "default" literals (review list) ==='
          grep -RIn '"default"' app components lib --include='*.ts' --include='*.tsx' || true
