name: CTO Static Nonconflict B

on:
  push:
    branches: [feat/vivito-static-nonconflict-b]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-static-nonconflict-b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply hook cleanup
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const edit=(file,repls)=>{let s=fs.readFileSync(file,'utf8');for(const [a,b,all] of repls){if(!s.includes(a))throw new Error(`${file}: missing replacement source`);s=all?s.replaceAll(a,b):s.replace(a,b)}fs.writeFileSync(file,s)};
          edit('app/dashboard/archive/page.tsx',[
            ['import {useEffect,useState} from "react";','import {useCallback,useEffect,useState} from "react";'],
            [' async function load(){setLoading(true);setError("");try{const [r,sr]=await Promise.all([fetch("/api/lifecycle",{cache:"no-store"}),fetch("/api/auth/session",{cache:"no-store"})]);const d=await r.json().catch(()=>({})),s=await sr.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Could not load archive");setData({clients:d.clients||[],tasks:d.tasks||[],leads:d.leads||[]});setRole(String(s?.user?.role||""))}catch(e){setError(e.message)}finally{setLoading(false)}}',' const load=useCallback(async()=>{setLoading(true);setError("");try{const [r,sr]=await Promise.all([fetch("/api/lifecycle",{cache:"no-store"}),fetch("/api/auth/session",{cache:"no-store"})]);const d=await r.json().catch(()=>({})),s=await sr.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Could not load archive");setData({clients:d.clients||[],tasks:d.tasks||[],leads:d.leads||[]});setRole(String(s?.user?.role||""))}catch(e){setError(e.message)}finally{setLoading(false)}},[]);'],
            [' useEffect(()=>{load()},[]);',' useEffect(()=>{const timer=setTimeout(()=>void load(),0);return()=>clearTimeout(timer)},[load]);']
          ]);
          edit('app/dashboard/files/page.tsx',[
            ['import {useEffect,useState} from "react";','import {useCallback,useEffect,useState} from "react";'],
            [' async function load(next=view){setLoading(true);setError("");try{const [r,cr]=await Promise.all([fetch(`/api/files${next==="archived"?"?view=archived":""}`,{cache:"no-store"}),fetch("/api/clients",{cache:"no-store"})]),d=await r.json().catch(()=>({})),cd=await cr.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Could not load files");setFiles(d.files||[]);if(cr.ok)setClients(cd.clients||[])}catch(e){setError(e.message)}finally{setLoading(false)}}',' const load=useCallback(async(next:"active"|"archived")=>{setLoading(true);setError("");try{const [r,cr]=await Promise.all([fetch(`/api/files${next==="archived"?"?view=archived":""}`,{cache:"no-store"}),fetch("/api/clients",{cache:"no-store"})]),d=await r.json().catch(()=>({})),cd=await cr.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Could not load files");setFiles(d.files||[]);if(cr.ok)setClients(cd.clients||[])}catch(e){setError(e.message)}finally{setLoading(false)}},[]);'],
            [' useEffect(()=>{load(view)},[view]);',' useEffect(()=>{const timer=setTimeout(()=>void load(view),0);return()=>clearTimeout(timer)},[load,view]);'],
            ['setEditing(null);await load()}','setEditing(null);await load(view)}']
          ]);
          edit('app/signout/page.tsx',[[
            '  useEffect(()=>setAr(localStorage.getItem("vivit-lang")==="ar"),[]);',
            '  useEffect(()=>{const timer=setTimeout(()=>setAr(localStorage.getItem("vivit-lang")==="ar"),0);return()=>clearTimeout(timer)},[]);'
          ]]);
          edit('components/layout/MobileNav.tsx',[
            [' useEffect(()=>setOpen(false),[path]);\n',''],
            ['<Link key={i.href} href={i.href} className=', '<Link key={i.href} href={i.href} onClick={()=>setOpen(false)} className=',true]
          ]);
          edit('components/keyboard-shortcuts.tsx',[
            ['  const keyBuf  = { current: "" as string };\n',''],
            ['    setTheme(saved);\n    document.documentElement.classList.toggle("light", saved === "light");','    const timer=setTimeout(()=>setTheme(saved),0);\n    document.documentElement.classList.toggle("light", saved === "light");\n    return()=>clearTimeout(timer);']
          ]);
          edit('components/settings/PreferencePanel.tsx',[[
            'useEffect(()=>{setLang(localStorage.getItem("vivit-lang")||"en");setTheme(localStorage.getItem("vivit-theme")||"light");setReminder(localStorage.getItem("vivit-task-reminder-minutes")||"60");setDesktop(localStorage.getItem("vivit-reminder-enabled")!=="false")},[]);',
            'useEffect(()=>{const timer=setTimeout(()=>{setLang(localStorage.getItem("vivit-lang")||"en");setTheme(localStorage.getItem("vivit-theme")||"light");setReminder(localStorage.getItem("vivit-task-reminder-minutes")||"60");setDesktop(localStorage.getItem("vivit-reminder-enabled")!=="false")},0);return()=>clearTimeout(timer)},[]);'
          ]]);
          NODE
      - name: Acceptance
        shell: bash
        run: |
          npm run type-check
          npx eslint app/dashboard/archive/page.tsx app/dashboard/files/page.tsx app/signout/page.tsx components/layout/MobileNav.tsx components/keyboard-shortcuts.tsx components/settings/PreferencePanel.tsx
          node scripts/qa-cto-static-audit.mjs
          git diff --check
      - name: Commit accepted cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'
          git add app components
          if ! git diff --cached --quiet; then
            git commit -m 'fix(lint): align preference and navigation effects [skip ci]'
            git push origin HEAD:feat/vivito-static-nonconflict-b
          fi
