name: CTO Static Nonconflict C

on:
  push:
    branches: [feat/vivito-static-nonconflict-c]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-static-nonconflict-c
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply expression cleanup
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const edit=(file,a,b)=>{let s=fs.readFileSync(file,'utf8');if(!s.includes(a))throw new Error(`${file}: source not found`);fs.writeFileSync(file,s.replace(a,b))};
          edit('components/calendar/CalendarClient.tsx',
            '  function prevMonth() { month===0 ? (setMonth(11), setYear(y=>y-1)) : setMonth(m=>m-1); }\n  function nextMonth() { month===11? (setMonth(0),  setYear(y=>y+1)) : setMonth(m=>m+1); }',
            '  function prevMonth() { if(month===0){setMonth(11);setYear(y=>y-1)}else setMonth(m=>m-1); }\n  function nextMonth() { if(month===11){setMonth(0);setYear(y=>y+1)}else setMonth(m=>m+1); }');
          edit('lib/vivito/evaluator.ts',
            '    d.score+=c.score;d.maxScore+=c.maxScore;c.passed?d.passed++:d.failed++;dimensions[c.dimension]=d;',
            '    d.score+=c.score;d.maxScore+=c.maxScore;if(c.passed)d.passed++;else d.failed++;dimensions[c.dimension]=d;');
          NODE
      - name: Acceptance
        run: |
          npm run type-check
          npx eslint components/calendar/CalendarClient.tsx lib/vivito/evaluator.ts
          node scripts/qa-cto-static-audit.mjs
          git diff --check
      - name: Commit accepted cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'
          git add components/calendar/CalendarClient.tsx lib/vivito/evaluator.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(lint): replace side-effect expressions with control flow [skip ci]'
            git push origin HEAD:feat/vivito-static-nonconflict-c
          fi
