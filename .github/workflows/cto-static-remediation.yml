name: CTO Static Remediation Worker

on:
  push:
    branches: [feat/vivito-static-remediation]
    paths:
      - '.github/workflows/cto-static-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: feat/vivito-static-remediation
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Configure remediation identity
        run: |
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'

      - name: Baseline TypeScript acceptance
        run: npm run type-check

      - name: Compiler-safe explicit-any bisection
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const {spawnSync}=require('node:child_process');

          const manifestPath='.cto/unknown-remediation-processed.json';
          fs.mkdirSync('.cto',{recursive:true});
          let processed=[];
          try{processed=JSON.parse(fs.readFileSync(manifestPath,'utf8'))}catch{}
          const processedSet=new Set(Array.isArray(processed)?processed:[]);

          const lint=spawnSync('npx',['eslint','.','-f','json'],{encoding:'utf8',maxBuffer:64*1024*1024});
          if(!lint.stdout.trim()){
            console.error(lint.stderr||'ESLint did not produce JSON');
            process.exit(1);
          }
          const rows=JSON.parse(lint.stdout);
          const candidates=[];
          for(const row of rows){
            const rel=path.relative(process.cwd(),row.filePath).replaceAll('\\','/');
            if(rel.startsWith('..')||processedSet.has(rel))continue;
            const ranges=[];
            for(const msg of row.messages||[]){
              if(msg.ruleId!=='@typescript-eslint/no-explicit-any')continue;
              const suggestion=(msg.suggestions||[]).find(s=>s?.fix?.text==='unknown'&&Array.isArray(s?.fix?.range));
              if(suggestion)ranges.push(suggestion.fix.range);
            }
            const unique=[...new Map(ranges.map(r=>[`${r[0]}:${r[1]}`,r])).values()].sort((a,b)=>b[0]-a[0]);
            if(unique.length)candidates.push({file:rel,ranges:unique});
          }
          candidates.sort((a,b)=>a.ranges.length-b.ranges.length||a.file.localeCompare(b.file));

          const started=Date.now();
          const deadline=started+42*60*1000;
          const tsc=()=>spawnSync('npx',['tsc','--noEmit','--pretty','false'],{encoding:'utf8',maxBuffer:32*1024*1024});
          const render=(original,ranges)=>{
            let out=original;
            for(const [start,end] of [...ranges].sort((a,b)=>b[0]-a[0])){
              if(out.slice(start,end)!=='any')throw new Error(`Unexpected ESLint range ${start}:${end}: ${JSON.stringify(out.slice(start,end))}`);
              out=out.slice(0,start)+'unknown'+out.slice(end);
            }
            return out;
          };
          const key=r=>`${r[0]}:${r[1]}`;
          let filesDone=0,acceptedTotal=0,rejectedTotal=0;

          class BudgetStop extends Error{}
          for(const entry of candidates){
            if(Date.now()>deadline)break;
            const {file,ranges}=entry;
            const original=fs.readFileSync(file,'utf8');
            const accepted=[];
            const rejected=[];
            const acceptedKeys=new Set();

            const persistAccepted=()=>fs.writeFileSync(file,render(original,accepted));
            const tryGroup=(group)=>{
              if(!group.length)return;
              if(Date.now()>deadline)throw new BudgetStop('time budget reached');
              const trial=[...accepted,...group];
              fs.writeFileSync(file,render(original,trial));
              const result=tsc();
              if(result.status===0){
                for(const r of group)if(!acceptedKeys.has(key(r))){accepted.push(r);acceptedKeys.add(key(r));}
                persistAccepted();
                return;
              }
              persistAccepted();
              if(group.length===1){rejected.push(group[0]);return;}
              const mid=Math.floor(group.length/2);
              tryGroup(group.slice(0,mid));
              tryGroup(group.slice(mid));
            };

            let completed=false;
            try{
              tryGroup(ranges);
              completed=true;
            }catch(error){
              if(!(error instanceof BudgetStop))throw error;
              persistAccepted();
              console.log(`budget_stop_in_file=${file}`);
            }

            const final=tsc();
            if(final.status!==0){
              console.error(final.stdout);console.error(final.stderr);
              fs.writeFileSync(file,original);
              throw new Error(`Final typecheck failed after ${file}`);
            }

            acceptedTotal+=accepted.length;
            rejectedTotal+=rejected.length;
            if(completed){
              processedSet.add(file);
              filesDone++;
              fs.writeFileSync(manifestPath,JSON.stringify([...processedSet].sort(),null,2)+'\n');
              console.log(`processed ${file} accepted=${accepted.length} rejected=${rejected.length}`);
            }
            if(!completed)break;
          }

          const remainingFiles=candidates.filter(x=>!processedSet.has(x.file)).length;
          fs.writeFileSync('/tmp/remediation-state.json',JSON.stringify({filesDone,acceptedTotal,rejectedTotal,remainingFiles,processedFiles:processedSet.size}));
          console.log(`files_done_this_run=${filesDone}`);
          console.log(`accepted_occurrences_this_run=${acceptedTotal}`);
          console.log(`rejected_occurrences_this_run=${rejectedTotal}`);
          console.log(`remaining_unprocessed_files=${remainingFiles}`);
          NODE

      - name: Whole-project acceptance after remediation
        run: |
          npm run type-check
          git diff --check
          node scripts/qa-cto-static-audit.mjs

      - name: Report remaining lint debt
        shell: bash
        run: |
          npx eslint . -f json > /tmp/eslint-after.json || true
          node <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/eslint-after.json','utf8'));
          const messages=rows.flatMap(r=>r.messages||[]);
          const counts={};
          for(const m of messages)counts[m.ruleId||'(parser)']=(counts[m.ruleId||'(parser)']||0)+1;
          console.log(`remaining_total=${messages.length}`);
          console.log(`remaining_errors=${messages.filter(m=>m.severity===2).length}`);
          console.log(`remaining_warnings=${messages.filter(m=>m.severity===1).length}`);
          console.log(`remaining_explicit_any=${messages.filter(m=>m.ruleId==='@typescript-eslint/no-explicit-any').length}`);
          console.log('top_rules='+JSON.stringify(Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,20)));
          NODE

      - name: Checkpoint verified remediation
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git add app components lib scripts types proxy.ts auth.config.ts .cto 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m 'fix(types): checkpoint compiler-safe unknown remediation [skip ci]'
              git push origin HEAD:feat/vivito-static-remediation
            fi
          fi

      - name: Continue next remediation batch when needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(node -e 'const s=require("/tmp/remediation-state.json");process.stdout.write(String(s.remainingFiles||0))')
          echo "remaining_unprocessed_files=$remaining"
          if [ "$remaining" -gt 0 ]; then
            gh workflow run cto-static-remediation.yml --ref feat/vivito-static-remediation
          fi
