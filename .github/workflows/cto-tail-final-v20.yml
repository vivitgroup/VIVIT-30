name: CTO Tail Final V20
on:
  push:
    branches: [feat/vivito-tail-final-v20]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-tail-final-v20
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full acceptance baseline
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
          npx eslint . -f json > /tmp/all.json || true
          node <<'NODE'
          const fs=require('node:fs');
          const rows=require('/tmp/all.json');
          const messages=[];
          for(const f of rows){for(const m of f.messages||[]){if(m.ruleId==='@typescript-eslint/no-explicit-any'){messages.push({file:f.filePath.replace(process.cwd()+'/', ''),line:m.line,column:m.column,message:m.message});}}}
          console.log(`remaining_any=${messages.length}`);
          const by={};for(const x of messages)(by[x.file]??=[]).push(x);
          for(const [file,items] of Object.entries(by)){console.log(`FILE ${file} COUNT ${items.length}`);for(const x of items)console.log(`  ${x.line}:${x.column} ${x.message}`)}
          const non=rows.flatMap(x=>(x.messages||[]).filter(m=>m.ruleId!=='@typescript-eslint/no-explicit-any'));
          const warnings=rows.flatMap(x=>(x.messages||[]).filter(m=>m.severity===1));
          console.log(`non_any=${non.length} warnings=${warnings.length}`);
          if(messages.length!==16||non.length||warnings.length)process.exit(1);
          NODE
