name: CTO Tail Zero V21
on:
  push:
    branches: [feat/vivito-tail-zero-v21]
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-tail-zero-v21
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
          npx eslint . -f json > /tmp/base.json || true
          node <<'NODE'
          const m=require('/tmp/base.json').flatMap(x=>x.messages||[]),a=m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any'),n=m.filter(x=>x.ruleId!=='@typescript-eslint/no-explicit-any'),w=m.filter(x=>x.severity===1);console.log(`baseline_any=${a.length} non_any=${n.length} warnings=${w.length}`);if(a.length!==5||n.length||w.length)process.exit(1)
          NODE
      - name: Apply final contracts
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          function patch(file,ops){let s=fs.readFileSync(file,'utf8');for(const [from,to,count=1] of ops){const n=s.split(from).length-1;if(n!==count)throw new Error(`${file}: expected ${count}, found ${n}: ${from.slice(0,180)}`);s=s.split(from).join(to)}fs.writeFileSync(file,s)}
          patch('app/dashboard/creative/page.tsx',[
            ['const lane=(t:any)=>t.priority==="URGENT"&&!['+"'COMPLETED','REJECTED'"+'].includes(t.status)?"URGENT":t.status;','const lane=(t:(typeof tasks)[number])=>t.priority==="URGENT"&&!['+"'COMPLETED','REJECTED'"+'].includes(t.status)?"URGENT":t.status;']
          ]);
          patch('app/dashboard/ai-studio/operations/page.tsx',[
            ['const rows=(v:unknown)=>Array.from(v as any) as any[];','type AuditData={op?:unknown;result?:{action?:unknown}};\nconst auditData=(v:unknown):AuditData=>{if(!v||typeof v!=="object"||Array.isArray(v))return{};const r=v as Record<string,unknown>,result=r.result;return{op:r.op,result:result&&typeof result==="object"&&!Array.isArray(result)?{action:(result as Record<string,unknown>).action}:undefined}};'],
            [' const raw=rows(await db.execute(sql`select id,user_id,action,entity,entity_id,new_values,created_at from audit_logs where workspace_id=${workspaceId} and action like \'vivito_%\' ${owner} order by created_at desc limit 120`));',' const raw=Array.from(await db.execute(sql`select id,user_id,action,entity,entity_id,new_values,created_at from audit_logs where workspace_id=${workspaceId} and action like \'vivito_%\' ${owner} order by created_at desc limit 120`)).map(r=>({id:String(r.id||""),action:String(r.action||""),entity_id:r.entity_id==null?null:String(r.entity_id),new_values:r.new_values,created_at:r.created_at instanceof Date?r.created_at:new Date(String(r.created_at||0))}));'],
            [' const events=raw.map(r=>{let data:unknown={};try{data=typeof r.new_values==="string"?JSON.parse(r.new_values):r.new_values||{}}catch{}const failed=String(r.action).includes("stopped")||String(r.action).includes("failed");return{...r,data,status:failed?"FAILED":"SUCCESS"}});',' const events=raw.map(r=>{let parsed:unknown={};try{parsed=typeof r.new_values==="string"?JSON.parse(r.new_values):r.new_values||{}}catch{}const data=auditData(parsed),failed=r.action.includes("stopped")||r.action.includes("failed");return{...r,data,status:failed?"FAILED":"SUCCESS"}});'],
            ['<td>{e.data?.op||e.data?.result?.action||"—"}</td>','<td>{String(e.data?.op||e.data?.result?.action||"—")}</td>']
          ]);
          patch('lib/ad-oauth.ts',[
            ['type TokenSet={accessToken:string;refreshToken?:string;expiresIn?:number};','type TokenSet={accessToken:string;refreshToken?:string;expiresIn?:number};\ntype ConnectionTokenSource=Pick<typeof adPlatformConnections.$inferSelect,"id"|"platform"|"accessTokenEncrypted"|"refreshTokenEncrypted"|"tokenExpiresAt">;\nconst OAUTH_PLATFORMS=new Set<string>(["META","TIKTOK","GOOGLE","SNAPCHAT","LINKEDIN"]);\nconst isOAuthPlatform=(value:string):value is OAuthPlatform=>OAUTH_PLATFORMS.has(value);\nconst connectionTokenSource=(value:unknown):ConnectionTokenSource|null=>{if(!value||typeof value!=="object"||Array.isArray(value))return null;const r=value as Record<string,unknown>;if(typeof r.id!=="string"||typeof r.platform!=="string")return null;return{id:r.id,platform:r.platform,accessTokenEncrypted:typeof r.accessTokenEncrypted==="string"?r.accessTokenEncrypted:null,refreshTokenEncrypted:typeof r.refreshTokenEncrypted==="string"?r.refreshTokenEncrypted:null,tokenExpiresAt:r.tokenExpiresAt instanceof Date?r.tokenExpiresAt:r.tokenExpiresAt?new Date(String(r.tokenExpiresAt)):null}};'],
            ['export async function connectionAccessToken(connection:any){if(!connection?.accessTokenEncrypted)return"";const exp=connection.tokenExpiresAt?new Date(connection.tokenExpiresAt).getTime():0;if(!exp||exp>Date.now()+5*60_000)return decryptToken(connection.accessTokenEncrypted);const refreshToken=decryptToken(connection.refreshTokenEncrypted);if(!refreshToken)return decryptToken(connection.accessTokenEncrypted);const next=await refresh(connection.platform as OAuthPlatform,refreshToken);','export async function connectionAccessToken(value:unknown){const connection=connectionTokenSource(value);if(!connection?.accessTokenEncrypted)return"";const exp=connection.tokenExpiresAt?connection.tokenExpiresAt.getTime():0;if(!exp||exp>Date.now()+5*60_000)return decryptToken(connection.accessTokenEncrypted);const refreshToken=decryptToken(connection.refreshTokenEncrypted);if(!refreshToken)return decryptToken(connection.accessTokenEncrypted);if(!isOAuthPlatform(connection.platform))throw new Error("Unsupported OAuth platform");const next=await refresh(connection.platform,refreshToken);']
          ]);
          patch('app/approve/[token]/page.tsx',[
            ['await tx.insert(auditLogs).values({workspaceId,userId:null,action:action==="APPROVED"?"approval_link_approved":"approval_link_revision",entity:"creative_tasks",entityId:freshTask.id,newValues:JSON.stringify({clientId:freshTask.clientId,comment:action==="REVISION"?comment:null})} as any)','const auditValue:typeof auditLogs.$inferInsert={workspaceId,userId:"approval-link:"+freshClient.id,action:action==="APPROVED"?"approval_link_approved":"approval_link_revision",entity:"creative_tasks",entityId:freshTask.id,newValues:JSON.stringify({clientId:freshTask.clientId,comment:action==="REVISION"?comment:null})};await tx.insert(auditLogs).values(auditValue)']
          ]);
          NODE
          git diff --check
      - name: Zero-debt acceptance
        run: |
          npm run type-check
          node scripts/qa-cto-static-audit.mjs
          npx eslint . -f json > /tmp/all.json || true
          node <<'NODE'
          const m=require('/tmp/all.json').flatMap(x=>x.messages||[]),a=m.filter(x=>x.ruleId==='@typescript-eslint/no-explicit-any'),n=m.filter(x=>x.ruleId!=='@typescript-eslint/no-explicit-any'),w=m.filter(x=>x.severity===1);console.log(`remaining_any=${a.length} non_any=${n.length} warnings=${w.length} total=${m.length}`);if(m.length||a.length||n.length||w.length)process.exit(1)
          NODE
      - name: Commit source
        run: |
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'
          git add app/dashboard/creative/page.tsx app/dashboard/ai-studio/operations/page.tsx lib/ad-oauth.ts app/approve/[token]/page.tsx
          git commit -m 'fix(types): close final explicit-any tail [skip ci]'
          git push origin HEAD:feat/vivito-tail-zero-v21
