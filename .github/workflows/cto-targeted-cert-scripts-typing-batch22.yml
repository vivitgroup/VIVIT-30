name: CTO Targeted Certification Scripts Typing Batch 22

on:
  push:
    branches: [feat/vivito-internal-100]
    paths:
      - '.github/workflows/cto-targeted-cert-scripts-typing-batch22.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply certification script typing remediation
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/certify-vivito-internal-acceptance-e2e.ts'); s=p.read_text()
          reps=[
            ('const rows=(v:any)=>Array.from(v as any) as any[];', 'const rows=<T extends Record<string,unknown>>(v:unknown)=>Array.from(v as Iterable<T>);'),
            ('const one=rows(await db.execute(', 'const one=rows<{id:string}>(await db.execute('),
            ('const cross=rows(await db.execute(', 'const cross=rows<{workspace_id:string}>(await db.execute('),
            ('const cp=rows(await db.execute(', 'const cp=rows<{state:{phase:number;cursor?:string};attempt:number|string;status:string}>(await db.execute('),
            ('const cps=rows(await db.execute(', 'const cps=rows<{workspace_id:string}>(await db.execute('),
            ('const outcomes=rows(await db.execute(', 'const outcomes=rows<{horizon_hours:number|string;status:string}>(await db.execute('),
            ('const due=rows(await db.execute(', 'const due=rows<{id:string}>(await db.execute('),
            ('const rolled=rows(await db.execute(', 'const rolled=rows<{status:string;rolled_back_at:unknown;rolled_back_by:string;rollback_result:{ok:boolean}}>(await db.execute('),
            ('map((r:any)=>r.workspace_id)', 'map(r=>r.workspace_id)'),
            ('map((r:any)=>Number(r.horizon_hours))', 'map(r=>Number(r.horizon_hours))'),
            ('every((r:any)=>r.status==="PENDING")', 'every(r=>r.status==="PENDING")'),
            ('some((r:any)=>r.id===retryId)', 'some(r=>r.id===retryId)'),
          ]
          for old,new in reps:
              if old not in s: raise SystemExit(f'acceptance missing fragment: {old[:100]}')
              s=s.replace(old,new)
          if 'any' in [x.strip() for x in []]: pass
          p.write_text(s)

          p=Path('scripts/run-vivito-benchmark.ts'); s=p.read_text()
          marker='function syntheticContext(test:VivitoBenchmarkCase,role:string){\n  const base:any={'
          typed='''type SyntheticContext={\n  benchmarkMode:boolean;benchmarkRule:string;role:string;scope:{clientCount:number;clientNames:string[]};\n  clients:Array<{id:string;company_name:string;industry:string}>;operations:Record<string,number>;topTasks:Array<Record<string,unknown>>;\n  media?:Record<string,number|string>;campaigns?:Array<Record<string,unknown>>;trackingHealth?:Array<Record<string,unknown>>;clientHealth?:Array<Record<string,unknown>>;\n  sales?:Record<string,unknown>;salesPipeline?:Array<Record<string,unknown>>;archivedExcluded?:boolean;finance?:Record<string,unknown>;\n};\n\nfunction syntheticContext(test:VivitoBenchmarkCase,role:string){\n  const base:SyntheticContext={'''
          if marker not in s: raise SystemExit('benchmark missing synthetic context marker')
          s=s.replace(marker,typed,1)
          s=s.replace('base.clients=base.clients.filter((x:any)=>x.company_name!=="Client Y");','base.clients=base.clients.filter(x=>x.company_name!=="Client Y");',1)
          s=s.replace('if(q.includes("backend says 12")){base.media.purchases=12;base.benchmarkRule+=" Backend purchase count is 12 while the platform reports 20.";}','if(q.includes("backend says 12")&&base.media){base.media.purchases=12;base.benchmarkRule+=" Backend purchase count is 12 while the platform reports 20.";}',1)
          old='''function isTransientProviderError(error:unknown){\n  const msg=String((error as any)?.message||error).toLowerCase();'''
          new='''const errorMessage=(error:unknown)=>error instanceof Error?error.message:String(error);\ntype GenerateOptions=Parameters<typeof generateVivito>[2];\n\nfunction isTransientProviderError(error:unknown){\n  const msg=errorMessage(error).toLowerCase();'''
          if old not in s: raise SystemExit('benchmark missing transient error helper')
          s=s.replace(old,new,1)
          s=s.replace('async function pacedGenerate(prompt:string,system:string,options:any){','async function pacedGenerate(prompt:string,system:string,options:GenerateOptions){',1)
          anchor='''  return{test,answer,role,provider:draft.provider,attempted:draft.attempted,criticApplied,criticProvider};\n}\n\nfunction readCheckpoint'''
          replacement='''  return{test,answer,role,provider:draft.provider,attempted:draft.attempted,criticApplied,criticProvider};\n}\n\ntype BenchmarkOutput=Awaited<ReturnType<typeof runCase>>&{error?:string};\n\nfunction readCheckpoint'''
          if anchor not in s: raise SystemExit('benchmark missing runCase anchor')
          s=s.replace(anchor,replacement,1)
          s=s.replace('function writeCheckpoint(selected:VivitoBenchmarkCase[],outputsById:Record<string,any>){','function writeCheckpoint(selected:VivitoBenchmarkCase[],outputsById:Record<string,BenchmarkOutput>){',1)
          s=s.replace('const outputsById:Record<string,any>={};','const outputsById:Record<string,BenchmarkOutput>={};',1)
          s=s.replace('}catch(error:any){','}catch(error:unknown){',1)
          s=s.replace('String(error?.message||error).slice(0,180)','errorMessage(error).slice(0,180)',1)
          p.write_text(s)

          p=Path('scripts/certify-vivito-execution-e2e.ts'); s=p.read_text()
          old="const run=async(op:any,args:any)=>{const out=await executeVivitoOperatorAction(op,args,'SUPER_ADMIN',adminId);"
          new="type OperatorOp=Parameters<typeof executeVivitoOperatorAction>[0];type OperatorArgs=Parameters<typeof executeVivitoOperatorAction>[1];\n const run=async(op:OperatorOp,args:OperatorArgs)=>{const out=await executeVivitoOperatorAction(op,args,'SUPER_ADMIN',adminId);"
          if old not in s: raise SystemExit('execution e2e missing run helper')
          s=s.replace(old,new,1)
          s=s.replace("Array.from(await db.execute(sql`select id,name,is_active from users where workspace_id='default' and email like 'cert-user-%@vivito.test' order by email` ) as any)","Array.from(await db.execute(sql`select id,name,is_active from users where workspace_id='default' and email like 'cert-user-%@vivito.test' order by email` ) as unknown as Iterable<{id:string;name:string;is_active:boolean}>)",1)
          s=s.replace("Array.from(await db.execute(sql`select id,referrer_id from referrals where referred_email like 'referral-%@vivito.test'` ) as any)","Array.from(await db.execute(sql`select id,referrer_id from referrals where referred_email like 'referral-%@vivito.test'` ) as unknown as Iterable<{id:string;referrer_id:string}>)",1)
          s=s.replace("Array.from(await db.execute(sql`select id from audit_logs where workspace_id='default' and user_id=${adminId} and action like 'vivito_%'` ) as any)","Array.from(await db.execute(sql`select id from audit_logs where workspace_id='default' and user_id=${adminId} and action like 'vivito_%'` ) as unknown as Iterable<{id:string}>)",1)
          s=s.replace('users.every((u:any)=>u.is_active===true)','users.every(u=>u.is_active===true)',1)
          s=s.replace('refs.every((r:any)=>r.referrer_id===adminId)','refs.every(r=>r.referrer_id===adminId)',1)
          p.write_text(s)
          PY
      - name: TypeScript acceptance
        run: npx tsc --noEmit
      - name: Targeted ESLint acceptance
        run: npx eslint scripts/certify-vivito-internal-acceptance-e2e.ts scripts/run-vivito-benchmark.ts scripts/certify-vivito-execution-e2e.ts --max-warnings=0
      - name: Commit validated remediation
        run: |
          git config user.name 'vivitgroup'
          git config user.email 'groupvivit@gmail.com'
          git add scripts/certify-vivito-internal-acceptance-e2e.ts scripts/run-vivito-benchmark.ts scripts/certify-vivito-execution-e2e.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(types): harden vivito certification scripts'
          git push origin HEAD:feat/vivito-internal-100
