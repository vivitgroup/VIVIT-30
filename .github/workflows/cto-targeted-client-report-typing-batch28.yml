name: CTO Targeted Client Report Typing Batch 28

on:
  push:
    branches: [feat/vivito-internal-100]
    paths:
      - '.github/workflows/cto-targeted-client-report-typing-batch28.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply client and monthly report typing remediation
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('app/dashboard/clients/page.tsx'); s=p.read_text()
          marker='import Link from "next/link";\n'
          typed='import Link from "next/link";\ntype SessionUser={role?:Role|string;id?:string;workspaceId?:string};\n'
          if marker not in s: raise SystemExit('clients import marker missing')
          s=s.replace(marker,typed,1)
          old='async function archiveClient(fd:FormData){"use server";const session=await auth();if(!session?.user)throw new Error("Unauthorized");const role=(session.user as any).role as Role,userId=String((session.user as any).id),workspaceId=String((session.user as any).workspaceId||""),id=String(fd.get("id")||"");'
          new='async function archiveClient(fd:FormData){"use server";const session=await auth();if(!session?.user)throw new Error("Unauthorized");const sessionUser=session.user as unknown as SessionUser,role=sessionUser.role as Role,userId=String(sessionUser.id||""),workspaceId=String(sessionUser.workspaceId||""),id=String(fd.get("id")||"");'
          if old not in s: raise SystemExit('clients archive session fragment missing')
          s=s.replace(old,new,1)
          old='await db.insert(auditLogs).values({workspaceId,userId,action:"client_archived",entity:"clients",entityId:id,newValues:JSON.stringify({companyName:client.companyName})} as any);'
          new='await db.insert(auditLogs).values({workspaceId,userId,action:"client_archived",entity:"clients",entityId:id,newValues:JSON.stringify({companyName:client.companyName})});'
          if old not in s: raise SystemExit('clients audit fragment missing')
          s=s.replace(old,new,1)
          old='const role = (session.user as any).role as Role,userId = String((session.user as any).id),workspaceId=String((session.user as any).workspaceId||"");'
          new='const sessionUser=session.user as unknown as SessionUser,role=sessionUser.role as Role,userId=String(sessionUser.id||""),workspaceId=String(sessionUser.workspaceId||"");'
          if old not in s: raise SystemExit('clients page session fragment missing')
          s=s.replace(old,new,1)
          if ':any' in s or ' as any' in s:
              raise SystemExit('explicit any remains in clients page')
          p.write_text(s)

          p=Path('app/dashboard/monthly-reports/page.tsx'); s=p.read_text()
          marker='import { Role } from "@/lib/types";\n'
          typed='import { Role } from "@/lib/types";\ntype SessionUser={role?:Role|string;id?:string};\n'
          if marker not in s: raise SystemExit('monthly Role import marker missing')
          s=s.replace(marker,typed,1)
          old='const role = (session.user as any).role as Role;'
          new='const sessionUser=session.user as unknown as SessionUser;\n  const role=sessionUser.role as Role;'
          if old not in s: raise SystemExit('monthly page role fragment missing')
          s=s.replace(old,new,1)
          old='const userId = String((session.user as any).id || "");'
          new='const userId=String(sessionUser.id||"");'
          if old not in s: raise SystemExit('monthly page user fragment missing')
          s=s.replace(old,new,1)
          s=s.replace('  const prevMonth = now.getMonth() === 0 ? 12 : now.getMonth();\n','',1)
          s=s.replace('  const prevYear  = now.getMonth() === 0 ? now.getFullYear()-1 : now.getFullYear();\n','',1)
          old='const currentRole=(current?.user as any)?.role as Role|undefined;'
          new='const currentUser=current?.user as unknown as SessionUser|undefined;\n    const currentRole=currentUser?.role as Role|undefined;'
          if old not in s: raise SystemExit('monthly send role fragment missing')
          s=s.replace(old,new,1)
          old='const currentUserId=String((current.user as any).id||"");'
          new='const currentUserId=String(currentUser?.id||"");'
          if old not in s: raise SystemExit('monthly send user fragment missing')
          s=s.replace(old,new,1)
          if '    let sent=0;\n' not in s: raise SystemExit('monthly sent counter missing')
          s=s.replace('    let sent=0;\n','',1)
          s=s.replace('        sent++;\n','',1)
          old='const currentRole=(current?.user as any)?.role as Role|undefined;'
          new='const currentUser=current?.user as unknown as SessionUser|undefined;\n            const currentRole=currentUser?.role as Role|undefined;'
          if old not in s: raise SystemExit('monthly campaign role fragment missing')
          s=s.replace(old,new,1)
          if ':any' in s or ' as any' in s:
              raise SystemExit('explicit any remains in monthly reports page')
          p.write_text(s)
          PY
      - name: TypeScript acceptance
        run: npx tsc --noEmit
      - name: Targeted ESLint acceptance
        run: npx eslint app/dashboard/clients/page.tsx app/dashboard/monthly-reports/page.tsx --max-warnings=0
      - name: Commit validated remediation
        run: |
          git config user.name 'vivitgroup'
          git config user.email 'groupvivit@gmail.com'
          git add app/dashboard/clients/page.tsx app/dashboard/monthly-reports/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(types): harden client and monthly report boundaries'
          git push origin HEAD:feat/vivito-internal-100
