name: CTO Targeted DB Client Typing Batch 21

on:
  push:
    branches: [feat/vivito-internal-100]
    paths:
      - '.github/workflows/cto-targeted-db-client-typing-batch21.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove DB client type shields
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/db.ts'); s=p.read_text()
          old='return postgres(connection as any, {\n    ssl,'
          new='return postgres(databaseUrl, {\n    host: connection.host,\n    port: connection.port,\n    database: connection.database,\n    username: connection.username,\n    password: connection.password,\n    ssl,'
          if old not in s: raise SystemExit('missing postgres client call')
          s=s.replace(old,new,1)
          old2='connection:      { application_name: "vivit-erp", statement_timeout: "8000" } as any,'
          new2='connection:      { application_name: "vivit-erp", statement_timeout: "8000" },'
          if old2 not in s: raise SystemExit('missing postgres connection options')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: TypeScript acceptance
        run: npx tsc --noEmit
      - name: Targeted ESLint acceptance
        run: npx eslint lib/db.ts --max-warnings=0
      - name: Commit validated remediation
        run: |
          git config user.name 'vivitgroup'
          git config user.email 'groupvivit@gmail.com'
          git add lib/db.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(types): remove db client type shields'
          git push origin HEAD:feat/vivito-internal-100
