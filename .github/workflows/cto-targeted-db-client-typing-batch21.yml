name: CTO Targeted DB Client Typing Batch 21

on:
  push:
    branches: [feat/vivito-internal-100]
    paths:
      - '.github/workflows/cto-targeted-db-client-typing-batch21.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove DB client type shields
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/db.ts'); s=p.read_text()
          replacements=[
            ('return postgres(connection as any, {', 'return postgres(connection, {'),
            ('connection:      { application_name: "vivit-erp", statement_timeout: "8000" } as any,', 'connection:      { application_name: "vivit-erp", statement_timeout: "8000" },'),
          ]
          for old,new in replacements:
              if old not in s: raise SystemExit(f'missing expected fragment: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: TypeScript acceptance
        run: npx tsc --noEmit
      - name: Targeted ESLint acceptance
        run: npx eslint lib/db.ts --max-warnings=0
      - name: Commit validated remediation
        run: |
          git config user.name 'vivitgroup'
          git config user.email 'groupvivit@gmail.com'
          git add lib/db.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(types): remove db client type shields'
          git push origin HEAD:feat/vivito-internal-100
