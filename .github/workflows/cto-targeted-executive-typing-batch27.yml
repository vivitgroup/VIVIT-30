name: CTO Targeted Executive Dashboard Typing Batch 27

on:
  push:
    branches: [feat/vivito-internal-100]
    paths:
      - '.github/workflows/cto-targeted-executive-typing-batch27.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply executive dashboard typing remediation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/executive/page.tsx'); s=p.read_text()
          marker='import Link from "next/link";\n'
          typed='''import Link from "next/link";\ntype SessionUser={role?:string;workspaceId?:string};\ntype ClientRow={id:string;company_name:string};\ntype TaskRow={id:string;title:string;status:string;deadline:string|number|Date;revision_count:unknown;company_name:string};\ntype MediaRow={company_name:string;id:string;name:string;reported_result_label:string|null;archived_at:unknown;spend:unknown;results:unknown;atc:unknown;purchases:unknown;revenue:unknown};\ntype BillingRow={company_name:string;outstanding:unknown;status:string|null};\nconst rows=<T extends Record<string,unknown>>(value:unknown)=>Array.from(value as Iterable<T>);\n'''
          if marker not in s: raise SystemExit('import marker missing')
          s=s.replace(marker,typed,1)
          old='const n=(v:any)=>Number(v||0),money=(v:any)=>`${Math.round(n(v)).toLocaleString("en-EG")} EGP`;'
          new='const n=(v:unknown)=>Number(v||0),money=(v:unknown)=>`${Math.round(n(v)).toLocaleString("en-EG")} EGP`;'
          if old not in s: raise SystemExit('numeric helpers missing')
          s=s.replace(old,new,1)
          old='export default async function ExecutivePage(){const s=await auth();if(!s?.user)redirect("/login");const workspaceId=String((s.user as any).workspaceId||"");if(!workspaceId)redirect("/login");if(String((s.user as any).role)!=="SUPER_ADMIN")redirect("/dashboard");const clients:any[]=Array.from(await db.execute(sql`select id,company_name from clients where workspace_id=${workspaceId} and is_active=true order by company_name`)),ids=clients.map(x=>String(x.id));const tasks:any[]=Array.from(await db.execute(sql`select t.id,t.title,t.status,t.deadline,t.revision_count,c.company_name from creative_tasks t join clients c on c.id=t.client_id where t.workspace_id=${workspaceId} and c.workspace_id=${workspaceId} and c.is_active=true and t.archived_at is null and t.deleted_at is null and t.status not in (\'COMPLETED\',\'REJECTED\') order by t.deadline asc limit 200`));let media:any[]=[],billing:any[]=[];'
          new='export default async function ExecutivePage(){const s=await auth();if(!s?.user)redirect("/login");const sessionUser=s.user as unknown as SessionUser,workspaceId=String(sessionUser.workspaceId||"");if(!workspaceId)redirect("/login");if(String(sessionUser.role)!=="SUPER_ADMIN")redirect("/dashboard");const [clock]=rows<{now_ms:number|string}>(await db.execute(sql`select (extract(epoch from now())*1000)::bigint now_ms`)),nowMs=n(clock?.now_ms),clients=rows<ClientRow>(await db.execute(sql`select id,company_name from clients where workspace_id=${workspaceId} and is_active=true order by company_name`)),ids=clients.map(x=>String(x.id));const tasks=rows<TaskRow>(await db.execute(sql`select t.id,t.title,t.status,t.deadline,t.revision_count,c.company_name from creative_tasks t join clients c on c.id=t.client_id where t.workspace_id=${workspaceId} and c.workspace_id=${workspaceId} and c.is_active=true and t.archived_at is null and t.deleted_at is null and t.status not in (\'COMPLETED\',\'REJECTED\') order by t.deadline asc limit 200`));let media:MediaRow[]=[],billing:BillingRow[]=[];'
          if old not in s: raise SystemExit('page data/session fragment missing')
          s=s.replace(old,new,1)
          s=s.replace('media=Array.from(await db.execute(', 'media=rows<MediaRow>(await db.execute(',1)
          s=s.replace('billing=Array.from(await db.execute(', 'billing=rows<BillingRow>(await db.execute(',1)
          if 'Date.now()' not in s: raise SystemExit('expected Date.now missing')
          s=s.replace('Date.now()','nowMs')
          if ':any' in s or ' as any' in s:
              raise SystemExit('explicit any remains in executive dashboard')
          p.write_text(s)
          PY
      - name: TypeScript acceptance
        run: npx tsc --noEmit
      - name: Targeted ESLint acceptance
        run: npx eslint app/dashboard/executive/page.tsx --max-warnings=0
      - name: Commit validated remediation
        run: |
          git config user.name 'vivitgroup'
          git config user.email 'groupvivit@gmail.com'
          git add app/dashboard/executive/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(types): harden executive dashboard data boundaries'
          git push origin HEAD:feat/vivito-internal-100
