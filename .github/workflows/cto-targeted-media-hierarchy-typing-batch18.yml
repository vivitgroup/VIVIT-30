name: CTO Targeted Media Hierarchy Typing Batch 18

on:
  push:
    branches: [feat/vivito-internal-100]
    paths:
      - '.github/workflows/cto-targeted-media-hierarchy-typing-batch18.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply media hierarchy typing remediation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/api/media-hierarchy/[campaignId]/route.ts'); s=p.read_text()
          reps=[
            ('db,clients,adCampaigns,adPlatformConnections,adPerformanceDaily,sql', 'db,clients,adCampaigns,adPlatformConnections,sql'),
            ('const ROLES=["SUPER_ADMIN","MEDIA_BUYER","ACCOUNT_MANAGER"],DATE=/^\\d{4}-\\d{2}-\\d{2}$/,n=(v:any)=>Number(v||0);', 'type JsonRecord=Record<string,unknown>;\nconst asRecord=(value:unknown):JsonRecord=>value&&typeof value==="object"&&!Array.isArray(value)?value as JsonRecord:{};\nconst asArray=(value:unknown):unknown[]=>Array.isArray(value)?value:[];\nconst errorMessage=(error:unknown,fallback:string)=>error instanceof Error?error.message:fallback;\nconst ROLES=["SUPER_ADMIN","MEDIA_BUYER","ACCOUNT_MANAGER"],DATE=/^\\d{4}-\\d{2}-\\d{2}$/,n=(v:unknown)=>Number(v||0);'),
            ('async function pages(url:string,maxPages=250){let next=url,rows:any[]=[];for(let i=0;next&&i<maxPages;i++){const r=await fetch(next,{cache:"no-store"}),d=await r.json().catch(()=>({}));if(!r.ok||d?.error)throw new Error(d?.error?.message||`Meta API error ${r.status}`);rows.push(...(d.data||[]));next=String(d?.paging?.next||"");}if(next)throw new Error("Meta hierarchy exceeded the safe pagination limit");return rows;}', 'async function pages(url:string,maxPages=250):Promise<JsonRecord[]>{let next=url;const rows:JsonRecord[]=[];for(let i=0;next&&i<maxPages;i++){const r=await fetch(next,{cache:"no-store"}),d=asRecord(await r.json().catch(()=>({}))),apiError=asRecord(d.error);if(!r.ok||d.error)throw new Error(String(apiError.message||`Meta API error ${r.status}`));rows.push(...asArray(d.data).map(asRecord));next=String(asRecord(d.paging).next||"");}if(next)throw new Error("Meta hierarchy exceeded the safe pagination limit");return rows;}'),
            ('const action=(row:any,type:string)=>n(row?.actions?.find((a:any)=>a.action_type===type)?.value),value=(row:any,type:string)=>n(row?.action_values?.find((a:any)=>a.action_type===type)?.value);', 'const metricValue=(row:JsonRecord,key:string,type:string)=>n(asArray(row[key]).map(asRecord).find(item=>item.action_type===type)?.value),action=(row:JsonRecord,type:string)=>metricValue(row,"actions",type),value=(row:JsonRecord,type:string)=>metricValue(row,"action_values",type);'),
            ('function metric(row:any,resultType?:string)', 'function metric(row:JsonRecord,resultType?:string)'),
            ('const role=String((session.user as any).role),userId=String((session.user as any).id);', 'const sessionUser=session.user as unknown as Record<string,unknown>,role=String(sessionUser.role||""),userId=String(sessionUser.id||"");'),
            ('catch(e:any){return NextResponse.json({error:String(e.message||"Reconnect Meta.")},{status:409})}', 'catch(error:unknown){return NextResponse.json({error:errorMessage(error,"Reconnect Meta.")},{status:409})}'),
            ('[setRows,adRows]=await Promise.all([pages(`${base}/adsets?fields=id,name,status,daily_budget,lifetime_budget,optimization_goal&limit=500&${auth}`),pages(`${base}/ads?fields=id,name,status,adset_id&limit=500&${auth}`)]),setMap:any={},adMap:any={};', '[setRows,adRows]=await Promise.all([pages(`${base}/adsets?fields=id,name,status,daily_budget,lifetime_budget,optimization_goal&limit=500&${auth}`),pages(`${base}/ads?fields=id,name,status,adset_id&limit=500&${auth}`)]),setMap:Record<string,string|undefined>={},adMap:Record<string,string|undefined>={};'),
            ('as any[];setMap[String(s.id)]=row?.id', 'as Array<{id?:string;external_id?:string}>;setMap[String(s.id)]=row?.id'),
            ('as any[];adMap[String(a.id)]=row?.id', 'as Array<{id?:string;external_id?:string}>;adMap[String(a.id)]=row?.id'),
            ('as any[],resultType=reported[0]?.reported_result_type||"",', 'as Array<{reported_result_type?:string|null}>,resultType=reported[0]?.reported_result_type||"",'),
            ('catch(e:any){return NextResponse.json({error:String(e.message||"Meta hierarchy sync failed").slice(0,700)},{status:502})}', 'catch(error:unknown){return NextResponse.json({error:errorMessage(error,"Meta hierarchy sync failed").slice(0,700)},{status:502})}'),
          ]
          for old,new in reps:
              if old not in s: raise SystemExit(f'missing expected fragment: {old[:180]}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: TypeScript acceptance
        run: npx tsc --noEmit
      - name: Targeted ESLint acceptance
        run: npx eslint 'app/api/media-hierarchy/[campaignId]/route.ts' --max-warnings=0
      - name: Commit validated remediation
        run: |
          git config user.name 'vivitgroup'
          git config user.email 'groupvivit@gmail.com'
          git add 'app/api/media-hierarchy/[campaignId]/route.ts'
          git diff --cached --quiet && exit 0
          git commit -m 'fix(types): harden media hierarchy boundaries'
          git push origin HEAD:feat/vivito-internal-100
