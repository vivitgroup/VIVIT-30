name: CTO Compile-Safe Unknown Occurrence Sweep

on:
  push:
    branches: [feat/vivito-internal-100]
    paths:
      - '.github/workflows/cto-unknown-occurrence-sweep.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture explicit-any suggestions
        shell: bash
        run: npx eslint . -f json > /tmp/eslint-before.json || true

      - name: Accept unknown substitutions occurrence by occurrence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const {spawnSync}=require('node:child_process');
          const path=require('node:path');

          const rows=JSON.parse(fs.readFileSync('/tmp/eslint-before.json','utf8'));
          const groups=new Map();
          for(const row of rows){
            const rel=path.relative(process.cwd(),row.filePath).replaceAll('\\','/');
            if(rel.startsWith('..')) continue;
            const ranges=[];
            for(const msg of row.messages||[]){
              if(msg.ruleId!=='@typescript-eslint/no-explicit-any') continue;
              const suggestion=(msg.suggestions||[]).find(s=>s?.fix?.text==='unknown'&&Array.isArray(s?.fix?.range));
              if(suggestion) ranges.push(suggestion.fix.range);
            }
            if(ranges.length){
              const unique=[...new Map(ranges.map(r=>[`${r[0]}:${r[1]}`,r])).values()]
                .sort((a,b)=>b[0]-a[0]);
              groups.set(rel,unique);
            }
          }

          const typecheck=()=>spawnSync('npx',['tsc','--noEmit','--pretty','false'],{
            encoding:'utf8',stdio:['ignore','pipe','pipe']
          });
          const apply=(text,[start,end])=>{
            if(text.slice(start,end)!=='any') throw new Error(`unexpected range ${start}:${end} -> ${JSON.stringify(text.slice(start,end))}`);
            return text.slice(0,start)+'unknown'+text.slice(end);
          };
          const applyAll=(text,ranges)=>{
            let out=text;
            for(const range of ranges) out=apply(out,range);
            return out;
          };

          let accepted=0,rejected=0,wholeFiles=0,partialFiles=0;
          console.log(`candidate_files=${groups.size}`);
          console.log(`candidate_occurrences=${[...groups.values()].reduce((n,r)=>n+r.length,0)}`);

          for(const [file,ranges] of groups){
            const original=fs.readFileSync(file,'utf8');
            fs.writeFileSync(file,applyAll(original,ranges));
            let result=typecheck();
            if(result.status===0){
              accepted+=ranges.length;
              wholeFiles++;
              console.log(`accept_file ${file} occurrences=${ranges.length}`);
              continue;
            }

            fs.writeFileSync(file,original);
            let fileAccepted=0;
            for(const range of ranges){
              const before=fs.readFileSync(file,'utf8');
              let after;
              try{ after=apply(before,range); }
              catch(error){
                console.log(`range_shift_reject ${file} ${range[0]}:${range[1]} ${String(error)}`);
                rejected++;
                continue;
              }
              fs.writeFileSync(file,after);
              result=typecheck();
              if(result.status===0){
                accepted++;
                fileAccepted++;
              }else{
                fs.writeFileSync(file,before);
                rejected++;
              }
            }
            if(fileAccepted) partialFiles++;
            console.log(`partial_file ${file} accepted=${fileAccepted} rejected=${ranges.length-fileAccepted}`);
          }

          const final=typecheck();
          if(final.status!==0){
            console.error(final.stdout);
            console.error(final.stderr);
            process.exit(final.status||1);
          }
          console.log(`accepted_occurrences=${accepted}`);
          console.log(`rejected_occurrences=${rejected}`);
          console.log(`whole_files=${wholeFiles}`);
          console.log(`partial_files=${partialFiles}`);
          NODE

      - name: Final TypeScript acceptance
        run: npm run type-check

      - name: Diff safety
        run: git diff --check

      - name: Repository static invariant acceptance
        run: node scripts/qa-cto-static-audit.mjs

      - name: Report remaining lint debt
        shell: bash
        run: |
          npx eslint . -f json > /tmp/eslint-after.json || true
          node <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/eslint-after.json','utf8'));
          const messages=rows.flatMap(r=>r.messages||[]);
          const counts={};
          for(const m of messages) counts[m.ruleId||'(parser)']=(counts[m.ruleId||'(parser)']||0)+1;
          console.log(`remaining_total=${messages.length}`);
          console.log(`remaining_errors=${messages.filter(m=>m.severity===2).length}`);
          console.log(`remaining_warnings=${messages.filter(m=>m.severity===1).length}`);
          console.log(`remaining_explicit_any=${messages.filter(m=>m.ruleId==='@typescript-eslint/no-explicit-any').length}`);
          console.log('top_rules='+JSON.stringify(Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,20)));
          NODE

      - name: Commit verified type improvements
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'VIVIT CTO Gate Bot'
          git config user.email 'groupvivit@gmail.com'
          git add app components lib scripts types proxy.ts auth.config.ts 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'fix(types): narrow compiler-safe any occurrences'
          git push origin HEAD:feat/vivito-internal-100

      - name: Dispatch release gates on updated branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run cto-pre-release-audit.yml --ref feat/vivito-internal-100
          gh workflow run cto-static-audit.yml --ref feat/vivito-internal-100
          gh workflow run vivito-internal-100.yml --ref feat/vivito-internal-100
