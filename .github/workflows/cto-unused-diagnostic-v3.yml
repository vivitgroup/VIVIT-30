name: CTO Unused Diagnostic V3

on:
  push:
    branches: [feat/vivito-static-unused-diagnostic-v3]
    paths:
      - '.github/workflows/cto-unused-diagnostic-v3.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-static-unused-diagnostic-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print unused findings with source lines
        shell: bash
        run: |
          npx eslint . -f json > /tmp/eslint.json || true
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const rows=JSON.parse(fs.readFileSync('/tmp/eslint.json','utf8'));
          const wanted=new Set(['@typescript-eslint/no-unused-vars','@typescript-eslint/no-unused-expressions']);
          let total=0;
          for(const row of rows){const rel=path.relative(process.cwd(),row.filePath).replaceAll('\\','/');const lines=fs.readFileSync(row.filePath,'utf8').split(/\r?\n/);for(const m of row.messages||[]){if(!wanted.has(m.ruleId))continue;total++;const line=m.line||0;console.log(`FINDING\t${rel}:${line}:${m.column||0}\t${m.ruleId}\t${m.message}`);console.log(`SOURCE\t${lines[line-1]||''}`)}}
          console.log(`wanted_total=${total}`);
          NODE
