name: CTO Workspace Hardening
on:
  push:
    branches: [feat/vivito-internal-100]
    paths:
      - '.github/workflows/cto-workspace-hardening.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply scoped patch
        run: node scripts/cto-workspace-hardening.mjs
      - name: Verify no fixed tenant scope remains
        run: |
          ! grep -n 'const W="default"' app/api/assistant/route.ts
          ! grep -n 'const WORKSPACE="default"' app/dashboard/portal/page.tsx
          ! grep -n 'eq(clients.workspaceId,"default")' app/api/media-control-v2/route.ts
      - name: Commit hardening
        run: |
          if git diff --quiet; then echo 'No changes to commit'; exit 0; fi
          git config user.name 'vivitgroup'
          git config user.email 'groupvivit@gmail.com'
          git add app/api/assistant/route.ts app/api/media-control-v2/route.ts app/dashboard/portal/page.tsx
          git commit -m 'fix(cto): enforce request-scoped workspace across portal media and VIVITO'
          git push origin HEAD:feat/vivito-internal-100
