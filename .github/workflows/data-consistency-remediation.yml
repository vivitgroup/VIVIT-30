name: Campaign Data Consistency Remediation
on:
  push:
    branches: [feat/vivito-internal-100]
    paths:
      - scripts/apply-campaign-data-consistency-v2.mjs
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/apply-campaign-data-consistency-v2.mjs
      - run: node scripts/qa-campaign-data-consistency.mjs
      - name: Commit remediation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name vivitgroup
          git config user.email groupvivit@gmail.com
          git add app lib scripts package.json
          git commit -m "fix(data): unify campaign KPI sources across reports and Vivito"
          git push origin HEAD:feat/vivito-internal-100
