name: Campaign Data Consistency Remediation
on:
  push:
    branches: [feat/vivito-internal-100]
    paths:
      - scripts/apply-campaign-data-consistency.mjs
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/apply-campaign-data-consistency.mjs
      - run: node scripts/qa-campaign-data-consistency.mjs
      - name: Commit remediation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name vivitgroup
          git config user.email groupvivit@gmail.com
          git add app/dashboard/page.tsx app/dashboard/clients/'[id]'/page.tsx app/dashboard/portal/page.tsx package.json scripts/qa-campaign-data-consistency.mjs
          git commit -m "fix(data): unify campaign metrics and date ranges"
          git push origin HEAD:feat/vivito-internal-100
