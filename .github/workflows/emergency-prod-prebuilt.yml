name: Emergency Prebuilt Production Deploy

on:
  push:
    branches:
      - test/vgroup-central-real-action
    paths:
      - .github/workflows/emergency-prod-prebuilt.yml

permissions:
  contents: read

jobs:
  deploy-certified-main:
    runs-on: ubuntu-24.04
    env:
      VERCEL_ORG_ID: team_7bnFfb65k7YtwywgLu2vtN1R
      VERCEL_PROJECT_ID: prj_Tgvk58HLEYlXHepCoUfNEUKfMqig
    steps:
      - name: Checkout certified main commit
        uses: actions/checkout@v4
        with:
          ref: 63199527edc04f09d556ce3b658a93d00dcce2be

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build production artifact locally on GitHub runner
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt artifact to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
