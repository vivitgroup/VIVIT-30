name: Integrations Security

on:
  push:
    branches:
      - main
    paths:
      - 'lib/ad-oauth.ts'
      - 'app/api/ad-oauth/**'
      - 'app/api/whatsapp-templates/**'
      - 'scripts/qa-integrations-security.mjs'
      - '.github/workflows/integrations-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrations-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: OAuth and WhatsApp security contract
        run: node scripts/qa-integrations-security.mjs
      - name: TypeScript
        run: npm run type-check
