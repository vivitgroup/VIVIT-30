name: Live E2E Canonical Metrics Patch

on:
  push:
    branches:
      - fix/live-e2e-17-20260902

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-e2e-17-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch dashboard and KPI canonical sources
        shell: python
        run: |
          from pathlib import Path
          def rep(path, old, new, expected=1):
              p=Path(path); text=p.read_text(); count=text.count(old)
              assert count==expected, f"{path}: expected {expected}, found {count}"
              p.write_text(text.replace(old,new))

          dash="app/dashboard/page.tsx"
          rep(dash,
              '''import { db, clients, financeRecords, creativeTasks, salesLeads,\n  mediaMetrics, companyExpenses, notifications,\n  agencyHealthScores, payrollLocks } from "@/lib/db";''',
              '''import { db, clients, financeRecords, creativeTasks, salesLeads,\n  mediaMetrics, companyExpenses, notifications,\n  agencyHealthScores, payrollLocks, sql } from "@/lib/db";''')
          rep(dash,
              '''db.select({ spend:sum(mediaMetrics.adSpend), leads:sum(mediaMetrics.leads), revenue:sum(mediaMetrics.revenue) })\n      .from(mediaMetrics).where(and(eq(mediaMetrics.workspaceId,workspaceId),gte(mediaMetrics.date,moStart))),''',
              '''db.execute<{spend:number|string|null;leads:number|string|null;revenue:number|string|null}>(sql`select coalesce(sum(p.spend),0) spend,coalesce(sum(p.results),0) leads,coalesce(sum(p.revenue),0) revenue from ad_performance_daily p join ad_campaigns a on a.id=p.campaign_id where a.workspace_id=${workspaceId} and a.archived_at is null and p.date>=date_trunc('month',now()) and p.breakdown_type='TOTAL' and p.ad_set_id is null and p.ad_id is null`),''')
          rep(dash,
              '''db.select({cnt:count()}).from(creativeTasks).where(and(eq(creativeTasks.workspaceId,workspaceId),lt(creativeTasks.deadline,today),notInArray(creativeTasks.status,["COMPLETED","REJECTED","APPROVED"]))),''',
              '''db.select({cnt:count()}).from(creativeTasks).where(and(eq(creativeTasks.workspaceId,workspaceId),lt(creativeTasks.deadline,today),notInArray(creativeTasks.status,["COMPLETED","REJECTED"]),sql`${creativeTasks.id} in (select id from creative_tasks where workspace_id=${workspaceId} and archived_at is null and deleted_at is null)`)),''')
          rep(dash,
              '''const healthScore   = Math.round(health?.overallScore??0);''',
              '''const clientHealthValues=allClients.map(c=>Number(c.healthScore??0)).filter(v=>Number.isFinite(v)),healthScore=clientHealthValues.length?Math.round(clientHealthValues.reduce((a,b)=>a+b,0)/clientHealthValues.length):0;''')

          kpi="app/dashboard/kpis/page.tsx"
          rep(kpi,
              '''db.select({n:count()}).from(clients).where(and(eq(clients.workspaceId,workspaceId),eq(clients.isActive,true))),''',
              '''db.execute<{n:number|string;health:number|string|null}>(sql`select count(*)::int n,coalesce(avg(health_score),0) health from clients where workspace_id=${workspaceId} and is_active=true`),''')
          rep(kpi,
              '''db.select({spend:sum(mediaMetrics.adSpend),revenue:sum(mediaMetrics.revenue),leads:sum(mediaMetrics.leads)}).from(mediaMetrics).where(and(eq(mediaMetrics.workspaceId,workspaceId),gte(mediaMetrics.date,monthStart))),''',
              '''db.execute<{spend:number|string|null;revenue:number|string|null;leads:number|string|null}>(sql`select coalesce(sum(p.spend),0) spend,coalesce(sum(p.revenue),0) revenue,coalesce(sum(p.results),0) leads from ad_performance_daily p join ad_campaigns a on a.id=p.campaign_id where a.workspace_id=${workspaceId} and a.archived_at is null and p.date>=date_trunc('month',now()) and p.breakdown_type='TOTAL' and p.ad_set_id is null and p.ad_id is null`),''')
          old='''available=[total>0?Math.min(collection,100):null,creativeTotal>0?Math.min(completion,100):null,wonN+lostN>0?Math.min(win,100):null].filter((x):x is number=>x!==null),health=available.length?Math.round(available.reduce((a,b)=>a+b,0)/available.length):0,metrics=[{l:"Agency Health",v:available.length?`${health}%`:"—",s:"Average of available live KPI dimensions"}'''
          new='''available=[total>0?Math.min(collection,100):null,creativeTotal>0?Math.min(completion,100):null,wonN+lostN>0?Math.min(win,100):null].filter((x):x is number=>x!==null),health=Math.round(Number(clientsN[0]?.health||0)),metrics=[{l:"Agency Health",v:Number(clientsN[0]?.n||0)?`${health}%`:"—",s:"Average health score of active clients"}'''
          rep(kpi,old,new)
          rep(kpi,
              '''<b style={{fontSize:48,color:available.length?(health>=75?"var(--green)":health>=50?"var(--amber)":"var(--red)"):"var(--text-muted)"}}>{available.length?`${health}%`:"—"}</b>''',
              '''<b style={{fontSize:48,color:Number(clientsN[0]?.n||0)?(health>=75?"var(--green)":health>=50?"var(--amber)":"var(--red)"):"var(--text-muted)"}}>{Number(clientsN[0]?.n||0)?`${health}%`:"—"}</b>''')
          rep(kpi,
              '''<p className="page-subtitle">Live workspace scorecard. Agency Health averages only KPI dimensions with real source data.</p>''',
              '''<p className="page-subtitle">Live workspace scorecard. Agency Health is the average health score of active clients; operating KPIs remain visible as separate dimensions.</p>''')
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Commit canonical patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/page.tsx app/dashboard/kpis/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "[canonical-auto] fix media health and overdue source of truth"
          git push origin HEAD:fix/live-e2e-17-20260902
