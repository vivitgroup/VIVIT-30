name: Notifications and Email Audit

on:
  push:
    branches:
      - audit/finance-deep-2026-09-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notifications-email-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Notifications and email contracts
        run: node scripts/qa-notifications-email.mjs

      - name: TypeScript
        run: npm run type-check
