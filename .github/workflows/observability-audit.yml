name: Observability Audit

on:
  push:
    branches:
      - audit/finance-deep-2026-09-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observability-audit:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/vivit_build
      NEXTAUTH_SECRET: exact-head-ci-observability-secret-not-for-production
      AUTH_SECRET: exact-head-ci-observability-secret-not-for-production
      NEXTAUTH_URL: http://127.0.0.1:3000
      AUTH_URL: http://127.0.0.1:3000
      CRON_SECRET: exact-head-ci-cron-secret-not-for-production
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Observability source contracts
        run: node scripts/qa-observability.mjs
      - name: TypeScript
        run: npm run type-check
      - name: Exact-head production build
        run: npx next build
