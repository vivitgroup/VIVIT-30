name: One-shot Next Security Patch

on:
  push:
    paths:
      - '.github/workflows/one-shot-next-security-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot Next.js security patch job'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate exact dependency lock
        run: npm install --package-lock-only --save-exact next@16.3.3 eslint-config-next@16.3.3
      - name: Verify patched versions
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies.next!=='16.3.3'||p.devDependencies['eslint-config-next']!=='16.3.3') process.exit(1)"
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/next'].version!=='16.3.3'||p.packages['node_modules/eslint-config-next'].version!=='16.3.3') process.exit(1)"
      - name: Commit security patch
        run: |
          git config user.name 'vivitgroup'
          git config user.email 'groupvivit@gmail.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Patch Next.js critical advisories to 16.3.3'
          git push origin HEAD:main
