name: PR103 Authenticated Runtime Regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr103-runtime-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  pr103-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vivito
          POSTGRES_PASSWORD: vivito
          POSTGRES_DB: vivito_pr103
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vivito -d vivito_pr103"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vivito:vivito@127.0.0.1:5432/vivito_pr103
      DRIZZLE_DATABASE_URL: postgresql://vivito:vivito@127.0.0.1:5432/vivito_pr103
      VGROUP_DATABASE_URL: postgresql://vivito:vivito@127.0.0.1:5432/vivito_pr103_vgroup
      DATABASE_SSL_DISABLED: "1"
      VGROUP_DATABASE_SSL_DISABLED: "1"
      AUTH_SECRET: pr103-runtime-secret-not-for-production
      NEXTAUTH_SECRET: pr103-runtime-secret-not-for-production
      NEXTAUTH_URL: http://127.0.0.1:3000
      AUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build isolated databases
        run: |
          npx drizzle-kit push --force
          PGPASSWORD=vivito psql -h 127.0.0.1 -U vivito -d postgres -v ON_ERROR_STOP=1 -c "create database vivito_pr103_vgroup"
          DRIZZLE_DATABASE_URL="$VGROUP_DATABASE_URL" DATABASE_URL="$VGROUP_DATABASE_URL" npx drizzle-kit push --force
          node scripts/qa-bootstrap-vgroup-tech.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start ephemeral Supabase Auth
        run: |
          supabase init
          supabase start
          supabase status -o env > /tmp/pr103-supabase.env
          set -a; source /tmp/pr103-supabase.env; set +a
          AUTH_PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          test -n "${API_URL:-}" && test -n "$AUTH_PUBLIC_KEY" && test -n "${SERVICE_ROLE_KEY:-}"
          {
            echo "VGROUP_SUPABASE_URL=$API_URL"
            echo "VGROUP_SUPABASE_PUBLISHABLE_KEY=$AUTH_PUBLIC_KEY"
            echo "VGROUP_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VGROUP_SUPABASE_SERVICE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Start isolated legacy Auth receiver
        run: |
          set -euo pipefail
          PGPASSWORD=vivito psql -h 127.0.0.1 -U vivito -d postgres -v ON_ERROR_STOP=1 -c "create database vivito_pr103_auth"
          PGPASSWORD=vivito psql -h 127.0.0.1 -U vivito -d vivito_pr103_auth -v ON_ERROR_STOP=1 <<'SQL'
          create role pr103_authenticator login password 'pr103-auth';
          create role pr103_service_role nologin;
          grant pr103_service_role to pr103_authenticator;
          create table public.workspaces (id text primary key,is_active boolean not null default true);
          create table public.users (id text primary key,name text not null,email text not null unique,password text,role text not null,workspace_id text not null,is_active boolean not null default true,approval_status text not null default 'APPROVED');
          grant usage on schema public to pr103_service_role;
          grant select,insert,update,delete on public.workspaces,public.users to pr103_service_role;
          SQL
          POSTGREST_IMAGE="$(docker ps --format '{{.Image}}' | grep -m1 -E 'postgrest|supabase/postgrest')"
          test -n "$POSTGREST_IMAGE"
          JWT_SECRET="$(openssl rand -hex 32)"
          SERVICE_KEY="$(JWT_SECRET="$JWT_SECRET" node - <<'NODE'
          const {createHmac}=require('node:crypto');
          const enc=v=>Buffer.from(JSON.stringify(v)).toString('base64url');
          const now=Math.floor(Date.now()/1000),h=enc({alg:'HS256',typ:'JWT'}),b=enc({role:'pr103_service_role',iat:now,exp:now+3600});
          process.stdout.write(`${h}.${b}.${createHmac('sha256',process.env.JWT_SECRET).update(`${h}.${b}`).digest('base64url')}`);
          NODE
          )"
          docker run -d --name pr103-postgrest -p 3001:3000 --add-host=host.docker.internal:host-gateway \
            -e PGRST_DB_URI="postgres://pr103_authenticator:pr103-auth@host.docker.internal:5432/vivito_pr103_auth" \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=pr103_service_role -e PGRST_JWT_SECRET="$JWT_SECRET" "$POSTGREST_IMAGE" >/tmp/pr103-postgrest.cid
          cat > /tmp/pr103-rest-proxy.cjs <<'NODE'
          const http=require('node:http');
          const server=http.createServer((req,res)=>{
            const prefix='/rest/v1';
            const upstreamPath=req.url.startsWith(prefix)?(req.url.slice(prefix.length)||'/'):req.url;
            const upstream=http.request({hostname:'127.0.0.1',port:3001,path:upstreamPath,method:req.method,headers:{...req.headers,host:'127.0.0.1:3001'}},response=>{res.writeHead(response.statusCode||502,response.headers);response.pipe(res)});
            upstream.on('error',error=>{res.statusCode=502;res.end(error.message)});req.pipe(upstream);
          });
          server.listen(3002,'127.0.0.1');
          NODE
          node /tmp/pr103-rest-proxy.cjs >/tmp/pr103-rest-proxy.log 2>&1 &
          echo $! > /tmp/pr103-rest-proxy.pid
          READY=0
          for i in {1..30}; do
            if curl -fsS -H "Authorization: Bearer $SERVICE_KEY" "http://127.0.0.1:3002/rest/v1/workspaces?select=id&limit=1" >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = "1"
          {
            echo "SUPABASE_URL=http://127.0.0.1:3002"
            echo "SUPABASE_SERVICE_KEY=$SERVICE_KEY"
          } >> "$GITHUB_ENV"
      - name: Build and start exact candidate
        run: |
          npm run build
          npm start > /tmp/pr103-next.log 2>&1 &
          echo $! > /tmp/pr103-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pr103-next.log
          exit 1
      - name: Run PR103 authenticated HTTP regressions
        id: regression
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import postgres from 'postgres';
          import bcrypt from 'bcryptjs';
          import {randomUUID} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const base='http://127.0.0.1:3000',psql=postgres(process.env.DATABASE_URL,{ssl:false,max:1,prepare:false}),gsql=postgres(process.env.VGROUP_DATABASE_URL,{ssl:false,max:1,prepare:false});
          const suffix=randomUUID().slice(0,8),assert=(v,m)=>{if(!v)throw new Error(m)},cookiesFrom=r=>(typeof r.headers.getSetCookie==='function'?r.headers.getSetCookie():[r.headers.get('set-cookie')].filter(Boolean)).map(v=>v.split(';',1)[0]),mergeCookies=(...sets)=>[...new Set(sets.flat().filter(Boolean))].join('; ');
          const phase=value=>writeFileSync('/tmp/pr103-phase',value);
          let extId='',gUser='',techClient='',projectId='',legacyUser=`qa-pr103-${suffix}`,workspace=`qa-pr103-ws-${suffix}`,clientId=`qa-pr103-client-${suffix}`,campaignA=`qa-pr103-campaign-a-${suffix}`,campaignB=`qa-pr103-campaign-b-${suffix}`;
          const legacyEmail=`qa-pr103-legacy-${suffix}@example.com`,legacyPassword=`Qa!${randomUUID()}A1`;
          try{
            phase('tech');
            const [bu]=await gsql`select id::text from vgroup.business_units where code='tech' and status='active' limit 1`;assert(bu?.id,'tech_bu_missing');
            let [role]=await gsql`select id::text from vgroup.roles where code='TECH_ADMIN' and business_unit_id=${bu.id}::uuid limit 1`;
            if(!role)[role]=await gsql`insert into vgroup.roles(code,business_unit_id,description,is_system) values('TECH_ADMIN',${bu.id}::uuid,'PR103 runtime',true) returning id::text`;
            for(const [module,action] of [['clients','view'],['clients','create'],['projects','view'],['projects','create'],['projects','update']]){let [perm]=await gsql`select id::text from vgroup.permissions where module=${module} and action=${action} and business_unit_id=${bu.id}::uuid limit 1`;if(!perm)[perm]=await gsql`insert into vgroup.permissions(module,action,business_unit_id) values(${module},${action},${bu.id}::uuid) returning id::text`;await gsql`insert into vgroup.role_permissions(role_id,permission_id) values(${role.id}::uuid,${perm.id}::uuid) on conflict do nothing`}
            const techEmail=`qa-pr103-tech-${suffix}@example.com`,techPassword=`Qa!${randomUUID()}A1`;
            let r=await fetch(`${process.env.VGROUP_SUPABASE_URL}/auth/v1/admin/users`,{method:'POST',headers:{apikey:process.env.VGROUP_SUPABASE_SERVICE_ROLE_KEY,Authorization:`Bearer ${process.env.VGROUP_SUPABASE_SERVICE_ROLE_KEY}`,'Content-Type':'application/json'},body:JSON.stringify({email:techEmail,password:techPassword,email_confirm:true})});let j=await r.json();assert(r.ok,'tech_auth_seed_failed');extId=j.id||j.user?.id;
            [j]=await gsql`insert into vgroup.users(external_auth_id,email,full_name,preferred_language,status) values(${extId},${techEmail},'PR103 Tech QA','en','active') returning id::text`;gUser=j.id;await gsql`insert into vgroup.user_business_unit_roles(user_id,business_unit_id,role_id,status) values(${gUser}::uuid,${bu.id}::uuid,${role.id}::uuid,'active')`;
            r=await fetch(`${base}/api/vgroup/auth/login`,{method:'POST',headers:{'Content-Type':'application/json','x-forwarded-for':'127.0.0.231'},body:JSON.stringify({email:techEmail,password:techPassword})});assert(r.status===200,`tech_login_${r.status}`);const techCookie=mergeCookies(cookiesFrom(r));
            r=await fetch(`${base}/api/vgroup/tech/clients`,{method:'POST',headers:{Cookie:techCookie,'Content-Type':'application/json'},body:JSON.stringify({companyName:`PR103 Tech Client ${suffix}`,contactName:'QA',email:`client-${suffix}@example.com`})});j=await r.json();assert(r.status===201,`tech_client_create_${r.status}_${JSON.stringify(j)}`);techClient=j.client?.id;assert(techClient,'tech_client_id_missing');
            r=await fetch(`${base}/api/vgroup/tech/clients`,{headers:{Cookie:techCookie}});j=await r.json();assert(r.status===200&&j.clients?.some(c=>c.id===techClient),'tech_client_listing_missing');
            r=await fetch(`${base}/api/vgroup/tech/projects`,{method:'POST',headers:{Cookie:techCookie,'Content-Type':'application/json'},body:JSON.stringify({clientId:techClient,name:`PR103 Project ${suffix}`,projectType:'website',currency:'EGP',basePrice:1000})});j=await r.json();assert(r.status===201,`tech_project_create_${r.status}_${JSON.stringify(j)}`);projectId=j.project?.id;const [project]=await gsql`select client_id::text from tech.projects where id=${projectId}::uuid`;assert(project?.client_id===techClient,'tech_project_client_mismatch');console.log('PASS PR103 Tech Create Client -> Project selection/persistence');
            phase('avatar');
            const hash=await bcrypt.hash(legacyPassword,10);await psql`insert into workspaces(id,name,slug,plan,is_active) values(${workspace},${`PR103 ${suffix}`},${`pr103-${suffix}`},'FREE',true)`;await psql`insert into users(id,workspace_id,name,email,password,role,is_active,approval_status,is_workspace_owner) values(${legacyUser},${workspace},'PR103 Super Admin',${legacyEmail},${hash},'SUPER_ADMIN',true,'APPROVED',true)`;
            const ah={apikey:process.env.SUPABASE_SERVICE_KEY,Authorization:`Bearer ${process.env.SUPABASE_SERVICE_KEY}`,'Content-Type':'application/json',Prefer:'return=minimal'};r=await fetch(`${process.env.SUPABASE_URL}/rest/v1/workspaces`,{method:'POST',headers:ah,body:JSON.stringify({id:workspace,is_active:true})});assert(r.status===201,`legacy_workspace_seed_${r.status}`);r=await fetch(`${process.env.SUPABASE_URL}/rest/v1/users`,{method:'POST',headers:ah,body:JSON.stringify({id:legacyUser,name:'PR103 Super Admin',email:legacyEmail,password:hash,role:'SUPER_ADMIN',workspace_id:workspace,is_active:true,approval_status:'APPROVED'})});assert(r.status===201,`legacy_user_seed_${r.status}`);
            let csrf=await fetch(`${base}/api/auth/csrf`),cb=await csrf.json(),lc=cookiesFrom(csrf);assert(cb.csrfToken,'csrf_missing');const form=new URLSearchParams({csrfToken:cb.csrfToken,email:legacyEmail,password:legacyPassword,callbackUrl:`${base}/dashboard`});r=await fetch(`${base}/api/auth/callback/credentials`,{method:'POST',headers:{Cookie:mergeCookies(lc),'Content-Type':'application/x-www-form-urlencoded'},body:form,redirect:'manual'});lc=[...lc,...cookiesFrom(r)];const legacyCookie=mergeCookies(lc);assert(legacyCookie.includes('session-token'),'legacy_session_cookie_missing');
            const avatar1='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z0V8AAAAASUVORK5CYII=',avatar2='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=';
            r=await fetch(`${base}/api/profile-avatar`,{method:'POST',headers:{Cookie:legacyCookie,'Content-Type':'application/json'},body:JSON.stringify({avatar:avatar1})});let a1=await r.json();assert(r.status===200&&a1.avatar===avatar1&&Number(a1.version)>0,'avatar_first_replace_failed');assert(/no-store/.test(r.headers.get('cache-control')||''),'avatar_cache_header_missing');await new Promise(q=>setTimeout(q,5));r=await fetch(`${base}/api/profile-avatar`,{method:'POST',headers:{Cookie:legacyCookie,'Content-Type':'application/json'},body:JSON.stringify({avatar:avatar2})});let a2=await r.json();assert(r.status===200&&a2.avatar===avatar2&&Number(a2.version)>=Number(a1.version),'avatar_second_replace_failed');r=await fetch(`${base}/api/profile-avatar`,{headers:{Cookie:legacyCookie}});j=await r.json();assert(r.status===200&&j.avatar===avatar2,'avatar_get_after_replace_failed');r=await fetch(`${base}/api/profile-avatar`,{method:'DELETE',headers:{Cookie:legacyCookie}});j=await r.json();assert(r.status===200&&j.avatar===null,'avatar_delete_failed');r=await fetch(`${base}/api/profile-avatar`,{headers:{Cookie:legacyCookie}});j=await r.json();assert(r.status===200&&j.avatar===null,'avatar_get_after_delete_failed');console.log('PASS PR103 Avatar immediate replace/delete + no-store/versioning');
            phase('marketing');
            await psql`insert into clients(id,workspace_id,company_name,is_active,currency) values(${clientId},${workspace},${`PR103 Client ${suffix}`},true,'EGP')`;await psql`insert into ad_campaigns(id,workspace_id,client_id,platform,external_id,name,objective,status,created_by) values(${campaignA},${workspace},${clientId},'META',${`ext-a-${suffix}`},'PR103 disposable','LEADS','ACTIVE',${legacyUser})`;const life=async(id,action)=>{const x=await fetch(`${base}/api/campaign-lifecycle`,{method:'POST',headers:{Cookie:legacyCookie,'Content-Type':'application/json'},body:JSON.stringify({id,action})});return{x,b:await x.json()}};let out=await life(campaignA,'archive');assert(out.x.status===200&&out.b.state==='archived','campaign_archive_failed');out=await life(campaignA,'restore');assert(out.x.status===200&&out.b.state==='active','campaign_restore_failed');out=await life(campaignA,'archive');assert(out.x.status===200,'campaign_rearchive_failed');out=await life(campaignA,'delete');assert(out.x.status===200&&out.b.state==='deleted','campaign_delete_failed');await psql`insert into ad_campaigns(id,workspace_id,client_id,platform,external_id,name,objective,status,created_by) values(${campaignB},${workspace},${clientId},'META',${`ext-b-${suffix}`},'PR103 protected','LEADS','ACTIVE',${legacyUser})`;out=await life(campaignB,'archive');assert(out.x.status===200,'protected_campaign_archive_failed');await psql`insert into ad_sets(id,campaign_id,external_id,name,status,budget) values(${`qa-pr103-adset-${suffix}`},${campaignB},${`set-${suffix}`},'History','ACTIVE',1)`;out=await life(campaignB,'delete');assert(out.x.status===409&&Number(out.b.dependencies?.ad_sets)>=1,'linked_history_delete_not_blocked');console.log('PASS PR103 Marketing archive/restore/delete + history protection');phase('pass');console.log('PR103_AUTHENTICATED_RUNTIME_REGRESSION: PASS');
          }finally{
            try{await psql`delete from ad_sets where campaign_id in (${campaignA},${campaignB})`;await psql`delete from ad_campaigns where id in (${campaignA},${campaignB})`;await psql`delete from clients where id=${clientId}`;await psql`delete from audit_logs where user_id=${legacyUser}`;await psql`delete from users where id=${legacyUser}`;await psql`delete from workspaces where id=${workspace}`}catch{}
            try{if(projectId)await gsql`delete from vgroup.audit_logs where entity_id=${projectId}::uuid`;if(techClient){await gsql`delete from vgroup.audit_logs where action='client.create' and entity_id=${techClient}::uuid`;await gsql`delete from tech.projects where client_id=${techClient}::uuid`;await gsql`delete from tech.clients where id=${techClient}::uuid`}if(gUser){await gsql`delete from vgroup.user_business_unit_roles where user_id=${gUser}::uuid`;await gsql`delete from vgroup.users where id=${gUser}::uuid`}}catch{}
            try{if(extId)await fetch(`${process.env.VGROUP_SUPABASE_URL}/auth/v1/admin/users/${extId}`,{method:'DELETE',headers:{apikey:process.env.VGROUP_SUPABASE_SERVICE_ROLE_KEY,Authorization:`Bearer ${process.env.VGROUP_SUPABASE_SERVICE_ROLE_KEY}`}})}catch{}await Promise.all([psql.end({timeout:1}),gsql.end({timeout:1})]);
          }
          NODE
      - name: Detect failed runtime phase
        id: phase
        if: steps.regression.outcome == 'failure'
        run: echo "value=$(cat /tmp/pr103-phase 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
      - name: PR103 runtime failed in Tech
        if: steps.regression.outcome == 'failure' && steps.phase.outputs.value == 'tech'
        run: exit 1
      - name: PR103 runtime failed in Avatar or legacy auth
        if: steps.regression.outcome == 'failure' && steps.phase.outputs.value == 'avatar'
        run: exit 1
      - name: PR103 runtime failed in Marketing lifecycle
        if: steps.regression.outcome == 'failure' && steps.phase.outputs.value == 'marketing'
        run: exit 1
      - name: PR103 runtime failed before phase marker
        if: steps.regression.outcome == 'failure' && steps.phase.outputs.value == 'unknown'
        run: exit 1
      - name: Show runtime log on failure
        if: failure()
        run: cat /tmp/pr103-next.log || true
      - name: Stop ephemeral services
        if: always()
        run: |
          if [ -f /tmp/pr103-next.pid ]; then kill "$(cat /tmp/pr103-next.pid)" >/dev/null 2>&1 || true; fi
          if [ -f /tmp/pr103-rest-proxy.pid ]; then kill "$(cat /tmp/pr103-rest-proxy.pid)" >/dev/null 2>&1 || true; fi
          docker rm -f pr103-postgrest >/dev/null 2>&1 || true
          supabase stop --no-backup || true
