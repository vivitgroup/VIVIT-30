name: Pre-CTO Feature Gate
on:
  push:
    branches:
      - audit/finance-deep-2026-09-01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pre-cto-feature-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact head
        run: test "$(git log -1 --format=%H)" = "${GITHUB_SHA}"
      - name: Install dependencies
        run: npm ci
      - name: Pre-CTO feature contracts
        run: node scripts/qa-pre-cto-feature-gate.mjs
      - name: ESLint zero warnings
        run: npm run lint -- --max-warnings=0
      - name: TypeScript
        run: npm run type-check
