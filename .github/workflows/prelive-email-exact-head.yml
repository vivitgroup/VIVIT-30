name: Prelive Email Exact Head

on:
  push:
    branches:
      - ops/prelive-backup-2026-09-02
    paths:
      - .github/workflows/prelive-email-exact-head.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vivito
          POSTGRES_PASSWORD: vivito
          POSTGRES_DB: vivito_email_cert
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vivito -d vivito_email_cert"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vivito:vivito@127.0.0.1:5432/vivito_email_cert
      DRIZZLE_DATABASE_URL: postgresql://vivito:vivito@127.0.0.1:5432/vivito_email_cert
      DATABASE_SSL_DISABLED: "1"
      AUTH_SECRET: ci-email-exact-head-secret-not-for-production
      NEXTAUTH_SECRET: ci-email-exact-head-secret-not-for-production
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          ref: 61a126ac0ff85c5d34e57b16e32d674499950b06

      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "61a126ac0ff85c5d34e57b16e32d674499950b06"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Initialize isolated schema
        run: npx drizzle-kit push --force

      - name: Notifications and email contracts
        run: node scripts/qa-notifications-email.mjs

      - name: TypeScript
        run: npm run type-check

      - name: Full release build
        run: npm run build
