name: Prelive Production Backup

on:
  push:
    branches:
      - ops/prelive-backup-2026-09-02
    paths:
      - .github/workflows/prelive-production-backup.yml

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Refuse missing backup encryption secret
        env:
          BACKUP_ENCRYPTION_SECRET: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$BACKUP_ENCRYPTION_SECRET" ]; then
            echo "Protected backup encryption secret is not configured."
            exit 1
          fi

      - name: Export production database through GitHub OIDC
        env:
          BACKUP_ENCRYPTION_SECRET: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vivit-prelive-backup")"
          OIDC_TOKEN="$(printf '%s' "$TOKEN_JSON" | jq -er '.value')"
          RAW="vivit-prod-prelive-${GITHUB_RUN_ID}.json"
          GZ="${RAW}.gz"
          ENC="${GZ}.enc"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://fmrehvrzeebeliaxahvf.supabase.co/functions/v1/prelive-db-export" \
            -o "$RAW"
          jq -e '.format == "vivit-logical-json-v1" and .projectRef == "fmrehvrzeebeliaxahvf" and .sourceCommit == "25b934afbe06c4b4c93e885cf24e1925f4401482" and (.tables|type=="object") and (.tables|length>=90)' "$RAW" >/dev/null
          jq -r '{format,capturedAt,projectRef,sourceCommit,tableCount:(.tables|length),migrationCount:(.migrations|length)}' "$RAW" > backup-manifest.json
          gzip -9 "$RAW"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$GZ" -out "$ENC" -pass env:BACKUP_ENCRYPTION_SECRET
          sha256sum "$ENC" | tee backup.sha256
          rm -f "$GZ"
          test -s "$ENC"
          echo "BACKUP_FILE=$ENC" >> "$GITHUB_ENV"

      - name: Upload encrypted off-site backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivit-prod-prelive-db-backup-${{ github.run_id }}
          path: |
            ${{ env.BACKUP_FILE }}
            backup.sha256
            backup-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
