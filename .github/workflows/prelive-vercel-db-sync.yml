name: Prelive Vercel DB Credential Sync

on:
  push:
    branches:
      - ops/prelive-backup-2026-09-02
    paths:
      - .github/workflows/prelive-vercel-db-sync.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_ORG_ID: team_7bnFfb65k7YtwywgLu2vtN1R
      VERCEL_PROJECT_ID: prj_Tgvk58HLEYlXHepCoUfNEUKfMqig
      SUPABASE_PROJECT_REF: fmrehvrzeebeliaxahvf
    steps:
      - name: Require protected credentials
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PROD_DATABASE_URL"
          test -n "$VERCEL_TOKEN"

      - name: Parse protected database credential
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          from urllib.parse import urlsplit, quote, unquote, urlunsplit
          raw = os.environ['PROD_DATABASE_URL'].strip()
          ref = os.environ['SUPABASE_PROJECT_REF']
          p = urlsplit(raw)
          if p.scheme not in ('postgres', 'postgresql'):
              raise SystemExit('invalid database URL scheme')
          if not p.hostname or p.password is None:
              raise SystemExit('database URL missing host/password')
          host = p.hostname
          port = p.port or 5432
          dbname = unquote((p.path or '/postgres').lstrip('/')) or 'postgres'
          password = unquote(p.password)
          username = f'postgres.{ref}' if 'pooler.supabase.com' in host else (p.username or 'postgres')
          userinfo = quote(username, safe='') + ':' + quote(password, safe='')
          urlhost = f'[{host}]' if ':' in host and not host.startswith('[') else host
          normalized = urlunsplit((p.scheme, f'{userinfo}@{urlhost}:{port}', f'/{quote(dbname, safe="")}', '', ''))
          print(f'PGHOST={host}')
          print(f'PGPORT={port}')
          print(f'PGUSER={username}')
          print(f'PGDATABASE={dbname}')
          print(f'PGPASSWORD={password}')
          print(f'NORMALIZED_DATABASE_URL={normalized}')
          PY

      - name: Validate canonical production database credential
        run: |
          set -euo pipefail
          test "$PGUSER" = "postgres.$SUPABASE_PROJECT_REF"
          result="$(psql -v ON_ERROR_STOP=1 -Atqc 'select 1')"
          test "$result" = "1"

      - name: Validate Vercel token and link project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest whoami --token="$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=vivit-s-projects >/dev/null

      - name: Sync DATABASE_URL to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$NORMALIZED_DATABASE_URL" | npx --yes vercel@latest env add DATABASE_URL production --force --sensitive --token="$VERCEL_TOKEN" --scope=vivit-s-projects
          printf '%s' "$NORMALIZED_DATABASE_URL" | npx --yes vercel@latest env add DRIZZLE_DATABASE_URL production --force --sensitive --token="$VERCEL_TOKEN" --scope=vivit-s-projects

      - name: Verify production env names are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest env ls production --token="$VERCEL_TOKEN" --scope=vivit-s-projects | tee env-names.txt
          grep -q 'DATABASE_URL' env-names.txt
          grep -q 'DRIZZLE_DATABASE_URL' env-names.txt
