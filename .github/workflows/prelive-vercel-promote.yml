name: Prelive Vercel Exact Main Deploy

on:
  push:
    branches:
      - ops/prelive-backup-2026-09-02
    paths:
      - .github/workflows/prelive-vercel-promote.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vivit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vivit_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EXACT_MAIN_SHA: 999a1c6e772e9fcae2699825dcd9632e43255b1e
      VERCEL_ORG_ID: team_7bnFfb65k7YtwywgLu2vtN1R
      VERCEL_PROJECT_ID: prj_Tgvk58HLEYlXHepCoUfNEUKfMqig
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vivit_ci
      DRIZZLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vivit_ci
      DATABASE_SSL_DISABLED: "1"
      NEXTAUTH_SECRET: ci-only-nextauth-secret-not-production
      AUTH_SECRET: ci-only-auth-secret-not-production
      CRON_SECRET: ci-only-cron-secret-not-production
      NEXTAUTH_URL: https://vivit-erp-theta.vercel.app
      AUTH_URL: https://vivit-erp-theta.vercel.app
      NEXT_PUBLIC_APP_URL: https://vivit-erp-theta.vercel.app
    steps:
      - name: Require and validate Vercel production token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@latest whoami --token="$VERCEL_TOKEN" >/dev/null

      - name: Checkout exact certified main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_MAIN_SHA }}
          fetch-depth: 1

      - name: Verify exact head
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize isolated database schema
        run: npx drizzle-kit push --force

      - name: Pull Vercel project configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=vivit-s-projects
          rm -f .vercel/.env.production.local
          test -s .vercel/project.json

      - name: Build exact main prebuilt artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN" --scope=vivit-s-projects

      - name: Deploy exact prebuilt artifact to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope=vivit-s-projects --yes | tee vercel-production-url.txt
          test -s vercel-production-url.txt
