name: Preprod v41 budget marketplace fixes
on:
  push:
    branches: [fix/preprod-full-qa-v41]
    paths: [.github/preprod-v41-budget-marketplace-trigger.txt]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preprod-full-qa-v41
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch budget and marketplace scope
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('app/dashboard/budget/page.tsx')
          s=p.read_text()
          s=s.replace('import { eq, gte, and, sum, desc } from "drizzle-orm";', 'import { eq, gte, and, sum, desc, inArray } from "drizzle-orm";')
          old='''  const [allClients, mtdMetrics] = await Promise.all([\n    db.select({id:clients.id,companyName:clients.companyName,mediaBudget:clients.mediaBudget,targetLeads:clients.targetLeads})\n      .from(clients).where(eq(clients.isActive,true)),\n    db.select({clientId:mediaMetrics.clientId,spend:sum(mediaMetrics.adSpend),leads:sum(mediaMetrics.leads)})\n      .from(mediaMetrics).where(gte(mediaMetrics.date,moStart))\n      .groupBy(mediaMetrics.clientId),\n  ]);\n\n  const metricMap = Object.fromEntries(mtdMetrics.map(m=>[m.clientId,m]));\n  const fmt = (n:number) => n>=1000?`$${(n/1000).toFixed(0)}k`:`$${n.toLocaleString()}`;'''
          new='''  const userId=String((session.user as any).id||"");\n  const clientScope=role===Role.ACCOUNT_MANAGER\n    ? and(eq(clients.isActive,true),eq(clients.accountManagerId,userId))\n    : role===Role.MEDIA_BUYER\n      ? and(eq(clients.isActive,true),eq(clients.mediaBuyerId,userId))\n      : eq(clients.isActive,true);\n  const allClients=await db.select({id:clients.id,companyName:clients.companyName,mediaBudget:clients.mediaBudget,targetLeads:clients.targetLeads})\n    .from(clients).where(clientScope);\n  const clientIds=allClients.map(c=>c.id);\n  const mtdMetrics=clientIds.length?await db.select({clientId:mediaMetrics.clientId,spend:sum(mediaMetrics.adSpend),leads:sum(mediaMetrics.leads)})\n    .from(mediaMetrics).where(and(gte(mediaMetrics.date,moStart),inArray(mediaMetrics.clientId,clientIds)))\n    .groupBy(mediaMetrics.clientId):[];\n\n  const metricMap = Object.fromEntries(mtdMetrics.map(m=>[m.clientId,m]));\n  const fmt = (n:number) => new Intl.NumberFormat("en-EG",{style:"currency",currency:"EGP",maximumFractionDigits:0}).format(Number(n||0));'''
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('app/dashboard/marketplace/page.tsx')
          s=p.read_text()
          s=s.replace('import { db, users, creatorProfiles, creativeTasks } from "@/lib/db";', 'import { db, users, creatorProfiles, creativeTasks, clients } from "@/lib/db";')
          old='''    ratePerTask: parseFloat(fd.get("rate") as string) || 0,'''
          new='''    ratePerTask: Math.max(0, Number.parseFloat(String(fd.get("rate")||"0")) || 0),'''
          assert old in s
          s=s.replace(old,new)
          old='''  const openTasks = role !== Role.CREATOR ? await db.select().from(creativeTasks).where(eq(creativeTasks.status, "PENDING")).limit(10) : [];'''
          new='''  const userId=String((session.user as any).id||"");\n  let openTasks:any[]=[];\n  if(role===Role.SUPER_ADMIN){\n    openTasks=await db.select().from(creativeTasks).where(eq(creativeTasks.status,"PENDING")).limit(10);\n  }else if(role===Role.ACCOUNT_MANAGER){\n    const owned=await db.select({id:clients.id}).from(clients).where(and(eq(clients.accountManagerId,userId),eq(clients.isActive,true)));\n    const ids=owned.map(c=>c.id);\n    openTasks=ids.length?await db.select().from(creativeTasks).where(and(eq(creativeTasks.status,"PENDING"),inArray(creativeTasks.clientId,ids))).limit(10):[];\n  }'''
          assert old in s
          s=s.replace(old,new)
          s=s.replace('Rate per Task ($)', 'Rate per Task (EGP)')
          s=s.replace('${p.ratePerTask}/task', '${Number(p.ratePerTask).toLocaleString("en-EG")} EGP/task')
          s=s.replace('<select name="available" className="form-input">\n                <option value="true" selected={myProfile?.isAvailable!==false}>✅ Available</option>\n                <option value="false" selected={myProfile?.isAvailable===false}>❌ Not Available</option>\n              </select>', '<select name="available" className="form-input" defaultValue={myProfile?.isAvailable===false?"false":"true"}>\n                <option value="true">✅ Available</option>\n                <option value="false">❌ Not Available</option>\n              </select>')
          s=s.replace('target="_blank" className="text-xs text-[#244D87]', 'target="_blank" rel="noopener noreferrer" className="text-xs text-[#244D87]')
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "vivitgroup"
          git config user.email "groupvivit@gmail.com"
          git add app/dashboard/budget/page.tsx app/dashboard/marketplace/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Scope budget and marketplace data by role"
          git push origin HEAD:fix/preprod-full-qa-v41
