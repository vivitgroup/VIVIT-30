name: Preprod v41 client detail fixes
on:
  push:
    branches: [fix/preprod-full-qa-v41]
    paths: [.github/preprod-v41-client-detail-trigger.txt]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preprod-full-qa-v41
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch client detail actions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/clients/[id]/page.tsx')
          s=p.read_text()
          old=r'''  // Find or create a lead for this client
  const [lead]=await db.select().from(salesLeads).where(eq(salesLeads.clientId,clientId)).limit(1);
  const leadId=lead?.id||clientId;
  await db.insert(salesActivities).values({
    leadId, userId:session.user.id!,
    type:fd.get("type") as string,
    notes:fd.get("notes") as string||null,
    outcome:fd.get("outcome") as string||null,
    nextActionDate:fd.get("nextDate")? new Date(fd.get("nextDate") as string):null,
  });'''
          new=r'''  const type=String(fd.get("type")||"");
  if(!["call","email","whatsapp","meeting","note"].includes(type)) throw new Error("Invalid activity type");
  const nextRaw=String(fd.get("nextDate")||"");const nextActionDate=nextRaw?new Date(nextRaw):null;
  if(nextActionDate&&Number.isNaN(nextActionDate.getTime())) throw new Error("Invalid follow-up date");
  let [lead]=await db.select().from(salesLeads).where(eq(salesLeads.clientId,clientId)).limit(1);
  if(!lead){
    const [client]=await db.select({companyName:clients.companyName,industry:clients.industry}).from(clients).where(eq(clients.id,clientId)).limit(1);
    if(!client) throw new Error("Client not found");
    [lead]=await db.insert(salesLeads).values({workspaceId:"default",companyName:client.companyName,contactPerson:client.companyName,source:"CLIENT_ACTIVITY",stage:"NEW_LEAD",estimatedValue:0,probability:5,industry:client.industry,clientId}).returning();
  }
  await db.insert(salesActivities).values({leadId:lead.id,userId:session.user.id!,type,notes:String(fd.get("notes")||"").trim().slice(0,1500)||null,outcome:String(fd.get("outcome")||"").trim().slice(0,500)||null,nextActionDate});'''
          assert old in s
          s=s.replace(old,new)
          old=r'''  await db.update(clients).set({
    companyName:fd.get("companyName") as string,
    industry:fd.get("industry") as string||null,
    website:fd.get("website") as string||null,
    monthlyRetainer:parseFloat(fd.get("monthlyRetainer") as string)||0,
    mediaBudget:parseFloat(fd.get("mediaBudget") as string)||0,
    internalNotes:fd.get("notes") as string||null,
    updatedAt:new Date(),
  }).where(eq(clients.id,id));'''
          new=r'''  const companyName=String(fd.get("companyName")||"").trim().slice(0,160);if(!companyName)throw new Error("Company name is required");
  const monthlyRetainer=Number(fd.get("monthlyRetainer")||0),mediaBudget=Number(fd.get("mediaBudget")||0);
  if(![monthlyRetainer,mediaBudget].every(Number.isFinite)||monthlyRetainer<0||mediaBudget<0)throw new Error("Financial values must be non-negative numbers");
  const website=String(fd.get("website")||"").trim();if(website){try{const u=new URL(website);if(!["http:","https:"].includes(u.protocol))throw new Error();}catch{throw new Error("Invalid website URL");}}
  await db.update(clients).set({companyName,industry:String(fd.get("industry")||"").trim().slice(0,120)||null,website:website||null,monthlyRetainer,mediaBudget,internalNotes:String(fd.get("notes")||"").trim().slice(0,2000)||null,updatedAt:new Date()}).where(eq(clients.id,id));'''
          assert old in s
          s=s.replace(old,new)
          s=s.replace('target="_blank" className="text-[#244D87] hover:underline"','target="_blank" rel="noopener noreferrer" className="text-[#244D87] hover:underline"')
          s=s.replace('target="_blank" className="text-xs px-3 py-1.5 rounded-xl bg-green-500/10','target="_blank" rel="noopener noreferrer" className="text-xs px-3 py-1.5 rounded-xl bg-green-500/10')
          s=s.replace('target="_blank" className="text-[10px] px-2 py-0.5 rounded bg-blue-500/10','target="_blank" rel="noopener noreferrer" className="text-[10px] px-2 py-0.5 rounded bg-blue-500/10')
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "vivitgroup"
          git config user.email "groupvivit@gmail.com"
          git add 'app/dashboard/clients/[id]/page.tsx'
          git diff --cached --quiet && exit 0
          git commit -m "Fix client activity and detail validation"
          git push origin HEAD:fix/preprod-full-qa-v41
