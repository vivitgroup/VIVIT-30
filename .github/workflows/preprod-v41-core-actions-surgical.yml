name: Preprod v41 core actions surgical
on:
  push:
    branches: [fix/preprod-full-qa-v41]
    paths: [.github/preprod-v41-core-surgical-trigger.txt]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preprod-full-qa-v41
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply core action security patches
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/actions/index.ts')
          s=p.read_text()

          needle='''  const creatorRole=roleOf(session);\n\n  const [client] = await db.insert(clients).values({'''
          repl='''  const creatorRole=roleOf(session);\n  const requestedAm=creatorRole==="ACCOUNT_MANAGER"?session!.user!.id!:String(formData.get("accountManagerId")||"")||null;\n  const requestedMb=String(formData.get("mediaBuyerId")||"")||null;\n  if(requestedAm){const [am]=await db.select({id:users.id}).from(users).where(and(eq(users.id,requestedAm),eq(users.role,"ACCOUNT_MANAGER"),eq(users.isActive,true))).limit(1);if(!am)throw new Error("Invalid account manager");}\n  if(requestedMb){const [mb]=await db.select({id:users.id}).from(users).where(and(eq(users.id,requestedMb),eq(users.role,"MEDIA_BUYER"),eq(users.isActive,true))).limit(1);if(!mb)throw new Error("Invalid media buyer");}\n\n  const [client] = await db.insert(clients).values({'''
          assert needle in s;s=s.replace(needle,repl,1)
          s=s.replace('''    accountManagerId: creatorRole==="ACCOUNT_MANAGER" ? session!.user!.id! : (formData.get("accountManagerId") as string || null),\n    mediaBuyerId:     formData.get("mediaBuyerId") as string || null,''','''    accountManagerId: requestedAm,\n    mediaBuyerId:     requestedMb,''',1)

          needle='''  const session = await auth();\n  await requireClientAccess(session,clientId,true);\n\n  await db.update(clients).set({'''
          repl='''  const session = await auth();\n  await requireClientAccess(session,clientId,true);\n  const updateRole=roleOf(session);\n  const [existingClient]=await db.select({accountManagerId:clients.accountManagerId,mediaBuyerId:clients.mediaBuyerId}).from(clients).where(eq(clients.id,clientId)).limit(1);\n  if(!existingClient)throw new Error("Client not found");\n  let nextAm=existingClient.accountManagerId,nextMb=existingClient.mediaBuyerId;\n  if(updateRole==="SUPER_ADMIN"){\n    nextAm=String(formData.get("accountManagerId")||"")||null;nextMb=String(formData.get("mediaBuyerId")||"")||null;\n    if(nextAm){const [am]=await db.select({id:users.id}).from(users).where(and(eq(users.id,nextAm),eq(users.role,"ACCOUNT_MANAGER"),eq(users.isActive,true))).limit(1);if(!am)throw new Error("Invalid account manager");}\n    if(nextMb){const [mb]=await db.select({id:users.id}).from(users).where(and(eq(users.id,nextMb),eq(users.role,"MEDIA_BUYER"),eq(users.isActive,true))).limit(1);if(!mb)throw new Error("Invalid media buyer");}\n  }\n\n  await db.update(clients).set({'''
          assert needle in s;s=s.replace(needle,repl,1)
          s=s.replace('''    accountManagerId: formData.get("accountManagerId") as string || null,\n    mediaBuyerId:     formData.get("mediaBuyerId")     as string || null,''','''    accountManagerId: nextAm,\n    mediaBuyerId:     nextMb,''',1)

          needle='''  if (!title || !clientId || !type || !brief || !deadline) throw new Error("Missing required fields");\n\n  const [task] = await db.insert(creativeTasks).values({'''
          repl='''  const allowedTypes=["REEL","GRAPHIC","CAROUSEL","MOTION_GRAPHIC","VIDEO_EDIT","PHOTO_SESSION","STORY","UGC"],allowedPriorities=["URGENT","HIGH","MEDIUM","LOW"];\n  const deadlineDate=new Date(deadline);\n  if(!title||!clientId||!brief||!allowedTypes.includes(type)||!allowedPriorities.includes(priority)||!deadline||Number.isNaN(deadlineDate.getTime()))throw new Error("Invalid task data");\n  if(assignedToId){const [creator]=await db.select({id:users.id}).from(users).where(and(eq(users.id,assignedToId),eq(users.role,"CREATOR"),eq(users.isActive,true))).limit(1);if(!creator)throw new Error("Invalid creator assignment");}\n\n  const [task] = await db.insert(creativeTasks).values({'''
          assert needle in s;s=s.replace(needle,repl,1)
          s=s.replace('''    assignedToId, deadline: new Date(deadline), caption,''','''    assignedToId, deadline: deadlineDate, caption,''',1)

          needle='''  if((!isManager&&taskBefore.assignedToId!==session!.user!.id)||!allowedStatuses.includes(taskBefore.status))throw new Error("Forbidden");\n\n  const [task] = await db.update(creativeTasks)'''
          repl='''  if((!isManager&&taskBefore.assignedToId!==session!.user!.id)||!allowedStatuses.includes(taskBefore.status))throw new Error("Forbidden");\n  if(isManager)await requireClientAccess(session,taskBefore.clientId,true);\n  if(!validateUrl(String(fileUrl||"")))throw new Error("A valid uploaded file URL is required");\n\n  const [task] = await db.update(creativeTasks)'''
          assert needle in s;s=s.replace(needle,repl,1)
          p.write_text(s)

          p=Path('app/dashboard/creative/new/page.tsx')
          s=p.read_text()
          s=s.replace('import { eq } from "drizzle-orm";','import { eq, and } from "drizzle-orm";',1)
          needle='''  const [allClients, creators] = await Promise.all([\n    db.select({ id: clients.id, companyName: clients.companyName }).from(clients).where(eq(clients.isActive, true)).orderBy(clients.companyName),\n    db.select({ id: users.id, name: users.name }).from(users).where(eq(users.role, "CREATOR")),\n  ]);'''
          repl='''  const userId=String((session.user as any).id||"");\n  const [allClients, creators] = await Promise.all([\n    db.select({id:clients.id,companyName:clients.companyName}).from(clients).where(role===Role.ACCOUNT_MANAGER?and(eq(clients.isActive,true),eq(clients.accountManagerId,userId)):eq(clients.isActive,true)).orderBy(clients.companyName),\n    db.select({id:users.id,name:users.name}).from(users).where(and(eq(users.role,"CREATOR"),eq(users.isActive,true))),\n  ]);'''
          assert needle in s;s=s.replace(needle,repl,1)
          s=s.replace('<select name="priority" id="f_priority" required className="form-input">','<select name="priority" id="f_priority" required defaultValue="MEDIUM" className="form-input">',1)
          s=s.replace('<option value="MEDIUM" selected>🟡 Medium</option>','<option value="MEDIUM">🟡 Medium</option>',1)
          p.write_text(s)
          PY
      - name: Commit patches
        run: |
          git config user.name "vivitgroup"
          git config user.email "groupvivit@gmail.com"
          git add lib/actions/index.ts app/dashboard/creative/new/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Secure client assignments and creative actions"
          git push origin HEAD:fix/preprod-full-qa-v41
