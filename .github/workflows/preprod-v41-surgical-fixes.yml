name: Preprod v41 surgical fixes
on:
  push:
    branches: [fix/preprod-full-qa-v41]
    paths: [.github/preprod-v41-trigger.txt]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preprod-full-qa-v41
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped QA fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Onboarding: scope both read and write paths to the Account Manager's clients.
          p=Path('app/dashboard/onboarding/page.tsx')
          s=p.read_text()
          s=s.replace('import { eq, and } from "drizzle-orm";', 'import { eq, and, inArray } from "drizzle-orm";')
          s=s.replace('const { db, onboardingProgress } = await import("@/lib/db");', 'const { db, onboardingProgress, clients } = await import("@/lib/db");')
          old='''  const userId = (session.user as any).id as string;\n  const existing = await db.select().from(onboardingProgress)'''
          new='''  const userId = (session.user as any).id as string;\n  if (role === Role.ACCOUNT_MANAGER) {\n    const [ownedClient] = await db.select({ id: clients.id }).from(clients)\n      .where(and(eq(clients.id, clientId), eq(clients.accountManagerId, userId), eq(clients.isActive, true))).limit(1);\n    if (!ownedClient) throw new Error("Forbidden");\n  } else {\n    const [existingClient] = await db.select({ id: clients.id }).from(clients).where(eq(clients.id, clientId)).limit(1);\n    if (!existingClient) throw new Error("Client not found");\n  }\n  const existing = await db.select().from(onboardingProgress)'''
          assert old in s
          s=s.replace(old,new)
          old='''  const allClients = await db.select({ id: clients.id, companyName: clients.companyName, createdAt: clients.createdAt })\n    .from(clients).where(eq(clients.isActive, true)).orderBy(clients.createdAt);\n\n  const allProgress = await db.select().from(onboardingProgress);'''
          new='''  const userId = String((session.user as any).id || "");\n  const allClients = await db.select({ id: clients.id, companyName: clients.companyName, createdAt: clients.createdAt })\n    .from(clients).where(role === Role.ACCOUNT_MANAGER\n      ? and(eq(clients.isActive, true), eq(clients.accountManagerId, userId))\n      : eq(clients.isActive, true)).orderBy(clients.createdAt);\n\n  const clientIds = allClients.map(c => c.id);\n  const allProgress = clientIds.length\n    ? await db.select().from(onboardingProgress).where(inArray(onboardingProgress.clientId, clientIds))\n    : [];'''
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)

          # AI Studio: only list authorized clients and each user's own generation history.
          p=Path('app/dashboard/ai-studio/page.tsx')
          s=p.read_text()
          s=s.replace('import { eq, desc, count } from "drizzle-orm";', 'import { eq, and, desc, count } from "drizzle-orm";')
          old='''  const [allClients, recentGens, genCount] = await Promise.all([\n    db.select({id:clients.id,companyName:clients.companyName}).from(clients).where(eq(clients.isActive,true)),\n    db.select().from(aiGenerations).orderBy(desc(aiGenerations.createdAt)).limit(10),\n    db.select({cnt:count()}).from(aiGenerations),\n  ]);'''
          new='''  const userId = String((session.user as any).id || "");\n  const clientScope = role === Role.ACCOUNT_MANAGER\n    ? and(eq(clients.isActive,true), eq(clients.accountManagerId,userId))\n    : role === Role.MEDIA_BUYER\n      ? and(eq(clients.isActive,true), eq(clients.mediaBuyerId,userId))\n      : eq(clients.isActive,true);\n  const [allClients, recentGens, genCount] = await Promise.all([\n    db.select({id:clients.id,companyName:clients.companyName}).from(clients).where(clientScope),\n    role === Role.SUPER_ADMIN\n      ? db.select().from(aiGenerations).orderBy(desc(aiGenerations.createdAt)).limit(10)\n      : db.select().from(aiGenerations).where(eq(aiGenerations.userId,userId)).orderBy(desc(aiGenerations.createdAt)).limit(10),\n    role === Role.SUPER_ADMIN\n      ? db.select({cnt:count()}).from(aiGenerations)\n      : db.select({cnt:count()}).from(aiGenerations).where(eq(aiGenerations.userId,userId)),\n  ]);'''
          assert old in s
          s=s.replace(old,new)
          s=s.replace('label:"Total Budget ($)"','label:"Total Budget (EGP)"')
          s=s.replace('options:["This Month","Last Month","Q1 2025","Q2 2025","Q3 2025","Q4 2025"]','options:["This Month","Last Month","Q1 2026","Q2 2026","Q3 2026","Q4 2026"]')
          p.write_text(s)

          # Client portal: EGP everywhere, no leftover dollar formatter.
          p=Path('app/dashboard/portal/page.tsx')
          s=p.read_text()
          old='''  const fmt = (n:number) => n>=1000?`$${(n/1000).toFixed(0)}k`:`$${n.toLocaleString()}`;'''
          new='''  const fmt = (n:number) => new Intl.NumberFormat("en-EG",{style:"currency",currency:"EGP",maximumFractionDigits:0}).format(Number(n||0));'''
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit patches
        run: |
          git config user.name "vivitgroup"
          git config user.email "groupvivit@gmail.com"
          git add app/dashboard/onboarding/page.tsx app/dashboard/ai-studio/page.tsx app/dashboard/portal/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Scope onboarding and AI Studio; normalize portal EGP"
          git push origin HEAD:fix/preprod-full-qa-v41
