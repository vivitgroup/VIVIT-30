name: Business Logic Hardcore Audit
on:
  push:
    branches: [audit/business-logic-hardcore-2026-08-31]
  pull_request:
    branches: [main]
    paths:
      - 'app/api/**'
      - 'app/dashboard/**'
      - 'lib/**'
      - 'scripts/qa-business-logic-*.mjs'
      - '.github/workflows/qa-business-logic-hardcore.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vivit_ci
      AUTH_SECRET: business-logic-ci-placeholder-secret-not-for-production
      NEXTAUTH_SECRET: business-logic-ci-placeholder-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply onboarding tenant hardening
        run: node scripts/fix-business-onboarding-dashboard.mjs
      - name: Commit onboarding tenant hardening
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/dashboard/onboarding/page.tsx
            git commit -m "fix(business): scope onboarding dashboard to workspace"
            git push origin HEAD:audit/business-logic-hardcore-2026-08-31
          fi
      - name: Sync RBAC QA to client completion contract
        run: node scripts/fix-rbac-qa-client-completion.mjs
      - name: Commit RBAC QA contract sync
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/qa-rbac-security.mjs
            git commit -m "fix(qa): assert client-controlled task completion"
            git push origin HEAD:audit/business-logic-hardcore-2026-08-31
          fi
      - name: Apply media control tenant and atomicity hardening
        run: node scripts/fix-media-control-tenant-atomicity.mjs
      - name: Commit media control hardening
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/api/media-control/route.ts
            git commit -m "fix(business): tenant-harden media control mutations"
            git push origin HEAD:audit/business-logic-hardcore-2026-08-31
          fi
      - name: Apply marketplace creator profile hardening
        run: node scripts/fix-marketplace-profile-hardening.mjs
      - name: Commit marketplace profile hardening
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/dashboard/marketplace/page.tsx
            git commit -m "fix(business): harden creator marketplace profile writes"
            git push origin HEAD:audit/business-logic-hardcore-2026-08-31
          fi
      - name: Apply media control v2 tenant and atomicity hardening
        run: node scripts/fix-media-control-v2-hardening.mjs
      - name: Commit media control v2 hardening
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/api/media-control-v2/route.ts
            git commit -m "fix(business): tenant-harden media control v2 mutations"
            git push origin HEAD:audit/business-logic-hardcore-2026-08-31
          fi
      - name: Apply media discover tenant and atomicity hardening
        run: node scripts/fix-media-discover-hardening.mjs
      - name: Commit media discover hardening
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/api/media-discover/route.ts
            git commit -m "fix(business): harden media discovery sync"
            git push origin HEAD:audit/business-logic-hardcore-2026-08-31
          fi
      - name: Apply VIVITO execution receipt refactor
        run: node scripts/fix-assistant-actions-receipts.mjs
      - name: Commit VIVITO receipt refactor
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/api/assistant/actions/route.ts
            git commit -m "refactor(vivito): isolate atomic execution receipt states"
            git push origin HEAD:audit/business-logic-hardcore-2026-08-31
          fi
      - name: Apply media cron tenant hardening
        run: node scripts/fix-media-cron-tenant-scope.mjs
      - name: Commit media cron hardening
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/api/cron/media-sync/route.ts
            git commit -m "fix(business): tenant-harden media sync cron"
            git push origin HEAD:audit/business-logic-hardcore-2026-08-31
          fi
      - name: Enforce client-only completion in Tasks Inbox
        run: node scripts/fix-task-inbox-client-completion.mjs
      - name: Commit Tasks Inbox completion contract
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/dashboard/tasks-inbox/page.tsx scripts/qa-tasks-archive.mjs
            git commit -m "fix(business): reserve task completion for client approval"
            git push origin HEAD:audit/business-logic-hardcore-2026-08-31
          fi
      - name: Apply performance score hardening
        run: node scripts/fix-performance-score-hardening.mjs
      - name: Commit performance score hardening
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/api/performance-score/route.ts
            git commit -m "fix(business): audit and scope performance score recalculation"
            git push origin HEAD:audit/business-logic-hardcore-2026-08-31
          fi
      - name: Apply WhatsApp tenant hardening
        run: node scripts/fix-whatsapp-tenant-scope.mjs
      - name: Commit WhatsApp tenant hardening
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/api/whatsapp-templates/route.ts
            git commit -m "fix(security): scope WhatsApp messages to workspace"
            git push origin HEAD:audit/business-logic-hardcore-2026-08-31
          fi
      - run: npm ci
      - name: Business logic radar
        continue-on-error: true
        run: node scripts/qa-business-logic-hardcore.mjs
      - name: Critical business invariants
        run: node scripts/qa-business-critical-invariants.mjs
      - run: npm run qa:data-integrity
      - run: npm run qa:clients
      - run: npm run qa:tasks-archive
      - run: npm run qa:finance-reports
      - run: npm run qa:finance-recurring
      - run: npm run qa:hr-payroll
      - run: npm run qa:sales-lifecycle
      - run: npm run qa:operations-security
      - run: npm run qa:rbac-security
      - run: npm run qa:vivito-actions
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
