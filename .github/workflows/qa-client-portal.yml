name: Client Portal Audit

on:
  push:
    branches:
      - audit/client-portal-2026-09-01
  pull_request:
    branches:
      - audit/role-by-role-e2e-2026-09-01

concurrency:
  group: client-portal-${{ github.sha }}
  cancel-in-progress: true

jobs:
  client-portal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vivit_client_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vivit_client_portal"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vivit_client_portal
      DRIZZLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vivit_client_portal
      DATABASE_SSL_DISABLED: "1"
      AUTH_SECRET: client-portal-auth-secret-2026-minimum-32-characters
      NEXTAUTH_SECRET: client-portal-auth-secret-2026-minimum-32-characters
      NEXTAUTH_URL: http://127.0.0.1:3000
      AUTH_URL: http://127.0.0.1:3000
      SUPABASE_URL: http://127.0.0.1:4599
      SUPABASE_SERVICE_KEY: client-portal-local-service-key
      MOCK_SUPABASE_PORT: "4599"
      BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build ephemeral database
        run: npx drizzle-kit push --force

      - name: Database and data-integrity regression
        run: node scripts/qa-database-data-integrity.mjs

      - name: Security and RBAC static regression
        run: |
          node scripts/qa-security-auth-hardcore.mjs
          node scripts/qa-security-api-surface.mjs
          node scripts/qa-rbac-security.mjs
          node scripts/qa-search-rbac.mjs
          node scripts/qa-session-security.mjs

      - name: ESLint zero-warning gate
        run: npx eslint . --max-warnings=0

      - name: TypeScript gate
        run: npm run type-check

      - name: Production build gate
        run: npm run build

      - name: Start built server
        run: |
          NODE_ENV=production npm start > /tmp/vivit-client-portal-server.log 2>&1 &
          echo $! > /tmp/vivit-client-portal-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vivit-client-portal-server.log
          exit 1

      - name: Role-by-role authenticated regression
        run: node scripts/qa-role-by-role-e2e.mjs

      - name: Client Portal cross-client isolation E2E
        shell: bash
        run: |
          set -o pipefail
          node scripts/qa-client-portal-e2e.mjs | tee /tmp/client-portal-e2e.log

      - name: Upload focused Client Portal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-portal-e2e-${{ github.sha }}
          path: |
            /tmp/client-portal-e2e.log
            /tmp/vivit-client-portal-server.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Anonymous runtime security regression
        run: node scripts/qa-runtime-smoke.mjs

      - name: Dump focused E2E failures
        if: failure()
        run: grep '^FAIL' /tmp/client-portal-e2e.log || true

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/vivit-client-portal-server.log || true

      - name: Stop built server
        if: always()
        run: |
          if [ -f /tmp/vivit-client-portal-server.pid ]; then kill "$(cat /tmp/vivit-client-portal-server.pid)" || true; fi
