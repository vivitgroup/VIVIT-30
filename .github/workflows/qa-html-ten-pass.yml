name: HTML Ten Pass Audit
on:
  push:
    branches: [audit/html-ten-pass-2026-08-31]
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vivit_ci
      AUTH_SECRET: html-audit-ci-placeholder-secret-not-for-production
      NEXTAUTH_SECRET: html-audit-ci-placeholder-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Ten-pass HTML audit
        run: node scripts/qa-html-ten-pass.mjs
      - run: npm run qa:mobile-ux
      - run: npm run qa:resilience-ux
      - run: npm run qa:rbac-security
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
