# Final stabilized audit trigger after lifecycle and QA hardening.
name: Legacy Task Create Contract
on:
  push:
    branches: [audit/business-logic-hardcore-2026-08-31]
permissions:
  contents: write
jobs:
  enforce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce legacy client/task creation contract
        run: node scripts/fix-legacy-task-create-atomicity.mjs
      - name: Commit hardening
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/actions/index.ts scripts/qa-tasks-archive.mjs scripts/qa-clients.mjs
            git commit -m "fix(business): harden legacy client and task creation"
            git push origin HEAD:audit/business-logic-hardcore-2026-08-31
          fi
