name: QA 100 Percent Release

on:
  push:
    branches:
      - audit/finance-deep-2026-09-01
      - qa/100-percent-release
      - release/vivito-rc1-2026-08-27
  pull_request:
    branches:
      - main

concurrency:
  group: qa-100-percent-release-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vivito
          POSTGRES_PASSWORD: vivito
          POSTGRES_DB: vivito_qa_release
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vivito -d vivito_qa_release"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vivito:vivito@127.0.0.1:5432/vivito_qa_release
      DRIZZLE_DATABASE_URL: postgresql://vivito:vivito@127.0.0.1:5432/vivito_qa_release
      VGROUP_DATABASE_URL: postgresql://vivito:vivito@127.0.0.1:5432/vivito_vgroup_qa_release
      DATABASE_SSL_DISABLED: "1"
      VGROUP_DATABASE_SSL_DISABLED: "1"
      AUTH_SECRET: ci-qa-release-secret-not-for-production
      NEXTAUTH_SECRET: ci-qa-release-secret-not-for-production
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact candidate SHA
        shell: bash
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "actual=$ACTUAL"
          echo "expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build isolated ephemeral databases
        shell: bash
        run: |
          npx drizzle-kit push --force
          PGPASSWORD=vivito psql -h 127.0.0.1 -U vivito -d postgres -v ON_ERROR_STOP=1 -c "create database vivito_vgroup_qa_release"
          DRIZZLE_DATABASE_URL="$VGROUP_DATABASE_URL" DATABASE_URL="$VGROUP_DATABASE_URL" npx drizzle-kit push --force
          node scripts/qa-bootstrap-vgroup-tech.mjs

      - name: Full release build
        run: npm run build

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start ephemeral Supabase Auth
        shell: bash
        run: |
          supabase init
          supabase start
          supabase status -o env > /tmp/vivit-supabase.env
          set -a
          source /tmp/vivit-supabase.env
          set +a
          AUTH_PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          test -n "${API_URL:-}"
          test -n "$AUTH_PUBLIC_KEY"
          test -n "${SERVICE_ROLE_KEY:-}"
          test -n "${DB_URL:-}"
          MARKETING_HANDOFF_SECRET="$(openssl rand -hex 32)"
          {
            echo "VGROUP_SUPABASE_URL=$API_URL"
            echo "VGROUP_SUPABASE_PUBLISHABLE_KEY=$AUTH_PUBLIC_KEY"
            echo "VGROUP_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VGROUP_SUPABASE_SERVICE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_KEY=$SERVICE_ROLE_KEY"
            echo "QA_SUPABASE_DB_URL=$DB_URL"
            echo "VGROUP_MARKETING_INTEGRATION_ENABLED=true"
            echo "VGROUP_MARKETING_CANDIDATE_SHA=9817ec42750b17104c5292eb2ec4d02358b53290"
            echo "VGROUP_MARKETING_HANDOFF_SECRET=$MARKETING_HANDOFF_SECRET"
          } >> "$GITHUB_ENV"
          echo "Ephemeral Supabase Auth and Marketing handoff receiver are ready; local credentials are not persisted."

      - name: Built runtime smoke + authenticated role-by-role E2E
        shell: bash
        run: |
          set -o pipefail
          npm start > /tmp/vivit-next.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/vivit-next.log
            exit 1
          fi
          BASE_URL=http://127.0.0.1:3000 npm run qa:runtime-smoke || { cat /tmp/vivit-next.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 node scripts/qa-authenticated-role-e2e.mjs 2>&1 | tee /tmp/vivit-auth-e2e.log || { cat /tmp/vivit-next.log; exit 1; }
          BASE_URL=http://127.0.0.1:3000 node scripts/qa-marketing-action-e2e.mjs 2>&1 | tee /tmp/vivit-marketing-action-e2e.log || { cat /tmp/vivit-next.log; exit 1; }

      - name: Upload authenticated E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-role-e2e-diagnostics
          path: |
            /tmp/vivit-auth-e2e.log
            /tmp/vivit-marketing-action-e2e.log
            /tmp/vivit-next.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Stop ephemeral Supabase
        if: always()
        shell: bash
        run: supabase stop --no-backup || true
