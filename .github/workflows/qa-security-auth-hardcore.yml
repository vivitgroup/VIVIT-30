name: Security Auth Hardcore Audit

on:
  push:
    branches:
      - audit/security-auth-hardcore-2026-09-01
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-auth-hardcore-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  security-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vivito
          POSTGRES_PASSWORD: vivito
          POSTGRES_DB: vivito_security_auth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vivito -d vivito_security_auth"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vivito:vivito@127.0.0.1:5432/vivito_security_auth
      DRIZZLE_DATABASE_URL: postgresql://vivito:vivito@127.0.0.1:5432/vivito_security_auth
      DATABASE_SSL_DISABLED: "1"
      AUTH_SECRET: ci-security-auth-secret-not-for-production
      NEXTAUTH_SECRET: ci-security-auth-secret-not-for-production
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate SHA
        shell: bash
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$ACTUAL" = "$EXPECTED"
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build base ephemeral database
        run: npx drizzle-kit push --force
      - name: Security auth invariants
        run: node scripts/qa-security-auth-hardcore.mjs
      - name: API mutation authentication surface
        run: node scripts/qa-security-api-surface.mjs
      - name: Legacy raw secret surface
        run: node scripts/qa-legacy-secret-surface.mjs
      - name: ESLint zero-warning gate
        run: npm run lint -- --max-warnings=0
      - name: TypeScript gate
        run: npx tsc --noEmit
      - name: Production build gate
        run: npm run build
