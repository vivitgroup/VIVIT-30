name: UIUX Interaction Polish
on:
  push:
    branches: [fix/uiux-interaction-polish-2026-08-31]
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vivit_ci
      AUTH_SECRET: uiux-polish-ci-placeholder-secret-not-for-production
      NEXTAUTH_SECRET: uiux-polish-ci-placeholder-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix focus-return declaration order
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/layout/Header.tsx')
          s=p.read_text()
          old=' useEffect(()=>{const h=(e:KeyboardEvent)=>{if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();setSearchOpen(v=>!v);setQuery("");setResults([])}if(e.key==="Escape"&&searchOpen)closeSearch()};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[searchOpen]);\n useEffect(()=>{if(searchOpen)setTimeout(()=>inputRef.current?.focus(),50)},[searchOpen]);\n const closeSearch=()=>{setSearchOpen(false);requestAnimationFrame(()=>searchButtonRef.current?.focus())};'
          new=' const closeSearch=useCallback(()=>{setSearchOpen(false);requestAnimationFrame(()=>searchButtonRef.current?.focus())},[]);\n useEffect(()=>{const h=(e:KeyboardEvent)=>{if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();setSearchOpen(v=>!v);setQuery("");setResults([])}if(e.key==="Escape"&&searchOpen)closeSearch()};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[searchOpen,closeSearch]);\n useEffect(()=>{if(searchOpen)setTimeout(()=>inputRef.current?.focus(),50)},[searchOpen]);'
          if old not in s: raise SystemExit('Header lint-fix anchor missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit lint fix
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add components/layout/Header.tsx
            git commit -m "fix(uiux): stabilize search focus callback"
            git push origin HEAD:fix/uiux-interaction-polish-2026-08-31
          fi
      - run: npm ci
      - run: node scripts/qa-html-ten-pass.mjs
      - run: npm run qa:mobile-ux
      - run: npm run qa:resilience-ux
      - run: npm run qa:rbac-security
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
