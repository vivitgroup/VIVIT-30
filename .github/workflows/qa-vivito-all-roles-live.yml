name: VIVITO All Roles Live Certification
on:
  push:
    branches: [qa/vivito-all-roles-live-2026-08-31]
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Isolated live role scope verification
        run: node scripts/vivito-live-scope-audit.mjs
