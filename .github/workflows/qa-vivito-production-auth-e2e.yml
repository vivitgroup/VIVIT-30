name: VIVITO 150 Case Production Exam

on:
  push:
    branches:
      - qa/vivito-prod-auth-e2e-2026-08-31

permissions:
  contents: read

jobs:
  vivito-150-exam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 100 questions and 50 task cases
        run: node scripts/vivito-150-exam.mjs
