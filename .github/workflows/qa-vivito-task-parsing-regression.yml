name: VIVITO Task Parsing Regression

on:
  push:
    branches:
      - qa/manual-vivito-task-regression

permissions:
  contents: read

jobs:
  task-parsing-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 50 task parsing cases against Preview
        run: node scripts/vivito-task-parsing-regression.mjs

# Frozen after 50/50 certification on the fix branch. Re-enable only for intentional regression runs.
