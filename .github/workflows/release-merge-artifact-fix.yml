name: Release Merge Artifact Fix
on:
  push:
    branches: [release/reconcile-2026-09-02]
    paths:
      - .github/workflows/release-merge-artifact-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/reconcile-2026-09-02
          fetch-depth: 0
      - name: Fix three-way merge artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app/dashboard/monthly-reports/page.tsx')
          s=p.read_text()
          old='  const userId=String(sessionUser.id||""),workspaceId=String(sessionUser.workspaceId||"");if(!workspaceId)redirect("/login");'
          new='  const userId=String(sessionUser.id||"");'
          assert old in s
          s=s.replace(old,new,1)
          old='    const {db,clients,contacts,financeRecords,sql}=await import("@/lib/db");'
          new='    const {db,clients,contacts,financeRecords,auditLogs,sql}=await import("@/lib/db");'
          assert old in s
          s=s.replace(old,new,1)
          old='    const currentUserId=String(currentUser?.id||""),currentWorkspaceId=String(currentUser?.workspaceId||"");\n    if(!currentUserId||!currentWorkspaceId)throw new Error("Workspace unavailable");'
          new='    const currentUserId=String(currentUser?.id||"");\n    if(!currentUserId)throw new Error("User unavailable");'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('components/clients/NewClientForm.tsx')
          s=p.read_text()
          old='{!isMediaBuyer&&<label className="form-label">MEDIA BUYER<select name="mediaBuyerId" className="form-select"><option value="">Unassigned</option>{buyers.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select></label>}{isMediaBuyer&&<div className="form-label">MEDIA BUYER<div className="form-input" style={{display:"flex",alignItems:"center",opacity:.8}}>Assigned to your account automatically</div></div>}'
          new='<label className="form-label">MEDIA BUYER<select name="mediaBuyerId" className="form-select"><option value="">Unassigned</option>{buyers.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select></label>'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name vivitgroup
          git config user.email groupvivit@gmail.com
          git rm .github/workflows/release-merge-artifact-fix.yml
          git add app/dashboard/monthly-reports/page.tsx components/clients/NewClientForm.tsx
          git commit -m "fix(release): resolve reconciled report and client form artifacts"
          git push origin HEAD:release/reconcile-2026-09-02
