name: Release v39 Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-v39-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic release cleanup
        run: |
          sed -i 's/\.badge-blue,                    {/\.badge-blue                     {/' app/globals.css
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- app/globals.css package-lock.json; then
            git config user.name "vivit-release-bot"
            git config user.email "groupvivit@gmail.com"
            git add app/globals.css package-lock.json
            git commit -m "Finalize CSS and dependency lock for v39"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install dependencies
        run: npm install

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Static QA
        run: npm run qa:static

      - name: Type check
        run: npm run type-check

      - name: Production build
        run: npx next build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000
