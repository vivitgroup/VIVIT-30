name: Release v39 Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-v39-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed release
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Static QA
        run: npm run qa:static

      - name: Type check
        run: npm run type-check

      - name: Production build
        run: npx next build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000
