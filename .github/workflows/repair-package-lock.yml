name: Repair Package Lock

on:
  push:
    branches:
      - audit/hospitality-100-integration
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/repair-package-lock.yml

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]' || contains(github.event.head_commit.message, 'ci: repair and verify package lock')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: audit/hospitality-100-integration
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package manifest
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Verify deterministic install
        run: npm ci
      - name: Verify production security
        run: npm audit --omit=dev --audit-level=high
      - name: Verify complete installed dependency tree
        run: npm ls --all
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already consistent'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(deps): regenerate consistent package lock'
          git push origin HEAD:audit/hospitality-100-integration
