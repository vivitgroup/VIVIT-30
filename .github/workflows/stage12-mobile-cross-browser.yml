name: Stage 12 Mobile Cross-Browser E2E

on:
  push:
    branches:
      - audit/finance-deep-2026-09-01

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://build:build@127.0.0.1:5432/vivit_build
  NEXTAUTH_SECRET: exact-head-ci-stage12-secret-not-for-production
  AUTH_SECRET: exact-head-ci-stage12-secret-not-for-production
  NEXTAUTH_URL: http://127.0.0.1:3000
  AUTH_URL: http://127.0.0.1:3000
  CRON_SECRET: exact-head-ci-cron-secret-not-for-production

jobs:
  mobile-cross-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Existing mobile UX contracts
        run: npm run qa:mobile-ux

      - name: TypeScript
        run: npm run type-check

      - name: Exact-head production build
        run: npx next build

      - name: Install Playwright runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Start exact-head server
        run: |
          npm start > /tmp/vivit-stage12.log 2>&1 &
          echo $! > /tmp/vivit-stage12.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vivit-stage12.log
          exit 1

      - name: Chromium Firefox WebKit desktop and mobile E2E
        env:
          QA_BASE_URL: http://127.0.0.1:3000
        run: node scripts/qa-stage12-browser-e2e.mjs

      - name: Server log safety check
        if: always()
        run: |
          test -f /tmp/vivit-stage12.log && tail -n 200 /tmp/vivit-stage12.log || true
          if test -f /tmp/vivit-stage12.pid; then kill "$(cat /tmp/vivit-stage12.pid)" || true; fi
