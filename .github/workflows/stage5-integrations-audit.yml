name: Stage 5 Integrations Audit

on:
  push:
    branches:
      - audit/finance-deep-2026-09-01

permissions:
  contents: read

jobs:
  integrations-audit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/vivit_build
      NEXTAUTH_SECRET: stage5-ci-secret-not-for-production
      AUTH_SECRET: stage5-ci-secret-not-for-production
      NEXTAUTH_URL: http://127.0.0.1:3000
      AUTH_URL: http://127.0.0.1:3000
      OAUTH_ENCRYPTION_KEY: stage5-exact-head-ci-encryption-key-000000000000
      CRON_SECRET: stage5-exact-head-ci-cron-secret
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Stage 5 integration contract
        run: node scripts/qa-integrations-stage5.mjs
      - name: Existing media control regression
        run: npm run qa:media-control
      - name: Existing media pagination regression
        run: npm run qa:media-pagination
      - name: ESLint
        run: npm run lint -- --max-warnings=0
      - name: TypeScript
        run: npm run type-check
      - name: Exact-head production compile
        run: npx next build
