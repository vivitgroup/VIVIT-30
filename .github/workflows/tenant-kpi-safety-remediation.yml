name: Tenant KPI Safety Remediation
on:
  push:
    branches: [feat/vivito-internal-100]
    paths: [.github/workflows/tenant-kpi-safety-remediation.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - name: Apply tenant and legacy media safety fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path,a,b,minimum=1):
              p=Path(path); s=p.read_text(); n=s.count(a)
              if n<minimum: raise SystemExit(f"{path}: missing pattern: {a[:100]}")
              p.write_text(s.replace(a,b))

          # Client detail and server action must be fenced to the authenticated workspace.
          p=Path('app/dashboard/clients/[id]/page.tsx'); s=p.read_text()
          replace('app/dashboard/clients/[id]/page.tsx',
            'const role=String(s.user.role||""),uid=String(s.user.id||"");if(!["SUPER_ADMIN","ACCOUNT_MANAGER","MEDIA_BUYER"].includes(role))throw new Error("Forbidden");const rows=Array.from(await db.execute<ClientAccessRow>(sql`select id,account_manager_id,media_buyer_id from clients where id=${clientId} and is_active=true limit 1`))',
            'const role=String(s.user.role||""),uid=String(s.user.id||""),workspaceId=String(s.user.workspaceId||"");if(!workspaceId||!["SUPER_ADMIN","ACCOUNT_MANAGER","MEDIA_BUYER"].includes(role))throw new Error("Forbidden");const rows=Array.from(await db.execute<ClientAccessRow>(sql`select id,account_manager_id,media_buyer_id from clients where id=${clientId} and workspace_id=${workspaceId} and is_active=true and archived_at is null and deleted_at is null limit 1`))')
          replace('app/dashboard/clients/[id]/page.tsx',
            'const role=String(s.user.role||""),uid=String(s.user.id||""),{id}=await params,q=await searchParams',
            'const role=String(s.user.role||""),uid=String(s.user.id||""),workspaceId=String(s.user.workspaceId||"");if(!workspaceId)redirect("/login");const {id}=await params,q=await searchParams')
          replace('app/dashboard/clients/[id]/page.tsx',
            'where c.id=${id} and c.is_active=true limit 1',
            'where c.id=${id} and c.workspace_id=${workspaceId} and c.is_active=true and c.archived_at is null and c.deleted_at is null limit 1')

          # Legacy media endpoint remains backward compatible but must return only canonical active campaign totals.
          p=Path('app/api/media-control/route.ts'); s=p.read_text()
          s=s.replace('auditLogs} from "@/lib/db"','auditLogs,sql} from "@/lib/db"')
          s=s.replace('const campaignRows=await db.select().from(adCampaigns).where(inArray(adCampaigns.clientId,ctx.clientIds)).orderBy(desc(adCampaigns.updatedAt));',
            'const campaignRows=await db.select().from(adCampaigns).where(and(inArray(adCampaigns.clientId,ctx.clientIds),eq(adCampaigns.workspaceId,ctx.workspaceId),sql`${adCampaigns.id} in (select id from ad_campaigns where workspace_id=${ctx.workspaceId} and archived_at is null and deleted_at is null)`)).orderBy(desc(adCampaigns.updatedAt));')
          s=s.replace('db.select().from(adPerformanceDaily).where(and(inArray(adPerformanceDaily.campaignId,ids),gte(adPerformanceDaily.date,new Date(Date.now()-31*86400000))))',
            'db.select().from(adPerformanceDaily).where(and(inArray(adPerformanceDaily.campaignId,ids),gte(adPerformanceDaily.date,new Date(Date.now()-31*86400000)),eq(adPerformanceDaily.breakdownType,"TOTAL"),isNull(adPerformanceDaily.adSetId),isNull(adPerformanceDaily.adId)))')
          s=s.replace('.values({clientId:body.clientId,platform:parsed.platform,externalId:parsed.externalId,', '.values({workspaceId:ctx.workspaceId,clientId:body.clientId,platform:parsed.platform,externalId:parsed.externalId,')
          s=s.replace('.values({clientId:body.clientId,name:String(body.name||""),periodStart,periodEnd,totalBudget:budget,', '.values({workspaceId:ctx.workspaceId,clientId:body.clientId,name:String(body.name||""),periodStart,periodEnd,totalBudget:budget,')
          s=s.replace('.values({clientId:body.clientId,platform,adAccountId:String(body.adAccountId||""),', '.values({workspaceId:ctx.workspaceId,clientId:body.clientId,platform,adAccountId:String(body.adAccountId||""),')
          p.write_text(s)

          # Guard contract.
          Path('scripts/qa-kpi-tenant-safety.mjs').write_text('''import fs from "node:fs";\nconst read=p=>fs.readFileSync(p,"utf8"),client=read("app/dashboard/clients/[id]/page.tsx"),legacy=read("app/api/media-control/route.ts"),checks=[\n["Client detail workspace fenced",client.includes("c.workspace_id=${workspaceId}")&&client.includes("c.deleted_at is null")],\n["Client activity workspace fenced",client.includes("workspace_id=${workspaceId} and is_active=true and archived_at is null and deleted_at is null")],\n["Legacy media campaign lifecycle fenced",legacy.includes("workspace_id=${ctx.workspaceId} and archived_at is null and deleted_at is null")],\n["Legacy media returns TOTAL root rows",legacy.includes('eq(adPerformanceDaily.breakdownType,"TOTAL")')&&legacy.includes("isNull(adPerformanceDaily.adSetId)")&&legacy.includes("isNull(adPerformanceDaily.adId)")],\n["Legacy media writes explicit workspace",legacy.includes("workspaceId:ctx.workspaceId,clientId:body.clientId")],\n];let bad=0;for(const [n,ok] of checks){console.log((ok?"PASS":"FAIL")+"  "+n);if(!ok)bad++}if(bad)process.exit(1);\n''')
          PY
          node scripts/qa-kpi-tenant-safety.mjs
      - name: Commit fixes
        run: |
          git config user.name vivitgroup
          git config user.email groupvivit@gmail.com
          git add app scripts/qa-kpi-tenant-safety.mjs
          git commit -m "fix(data): fence client KPIs and legacy media by workspace"
          git push origin HEAD:feat/vivito-internal-100
