name: Unpack VIVIT ERP V34
on:
  push:
    branches: [release/v34-oauth]
    paths: [VIVIT-ERP-v34-OAuth-Ready.zip]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v34-oauth
      - name: Replace repository with V34 source
        run: |
          unzip -o VIVIT-ERP-v34-OAuth-Ready.zip -d .
          rm VIVIT-ERP-v34-OAuth-Ready.zip
      - name: Commit V34 source
        run: |
          git config user.name "vivitgroup"
          git config user.email "groupvivit@gmail.com"
          git add -A
          git commit -m "Release V34 OAuth-ready media control" || exit 0
          git push
