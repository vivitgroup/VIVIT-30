name: Vercel Production Prebuilt Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vercel-production-prebuilt.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/vercel-prebuilt-production-trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-prebuilt
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_7bnFfb65k7YtwywgLu2vtN1R
      VERCEL_PROJECT_ID: prj_Tgvk58HLEYlXHepCoUfNEUKfMqig
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout production commit
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Vercel deploy token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN repository secret is not configured"
            exit 1
          fi

      - name: Install application dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production project configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production output locally
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
