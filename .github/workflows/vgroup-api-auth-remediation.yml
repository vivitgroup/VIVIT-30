name: Vivit Group API Auth Remediation

on:
  push:
    branches:
      - integration/vgroup-marketing-dry-run

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'chore(vgroup): trigger API auth remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped remediation
        run: node scripts/remediate-vgroup-api-auth-boundaries.mjs
      - name: Commit remediated routes
        run: |
          if git diff --quiet -- app/api/vgroup; then
            echo "No route changes required"
            exit 0
          fi
          git config user.name "vivitgroup"
          git config user.email "groupvivit@gmail.com"
          git add app/api/vgroup
          git commit -m "fix(vgroup): remediate API auth boundaries [skip ci]"
          git push origin HEAD:integration/vgroup-marketing-dry-run
