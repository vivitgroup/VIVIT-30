name: VIVITO Artifact V2 Integrator
on:
  push:
    branches: ["fix/vivito-artifacts-v2"]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[artifact-v2-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply idempotent integration patch
        run: node scripts/apply-vivito-artifacts-v2.mjs
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "vivitgroup"
          git config user.email "groupvivit@gmail.com"
          git add app/api/assistant/route.ts components/assistant/SystemAssistant.tsx package.json
          git commit -m "feat(vivito): wire automatic artifacts vision research [artifact-v2-applied]"
          git push origin HEAD:fix/vivito-artifacts-v2
