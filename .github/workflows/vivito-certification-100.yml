name: VIVITO Strict 100 Certification
on:
  push:
    branches: [qa/100-percent-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vivito
          POSTGRES_PASSWORD: vivito
          POSTGRES_DB: vivito_cert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vivito -d vivito_cert"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vivito:vivito@127.0.0.1:5432/vivito_cert
      DRIZZLE_DATABASE_URL: postgres://vivito:vivito@127.0.0.1:5432/vivito_cert
      DATABASE_SSL_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Full release build
        run: npm run build
      - name: Build ephemeral certification schema
        run: npx drizzle-kit push --force
      - name: Run staged database execution certification
        run: npx tsx scripts/certify-vivito-execution-e2e.ts
      - name: Run adversarial RBAC certification
        run: npx tsx scripts/certify-vivito-security-e2e.ts
      - name: Generate artifact binary evidence
        run: npx tsx scripts/certify-vivito-artifacts-e2e.ts
      - name: Run provider-backed 100-case intelligence exam when keys exist
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIVITO_BENCHMARK_LIMIT: '100'
          VIVITO_BENCHMARK_THRESHOLD: '100'
          VIVITO_BENCHMARK_ENFORCE: '1'
        run: |
          mkdir -p .vivito
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            npm run eval:vivito
          else
            echo '{"blocked":true,"reason":"No GEMINI_API_KEY or ANTHROPIC_API_KEY in GitHub Actions"}' > .vivito/benchmark-blocked.json
          fi
      - name: Strict certification decision
        id: certify
        continue-on-error: true
        run: node scripts/certify-vivito-100.mjs
      - name: Upload certification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivito-certification-evidence
          path: .vivito/
          if-no-files-found: warn
          include-hidden-files: true
      - name: Enforce certification
        if: steps.certify.outcome != 'success'
        run: |
          echo 'VIVITO is not 100/100 certified. See certification evidence artifact for blockers.'
          exit 1
