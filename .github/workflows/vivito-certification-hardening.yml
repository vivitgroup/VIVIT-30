name: VIVITO Certification Hardening
on:
  push:
    branches: [fix/vivito-competitive-intel]
    paths:
      - 'scripts/patch-vivito-certification-hardening.mjs'
      - '.github/workflows/vivito-certification-hardening.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vivito-competitive-intel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-vivito-certification-hardening.mjs
      - name: Commit hardened operator
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/vivito/executor-operator.ts
          git commit -m 'fix(vivito): harden bulk updates and referrals'
          git push origin HEAD:fix/vivito-competitive-intel
