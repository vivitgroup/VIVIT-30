name: VIVITO File Upload Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivito-file-upload-cert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  file-upload-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Certify VIVITO upload safety policy
        run: npx tsx scripts/qa-vivito-file-upload-policy-v1.ts
