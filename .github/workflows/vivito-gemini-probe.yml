name: VIVITO Gemini Availability Probe

on:
  push:
    branches:
      - fix/vivito-certification-final
    paths:
      - .github/workflows/vivito-gemini-probe.yml
      - lib/vivito/providers.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Probe current Free Tier Gemini models
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured"
            exit 2
          fi

          node <<'NODE'
          const candidates = [
            "gemini-3.7-flash",
            "gemini-3.6-flash",
            "gemini-3.5-flash",
            "gemini-3.5-flash-lite",
          ];

          const key = process.env.GEMINI_API_KEY;
          const headers = {
            "Content-Type": "application/json",
            "x-goog-api-key": key,
          };

          const compact = (value, max = 180) => String(value || "")
            .replace(/[\r\n\t]+/g, " ")
            .replace(/\s+/g, " ")
            .slice(0, max);

          let listed = new Set();
          try {
            const listResponse = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000", { headers });
            const listBody = await listResponse.json().catch(() => ({}));
            listed = new Set((listBody.models || []).map((model) => String(model.name || "").replace(/^models\//, "")));
            console.log(`model-list http=${listResponse.status}`);
          } catch (error) {
            console.log(`model-list error=${compact(error?.message || error)}`);
          }

          let working = 0;
          for (const model of candidates) {
            const isListed = listed.size ? listed.has(model) : null;
            try {
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
                method: "POST",
                headers,
                body: JSON.stringify({
                  contents: [{ role: "user", parts: [{ text: "Reply exactly: OK" }] }],
                  generationConfig: { maxOutputTokens: 16 },
                }),
              });
              const body = await response.json().catch(() => ({}));
              if (response.ok) {
                working += 1;
                console.log(`PASS ${model} listed=${isListed ?? "unknown"} http=${response.status}`);
              } else {
                const status = compact(body?.error?.status || "error", 60);
                const message = compact(body?.error?.message || `HTTP ${response.status}`);
                console.log(`FAIL ${model} listed=${isListed ?? "unknown"} http=${response.status} status=${status} message=${message}`);
              }
            } catch (error) {
              console.log(`FAIL ${model} listed=${isListed ?? "unknown"} network=${compact(error?.message || error)}`);
            }
          }

          console.log(`working_models=${working}/${candidates.length}`);
          if (!working) process.exit(1);
          NODE
