name: VIVITO Group Governance

on:
  pull_request:
    paths:
      - 'app/api/vgroup/vivito/**'
      - 'lib/vgroup/vivito-*.ts'
      - 'scripts/qa-vgroup-vivito-governance.mjs'
      - '.github/workflows/vivito-group-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: VIVITO governance static QA
        run: node scripts/qa-vgroup-vivito-governance.mjs
      - name: Type check
        run: npm run type-check
