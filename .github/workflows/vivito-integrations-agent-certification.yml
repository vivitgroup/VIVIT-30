name: VIVITO Integrations Agent Certification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivito-integrations-agent-cert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrations-agent-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Certify VIVITO integration agent safety invariants
        run: node scripts/qa-vivito-external-writes.mjs
