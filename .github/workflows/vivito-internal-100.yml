name: VIVITO Internal 100

on:
  push:
    branches: [feat/vivito-internal-100]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vivito
          POSTGRES_PASSWORD: vivito
          POSTGRES_DB: vivito_internal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vivito -d vivito_internal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vivito:vivito@127.0.0.1:5432/vivito_internal
      DRIZZLE_DATABASE_URL: postgresql://vivito:vivito@127.0.0.1:5432/vivito_internal
      DATABASE_SSL_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build base ephemeral database
        run: npx drizzle-kit push --force
      - name: Apply Direct Operator V1 persistence
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20260828_vivito_direct_operator.sql
      - name: Apply Direct Operator V2 hardening
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20260828_vivito_direct_operator_v2.sql
      - name: Verify tenant-safe persistence
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          select case when to_regclass('public.vivito_autonomy_events') is not null then 1 else 1/0 end;
          select case when to_regclass('public.vivito_approval_events') is not null then 1 else 1/0 end;
          select case when to_regclass('public.vivito_decision_journal') is not null then 1 else 1/0 end;
          select case when to_regclass('public.vivito_escalations') is not null then 1 else 1/0 end;
          select case when exists(select 1 from pg_class where oid='public.vivito_autonomy_events'::regclass and relrowsecurity) then 1 else 1/0 end;
          SQL
      - name: Direct Operator V2 invariants
        run: node scripts/qa-vivito-direct-runtime-v2.mjs
      - name: Type check
        run: npm run type-check
      - name: Full release build
        run: npm run build
