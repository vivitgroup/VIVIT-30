name: VIVITO Model Certification Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivito-model-cert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  model-cert-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify router failover and manual pinning contracts
        run: npx tsx scripts/qa-vivito-model-mesh-v1.ts
      - name: Verify OAuth runtime certification wiring
        run: |
          grep -F 'qa-vivito-live-model-cert-preview.mjs' scripts/vercel-build.mjs
          grep -F '/api/vivito/openrouter/certify' app/group/vivito/page.tsx
          grep -F 'OPENROUTER_KEY_COOKIE' app/api/vivito/openrouter/callback/route.ts
          grep -F 'OAuth-based OpenRouter runtime certification' scripts/qa-vivito-live-model-cert-preview.mjs
      - name: Run full multi-provider live certification when both CI credentials exist
        if: ${{ env.AI_GATEWAY_API_KEY != '' && env.OPENROUTER_API_KEY != '' }}
        run: npx tsx scripts/qa-vivito-live-model-cert.ts
      - name: Declare post-deploy proof source otherwise
        if: ${{ env.OPENROUTER_API_KEY == '' }}
        run: echo 'Final >=20 distinct free-model proof is authenticated post-deploy via OpenRouter OAuth and /api/vivito/openrouter/certify. Vercel AI Gateway is optional.'
