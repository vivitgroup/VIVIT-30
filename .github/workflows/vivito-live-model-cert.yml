name: VIVITO Model Certification Contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivito-model-cert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  model-cert-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify router failover and manual pinning contracts
        run: npx tsx scripts/qa-vivito-model-mesh-v1.ts
      - name: Verify exact-preview live-cert wiring
        run: |
          grep -F 'qa-vivito-live-model-cert-preview.mjs' scripts/vercel-build.mjs
          grep -F 'audit/vivito-200-operating-agent' scripts/qa-vivito-live-model-cert-preview.mjs
          grep -F 'VERCEL_OIDC_TOKEN' scripts/qa-vivito-live-model-cert.ts
      - name: Run live certification when GitHub credential exists
        if: ${{ env.AI_GATEWAY_API_KEY != '' }}
        run: npx tsx scripts/qa-vivito-live-model-cert.ts
      - name: Declare live proof source when GitHub credential is absent
        if: ${{ env.AI_GATEWAY_API_KEY == '' }}
        run: echo 'Live >=20-model certification is fail-closed inside the exact Vercel preview build via VERCEL_OIDC_TOKEN.'
