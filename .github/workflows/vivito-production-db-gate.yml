name: VIVITO Production DB Offline Certification

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: vivito-production-db-offline-cert-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  offline-production-db-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$ACTUAL" = "$EXPECTED"

      - name: Certify Production migration plan offline
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/vivito-production-db-gate.mjs
          test -f RELEASE-RUNBOOK.md
          grep -Fq "CI must not connect to Production for backup, restore, migration, or validation" RELEASE-RUNBOOK.md
          grep -Fq "Stage 14 — Final CTO Acceptance" RELEASE-RUNBOOK.md
          grep -Fq "VIVITO_PROD_DB_MODE" scripts/vivito-production-db-gate.mjs
          grep -Fq "APPLY" scripts/vivito-production-db-gate.mjs
          grep -Fq "sql.begin" scripts/vivito-production-db-gate.mjs
          if grep -Eq 'PROD_DATABASE_URL[[:space:]]*:[[:space:]]*\$\{\{[[:space:]]*secrets\.' .github/workflows/*.yml; then
            echo "Refusing CI workflow access to Production database credentials."
            exit 1
          fi
          echo "Production DB plan certification: PASS (offline only; no Production credential or connection)."
