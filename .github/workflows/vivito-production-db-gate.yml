name: VIVITO Production DB Change Guard

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: vivito-production-db-change-guard-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  production-db-change-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$ACTUAL" = "$EXPECTED"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release and database change safety contracts
        run: |
          node scripts/qa-release-operations.mjs
          node scripts/qa-vivito-production-hardening.mjs

      - name: Enforce no Production database access from CI
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'PROD_DATABASE_URL|PRODUCTION_DATABASE_URL|supabase[[:space:]]+db[[:space:]]+push.*(production|prod)|prisma[[:space:]]+migrate[[:space:]]+deploy.*(production|prod)' .github/workflows
          echo "PASS: GitHub Actions contains no Production database credential or write path."

      - name: Record execution boundary
        run: |
          echo "Production migrations are not executed by GitHub Actions."
          echo "Any approved Production database change must follow RELEASE-RUNBOOK.md backup, restore-readiness, exact-SHA, and CTO acceptance controls outside feature-branch CI."
