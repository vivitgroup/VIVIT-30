name: Vivito Role Context Remediation
on:
  push:
    branches: [feat/vivito-internal-100]
    paths: [.github/workflows/vivito-role-context-remediation.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vivito-internal-100
          fetch-depth: 0
      - name: Harden lifecycle context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/api/assistant/route.ts'); s=p.read_text()
          patches=[
            ("c.workspace_id=${workspaceId} and c.is_active=true and t.assigned_to_id", "c.workspace_id=${workspaceId} and c.is_active=true and c.archived_at is null and c.deleted_at is null and t.assigned_to_id"),
            ("c.workspace_id=${workspaceId} and c.is_active=true and t.client_id in", "c.workspace_id=${workspaceId} and c.is_active=true and c.archived_at is null and c.deleted_at is null and t.client_id in"),
            ("where ac.workspace_id=${workspaceId} and c.workspace_id=${workspaceId} and ac.client_id in", "where ac.workspace_id=${workspaceId} and c.workspace_id=${workspaceId} and c.is_active=true and c.archived_at is null and c.deleted_at is null and ac.client_id in"),
            ("where c.workspace_id=${workspaceId} and c.is_active=true and t.client_id in", "where c.workspace_id=${workspaceId} and c.is_active=true and c.archived_at is null and c.deleted_at is null and t.client_id in"),
            ("where workspace_id=${workspaceId} and is_active=true and id in", "where workspace_id=${workspaceId} and is_active=true and archived_at is null and deleted_at is null and id in"),
            ("where l.workspace_id=${workspaceId} and l.archived_at is null ${ownerFilter}", "where l.workspace_id=${workspaceId} and l.archived_at is null and l.deleted_at is null ${ownerFilter}"),
            ("where c.workspace_id=${workspaceId} and c.is_active=true and p.client_id in", "where c.workspace_id=${workspaceId} and c.is_active=true and c.archived_at is null and c.deleted_at is null and p.client_id in"),
          ]
          changed=0
          for a,b in patches:
            if a in s:
              s=s.replace(a,b)
              changed+=1
          if changed < 7:
            raise SystemExit(f'expected 7 lifecycle patches, applied {changed}')
          p.write_text(s)
          Path('scripts/qa-vivito-lifecycle-context.mjs').write_text('''import fs from "node:fs";const s=fs.readFileSync("app/api/assistant/route.ts","utf8"),checks=[
["Task context excludes deleted clients",s.includes("c.archived_at is null and c.deleted_at is null and t.assigned_to_id")&&s.includes("c.archived_at is null and c.deleted_at is null and t.client_id in"))],
["Media context excludes deleted clients",s.includes("c.is_active=true and c.archived_at is null and c.deleted_at is null and ac.client_id in"))],
["Tracking context excludes deleted clients",s.includes("c.archived_at is null and c.deleted_at is null and t.client_id in"))],
["Client health excludes deleted clients",s.includes("is_active=true and archived_at is null and deleted_at is null and id in"))],
["Sales context excludes deleted leads",s.includes("l.archived_at is null and l.deleted_at is null"))],
["Finance context excludes deleted clients",s.includes("c.archived_at is null and c.deleted_at is null and p.client_id in"))],
];let bad=0;for(const [n,ok] of checks){console.log((ok?"PASS":"FAIL")+"  "+n);if(!ok)bad++}if(bad)process.exit(1);'''.replaceAll('))],',')],').replaceAll('))],',')],'))
          PY
          node scripts/qa-vivito-lifecycle-context.mjs
      - name: Commit fix
        run: |
          git config user.name vivitgroup
          git config user.email groupvivit@gmail.com
          git add app/api/assistant/route.ts scripts/qa-vivito-lifecycle-context.mjs
          git commit -m "fix(vivito): exclude deleted lifecycle data from context"
          git push origin HEAD:feat/vivito-internal-100
